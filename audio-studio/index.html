<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>媒体工坊 · 音频</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { background: #141519; color: #e8e9ec; font: 13px/1.45 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; display: flex; flex-direction: column; overflow: hidden; }
  button { background: #2a2c33; color: #e8e9ec; border: 1px solid #3a3d46; border-radius: 6px; padding: 4px 10px; cursor: pointer; font-size: 13px; }
  button:hover { background: #34363f; }
  button.on { background: #b03060; border-color: #b03060; color: #fff; }
  button.rec.on { background: #d43a3a; border-color: #d43a3a; }
  button.acc { background: #1f5f58; border-color: #2a7a72; }
  select, input[type="text"], input[type="number"] { background: #22242a; color: #e8e9ec; border: 1px solid #3a3d46; border-radius: 6px; padding: 4px 6px; font-size: 13px; }
  input[type="range"] { accent-color: #b03060; }
  .lab { color: #9aa0ad; font-size: 12px; }
  #top, #topMidi, #topAudio { display: flex; align-items: center; gap: 14px; padding: 8px 12px; background: #1b1c21; border-bottom: 1px solid #2c2e36; flex-wrap: wrap; }
  .logo { font-size: 15px; font-weight: 600; }
  .grp { display: inline-flex; align-items: center; gap: 6px; flex: 0 0 auto; }
  #titleIn { width: 150px; }
  #liveChord { color: #ffd166; font-weight: 600; min-width: 84px; }
  #status { color: #8fd0c5; }
  #main { flex: 1; overflow: hidden; padding: 10px 12px; display: flex; flex-direction: column; gap: 10px; }
  .laneBox { flex: 1 1 0; min-height: 110px; display: flex; flex-direction: column; background: #1b1c21; border: 1px solid #2c2e36; border-radius: 8px; padding: 8px 10px 10px; overflow-x: auto; overflow-y: hidden; }
  .laneHead { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .maxBtn { margin-left: auto; padding: 2px 9px; line-height: 1.2; }
  .laneName { font-weight: 600; font-size: 13px; }
  .laneName.mel { color: #ffd166; }
  .laneName.har { color: #7fd4c9; }
  canvas.lane { display: block; width: 100%; background: #101116; border-radius: 6px; cursor: crosshair; }
  #dlgMask { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none; align-items: center; justify-content: center; z-index: 50; }
  #dlg { background: #22242b; border: 1px solid #3a3d46; border-radius: 10px; padding: 16px; width: 430px; }
  #dlg h3 { font-size: 14px; margin-bottom: 10px; }
  .gridBtns { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 10px; }
  .gridBtns button { min-width: 40px; }
  .gridBtns button.sel { background: #b03060; border-color: #b03060; color: #fff; }
  #dlgFoot { display: flex; gap: 8px; justify-content: flex-end; margin-top: 6px; }
  #toast { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); background: #2b2d34; border: 1px solid #454854; padding: 7px 16px; border-radius: 8px; display: none; z-index: 60; }
  .logoBtn { background: none; border: none; padding: 2px 4px; font-size: 15px; font-weight: 600; color: #e8e9ec; cursor: pointer; }
  .logoBtn:hover { background: #2a2c33; }
  /* ===== 录音助手模式 ===== */
  #audMain { flex: 1; overflow: hidden; padding: 10px 12px; display: flex; flex-direction: column; gap: 10px; }
  #audScroll { flex: 1; overflow: auto; background: #1b1c21; border: 1px solid #2c2e36; border-radius: 8px; }
  #audInner { display: grid; grid-template-columns: 172px 1fr; min-height: 100%; position: relative; }
  #audHeads { position: sticky; left: 0; z-index: 3; background: #1e1f25; border-right: 1px solid #2c2e36; }
  .audHead { padding: 6px 8px; border-bottom: 1px solid #26272f; cursor: pointer; overflow: hidden; }
  .audHead.sel { background: #26232e; box-shadow: inset 3px 0 0 #b03060; }
  .audHead .r1 { display: flex; align-items: center; gap: 5px; }
  .audHead .tname { flex: 1; min-width: 0; background: transparent; border: 1px solid transparent; color: #e8e9ec; font-size: 13px; font-weight: 600; padding: 1px 3px; }
  .audHead .tname:focus { border-color: #3a3d46; background: #22242a; outline: none; }
  .audHead .mini { padding: 1px 7px; font-size: 11px; border-radius: 5px; line-height: 1.5; }
  .audHead .arm.on { background: #d43a3a; border-color: #d43a3a; color: #fff; }
  .audHead .ms.on { background: #b03060; border-color: #b03060; color: #fff; }
  .audHead .r2 { display: flex; align-items: center; gap: 5px; margin-top: 5px; }
  .audHead .vol { flex: 1; min-width: 40px; }
  .meter { height: 5px; background: #14151a; border-radius: 3px; margin-top: 6px; overflow: hidden; }
  .meter > div { height: 100%; width: 0%; background: linear-gradient(90deg, #57c785, #f2b134 70%, #d43a3a); }
  #audCanvas { display: block; cursor: crosshair; position: absolute; top: 0; }
  #audPos { display: inline-block; min-width: 56px; font-variant-numeric: tabular-nums; }
  #audFx { background: #1b1c21; border: 1px solid #2c2e36; border-radius: 8px; padding: 8px 12px 10px; height: 276px; flex: 0 0 auto; display: flex; flex-direction: column; overflow: hidden; }
  .fxHead { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; flex-wrap: wrap; }
  .fxHead .fxTab.on { background: #b03060; border-color: #b03060; color: #fff; }
  .fxPage { display: none; }
  .fxPage.on { display: flex; flex-direction: column; flex: 1; min-height: 0; }
  #fxPageEq .eqWrap { flex: 1; align-items: center; }
  #fxPageRev .fxSliders, #fxPageComp .fxSliders, #fxPageGain .fxSliders { flex: 1; align-items: center; }
  .mGrid { display: grid; grid-template-columns: repeat(3, minmax(190px, 1fr)); gap: 12px 36px; flex: 1; align-content: center; }
  .mGrid .fxCtl input[type="range"] { width: 100%; }
  #masterOn.on, #btnMaster.on { background: #1f5f58; border-color: #2a7a72; color: #fff; }
  #masterPop { position: fixed; top: 96px; right: 12px; width: 640px; max-width: calc(100vw - 24px); background: #1b1c21; border: 1px solid #3a3d46; border-radius: 10px; padding: 12px 14px; z-index: 45; box-shadow: 0 14px 34px rgba(0,0,0,.55); }
  #masterPop .mGrid { flex: none; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px 20px; }
  .vuRow { display: flex; align-items: center; gap: 8px; margin-top: 9px; }
  .vuRow .lab { width: 44px; flex: none; }
  .vu { flex: 1; height: 10px; background: #14151a; border-radius: 4px; overflow: hidden; }
  .vu > div { height: 100%; width: 0%; background: linear-gradient(90deg, #57c785 55%, #f2b134 78%, #d43a3a 96%); }
  #fxPageSpace .spaceWrap { flex: 1; align-items: center; }
  .presetRow { display: flex; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; }
  .presetRow button.on { background: #1f5f58; border-color: #2a7a72; color: #fff; }
  .eqWrap { display: flex; gap: 2px; justify-content: space-between; }
  .eqCol { display: flex; flex-direction: column; align-items: center; gap: 2px; width: 62px; }
  .eqCol .gv { font-size: 10px; color: #9aa0ad; height: 13px; }
  .eqCol .fl { font-size: 10px; color: #9aa0ad; }
  input[type="range"].vsl { -webkit-appearance: slider-vertical; appearance: slider-vertical; width: 22px; height: 96px; }
  .fxSliders { display: flex; gap: 26px; align-items: flex-start; flex-wrap: wrap; }
  .fxCtl { display: flex; flex-direction: column; gap: 3px; }
  .fxCtl .lab b { color: #e8e9ec; font-weight: 600; }
  #radar { background: #101116; border: 1px solid #2c2e36; border-radius: 8px; cursor: grab; touch-action: none; }
  #radar:active { cursor: grabbing; }
  .spaceWrap { display: flex; gap: 18px; align-items: flex-start; }

  body { height: 100vh; }
  #audFx { flex-direction: row; padding: 0; gap: 0; }
  .audFxL { flex: 1; min-width: 0; display: flex; flex-direction: column; padding: 8px 12px 10px; overflow: hidden; }
  #audSide { width: auto; flex: none; border-left: 1px solid #2c2e36; padding: 10px 16px; display: flex; flex-direction: row; gap: 20px; align-items: stretch; justify-content: center; }
  .sideCol { display: flex; flex-direction: column; align-items: center; gap: 6px; justify-content: flex-end; }
  .sideCol .lab { text-align: center; line-height: 1.5; }
  .vuV { width: 16px; flex: 1; min-height: 80px; background: #26272f; border-radius: 3px; position: relative; overflow: hidden; }
  .vuV > div { position: absolute; bottom: 0; left: 0; width: 100%; height: 0%; background: linear-gradient(0deg, #57cc99 55%, #ffd166 78%, #ef476f); }
  #mstVol { flex: 1; height: auto; min-height: 80px; }
  #topAudio { padding-left: 178px; gap: 8px; background: #1f1f2a; border-bottom: 1px solid #34344a; }
  #topAudio button, #audTransport button { background: #262633; border: 1px solid #34344a; border-radius: 6px; color: #e6e6f0; font-size: 12px; padding: 6px 9px; }
  #topAudio button:hover, #audTransport button:hover { background: #30304a; }
  #topAudio select { background: #262633; border: 1px solid #34344a; border-radius: 6px; color: #e6e6f0; font-size: 12px; padding: 5px 6px; }
  #topAudio .lab { font-size: 12px; color: #9a9ab0; }
  #topAudio input[type="range"] { accent-color: #2f80ed; }
  #topAudio button.on, #audTransport button.on { background: #e94560; border-color: #e94560; color: #fff; }
  #topAudio #btnAudExport { background: #39d98a; border-color: #39d98a; color: #06281a; font-weight: 700; }
  #topAudio #btnAudExport:hover { background: #45e69c; }
  #audTransport { display: flex; align-items: center; justify-content: center; gap: 16px; padding: 7px 12px; background: #1f1f2a; border-top: 1px solid #34344a; border-bottom: 1px solid #34344a; flex: none; }
  #audTransport button { font-size: 14px; padding: 8px 18px; }
  #audTransport .grp { gap: 8px; }
  #audTransport #btnAudRec { background: #3a3d46; border-color: #4d505c; color: #c9ccd4; }
  #audTransport #btnAudRec.on { background: #d43a3a; border-color: #d43a3a; color: #fff; }
  #audPos { color: #39d98a; font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: 1px; }
  .eqCol { width: 37px; }
  input[type="range"].vsl { width: 17px; height: 86px; }
  .eqWrap { justify-content: flex-start; }
  #masterPop { max-height: 88vh; overflow-y: auto; }
</style>
</head>
<body>
<div id="topAudio" style="border-top:none; flex-wrap:nowrap; overflow-x:auto; display:flex; gap:8px;">
  <span class="grp"><button id="btnAudAddTr" class="acc">＋轨道</button><button id="btnAudImport">导入音频</button></span>
  <span class="grp"><span class="lab">输入</span><select id="audInSel" style="max-width:140px"></select><button id="btnAudMon" title="监听输入（戴耳机使用）">监听</button></span>
  <span class="grp"><button id="btnAudCut">剪切</button><button id="btnAudCopy">复制</button><button id="btnAudPaste">粘贴</button><button id="btnAudSplit">分割</button><button id="btnAudDel">删除</button></span>
  <span class="grp"><button id="btnAudUndo">撤销</button><button id="btnAudRedo">重做</button></span>
  <span class="grp"><span class="lab">缩放</span><input id="audZoom" type="range" min="2" max="1000" value="42" style="width:54px"></span>
  <span class="grp" style="margin-left:auto;"><button id="btnMaster" title="母带设置（导出混音时生效）">母带设置</button><button id="btnAudExport" class="acc">导出混音</button></span>
</div>
<div id="audMain" style="display:flex;">
  <div id="audScroll">
    <div id="audInner">
      <div id="audHeads"></div>
      <canvas id="audCanvas" height="300"></canvas>
    </div>
  </div>
  
<div id="audTransport">
  <span class="grp">
    <button id="btnAudRec" class="rec" title="录音到已备轨的轨道">● 录音</button>
    <button id="btnAudPlay" title="播放/暂停">▶ 播放</button>
    <button id="btnAudStop" title="停止">⏹</button>
    <span id="audPos" class="lab">0:00.0</span>

  <span class="grp"><button id="btnAudMetro" title="节拍器">节拍器</button></span>

<div id="audFx"><div class="audFxL">
    <div class="fxHead">
      <span class="lab">效果</span><span id="audFxName" style="font-weight:600;"></span>
      <button class="fxTab on" data-fx="eq">EQ</button>
      <button class="fxTab" data-fx="rev">混响</button>
      <button class="fxTab" data-fx="comp">压缩</button>
      <button class="fxTab" data-fx="space">空间相位</button>
      <button class="fxTab" data-fx="gain">增益</button>
    </div>
    <div class="fxPage on" id="fxPageEq">
      <div class="presetRow" id="eqPresets"></div>
      <div class="eqWrap" id="eqSliders"></div>
    </div>
    <div class="fxPage" id="fxPageRev">
      <div class="presetRow" id="revPresets"></div>
      <div class="fxSliders">
        <span class="fxCtl"><span class="lab">混响量 <b id="revWetVal"></b></span><input id="revWet" type="range" min="0" max="80" value="0" style="width:170px"></span>
        <span class="fxCtl"><span class="lab">衰减 <b id="revDecVal"></b></span><input id="revDec" type="range" min="3" max="60" value="10" style="width:170px"></span>
      </div>
    </div>
    <div class="fxPage" id="fxPageComp">

      <div class="fxSliders">
        <span class="fxCtl"><span class="lab">门限 <b id="compThrVal"></b></span><input id="compThr" type="range" min="-48" max="0" value="0" style="width:170px"></span>
        <span class="fxCtl"><span class="lab">比率 <b id="compRatioVal"></b></span><input id="compRatio" type="range" min="1" max="20" value="1" step="0.5" style="width:170px"></span>
      </div>

    <div class="fxPage" id="fxPageSpace">
      <div class="spaceWrap">
        <canvas id="radar" width="218" height="218"></canvas>
        <div>
          <div class="fxCtl" style="margin-bottom:10px;"><span class="lab">方位 <b id="spacePosVal"></b></span></div>
          <button id="btnSpaceReset">回到正前方</button>
        </div>
      </div>
    </div>
        <div class="fxPage" id="fxPageGain">
      <div class="fxSliders">
        <span class="fxCtl"><span class="lab">纯净增益 <b id="gainDbVal"></b></span><input id="gainDb" type="range" min="-12" max="24" value="12" step="0.5" style="width:170px"></span>

    <span class="fxCtl"><span class="lab">中低 300 <b id="mEq2Val"></b></span><input id="mEq2" type="range" min="-12" max="12" step="0.5" value="-0.4"></span>
    <span class="fxCtl"><span class="lab">中高 2.8k <b id="mEq3Val"></b></span><input id="mEq3" type="range" min="-12" max="12" step="0.5" value="0.8"></span>
    <span class="fxCtl"><span class="lab">高频 9k <b id="mEq4Val"></b></span><input id="mEq4" type="range" min="-12" max="12" step="0.5" value="1.2"></span>
    <span class="fxCtl"><span class="lab">驱动 <b id="mDriveVal"></b></span><input id="mDrive" type="range" min="0" max="1" step="0.01" value="0.06"></span>
    <span class="fxCtl"><span class="lab">门限 <b id="mThrVal"></b></span><input id="mThr" type="range" min="-40" max="0" step="1" value="-18"></span>
    <span class="fxCtl"><span class="lab">比率 <b id="mRatioVal"></b></span><input id="mRatio" type="range" min="1" max="8" step="0.1" value="2"></span>
    <span class="fxCtl"><span class="lab">起音 <b id="mAtkVal"></b></span><input id="mAtk" type="range" min="0.001" max="0.1" step="0.001" value="0.01"></span>
    <span class="fxCtl"><span class="lab">释放 <b id="mRelVal"></b></span><input id="mRel" type="range" min="0.05" max="1" step="0.01" value="0.24"></span>
    <span class="fxCtl"><span class="lab">拐点 <b id="mKneeVal"></b></span><input id="mKnee" type="range" min="0" max="40" step="1" value="18"></span>
    <span class="fxCtl"><span class="lab">展宽 <b id="mWidthVal"></b></span><input id="mWidth" type="range" min="0" max="1.6" step="0.01" value="1.05"></span>

    <span class="fxCtl"><span class="lab">天花板 <b id="mCeilVal"></b></span><input id="mCeil" type="range" min="-3" max="0" step="0.1" value="-1"></span>
  </div>
</div>
<input type="file" id="audFileIn" accept="audio/*" multiple style="display:none">
<span id="status" style="display:none"></span>
<div id="toast"></div>
<script>
"use strict";
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const r4 = v => Math.round(v * 10000) / 10000;
let toastTimer = null;
function toast(msg) {
  const t = $("toast"); if (!t) return;
  t.textContent = msg; t.style.display = "block";
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.style.display = "none", 2400);
}
function roundRect(ctx, x, y, w, h) {
  const r = Math.min(3, h / 2); ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
const P = { bpm: 96, tnum: 4, title: "媒体工坊" };
let AC = null, master = null;
function ensureAudio() {
  if (!AC) {
    AC = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: "interactive" });
    master = AC.createGain(); master.gain.value = 0.9; master.connect(AC.destination);
  }
  if (AC.state === "suspended") AC.resume();
  return AC;
}
function clickAt(when, accent) {
  if (!AC || !master) return;
  const o = AC.createOscillator(); o.type = "square"; o.frequency.value = accent ? 2080 : 1560;
  const gn = AC.createGain();
  gn.gain.setValueAtTime(accent ? 0.20 : 0.13, when);
  gn.gain.exponentialRampToValueAtTime(0.0008, when + 0.04);
  o.connect(gn); gn.connect(master);
  o.start(when); o.stop(when + 0.05);
}
</script>
<script>
"use strict";
/* ============ 录音助手：多轨录音 / 调音台 / 片段编辑 / 效果器 / 空间相位 ============ */
const A = {
  mode: "midi", inited: false, tracks: [], clips: [], buffers: new Map(), bufSeq: 1, clipSeq: 1, trackSeq: 1,
  selTrackId: null, selClipId: null, clipboard: null,
  playing: false, recording: false, pos: 0, startCtx: 0, startPos: 0, sources: [], timer: null,
  pxSec: 42, stream: null, streamDev: null, streamSrc: null, analyser: null, monGain: null, monOn: false, wiredFor: null, inPeak: 0, recStartAC: null, inFx: null, recDest: null, inTopo: null, viewX0: 0,
  mediaRec: null, recChunks: [], recTrackId: null, recStartPos: 0, livePeaks: [],
  metroOn: false, nextClickPos: 0, bus: null, undoStack: [], redoStack: [], fxTab: "eq",
  master: { on: false, preset: "universal", hp: 25, eq: [1.2, -0.4, 0.8, 1.2], drive: 0.06, thr: -18, ratio: 2.0, atk: 0.010, rel: 0.24, knee: 18, width: 1.05, wet: 0, decay: 1.8, lufs: -14, ceil: -1 }, masterVol: 1, guide: null
};

  $("btnAudStop").onclick = () => audStopAll(true);
  $("btnAudMetro").onclick = () => { A.metroOn = !A.metroOn; $("btnAudMetro").classList.toggle("on", A.metroOn); };
  $("btnAudMon").onclick = e => { A.monOn = !A.monOn; e.target.classList.toggle("on", A.monOn); if (A.monGain) A.monGain.gain.value = A.monOn ? 0.9 : 0; if (A.monOn) toast("监听已开，注意啸叫（请戴耳机）"); };
  $("audInSel").addEventListener("change", () => { audCloseInput(); if (A.tracks.some(t => t.armed)) audEnsureInput(); });
  $("btnAudAddTr").onclick = () => { pushAudUndo(); const tr = addAudTrack(); A.selTrackId = tr.id; rebuildAudHeads(); syncFxPanel(); drawAud(); };
  $("btnAudImport").onclick = () => $("audFileIn").click();
  $("audFileIn").addEventListener("change", e => { if (e.target.files.length) audImportFiles([...e.target.files]); e.target.value = ""; });
  $("btnAudCut").onclick = audCut;
  $("btnAudCopy").onclick = audCopy;
  $("btnAudPaste").onclick = audPaste;
  $("btnAudSplit").onclick = audSplit;
  $("btnAudDel").onclick = audDeleteSel;
  $("btnAudUndo").onclick = () => { if (!doAudUndo()) toast("没有可撤销的"); };
  $("btnAudRedo").onclick = () => { if (!doAudRedo()) toast("没有可重做的"); };
  $("audZoom").addEventListener("input", e => { A.pxSec = +e.target.value; drawAud(); });
  $("audScroll").addEventListener("scroll", () => drawAud());   /* 可视窗口渲染：滚动后重画新窗口 */
  $("btnAudExport").onclick = audExportMix;
  $("btnMaster").onclick = () => { const p = $("masterPop"); const show = p.style.display === "none"; p.style.display = show ? "block" : "none"; if (show) { syncMasterPanel(); if (A.master.on && (A.mstDirty || A.mstMeas == null)) measureMasterLive(); } };
  $("btnMasterClose").onclick = () => { $("masterPop").style.display = "none"; };
  document.addEventListener("keydown", e => {
    if (!audModeActive()) return;
    const tag = (e.target.tagName || "").toUpperCase();
    if (tag === "INPUT" || tag === "SELECT" || tag === "TEXTAREA") return;
    if (e.code === "Space") { e.preventDefault(); $("btnAudPlay").click(); }
    else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z") { e.preventDefault(); if (e.shiftKey) doAudRedo(); else doAudUndo(); }
    else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "y") { e.preventDefault(); doAudRedo(); }
    else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "x") { audCut(); }
    else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "c") { audCopy(); }
    else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "v") { audPaste(); }
    else if (e.key === "Delete" || e.key === "Backspace") { audDeleteSel(); }
  });
  window.addEventListener("resize", () => { if (A.mode === "aud") drawAud(); });
}
/* 媒体工坊独立版：无模式切换，启动即录音模式（宿主在页面末尾调用 bootAud()） */

window.__AUD = {
  get A() { return A; },
  setMode, addAudTrack, audPlay, audStopAll, audStartRecording,
  addClipFromBuffer(buffer, trackIdx, start, name) {
    const bid = "b" + (A.bufSeq++);
    A.buffers.set(bid, buffer);
    const tr = A.tracks[trackIdx || 0];
    const c = { id: A.clipSeq++, trackId: tr.id, bufferId: bid, start: start || 0, offset: 0, dur: buffer.duration, name: name || "测试片段" };
    A.clips.push(c); drawAud();
    return c;
  },
  renderMix, renderMixRaw, encodeWAV, applyFxAll, syncFxPanel, drawAud, drawRadar,
  audCut, audCopy, audPaste, audSplit, audDeleteSel, doAudUndo, doAudRedo,
  envValueAt, syncMasterPanel, applyMaster, measureLUFS, audH, audRowY, syncMasterLive, measureMasterLive, audEnsureInput, audCloseInput, recClipStart, syncInputFx
};

</script>
<script>
"use strict";
A.mode = "aud";
initAud();
drawAud();
audRefreshInputs();
$("mstVol").addEventListener("input", e => {
  const db = +e.target.value;
  A.masterVol = Math.pow(10, db / 20);
  $("mstVolVal").textContent = (db > 0 ? "+" : "") + db + " dB";
  syncMasterLive();
});
</script>
