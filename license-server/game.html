<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>战隼 · 无尽空域</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; background:#05070c; overflow:hidden; }
  body { display:flex; align-items:flex-start; justify-content:center; padding-top:max(10px, env(safe-area-inset-top)); font-family:"PingFang SC","Microsoft YaHei",sans-serif; }   /* v50：画面靠上 */
  #wrap { position:relative; height:100vh; height:100dvh; aspect-ratio:2/3; max-width:100vw; }
  @media (max-aspect-ratio: 2/3) { #wrap { width:100vw; height:auto; } }
  canvas { width:100%; height:100%; display:block; background:#1c2b1a; touch-action:none; }
  .tbtn { position:absolute; bottom:18px; width:64px; height:64px; border-radius:50%;
    border:2px solid rgba(255,255,255,.45); background:rgba(10,16,28,.45); color:#fff;
    font-size:15px; font-weight:700; display:none; align-items:center; justify-content:center;
    user-select:none; -webkit-user-select:none; text-align:center; line-height:1.15; }
  #btnSpec { right:16px; border-color:rgba(255,190,60,.8); color:#ffd76a; }
  #btnSwap { right:92px; }
  @media (pointer:coarse) { .tbtn { display:flex; } }
</style>

<body>
<div id="wrap">
  <canvas id="game" width="480" height="720"></canvas>
</div>
<script>
"use strict";
const cv = document.getElementById('game'), ctx = cv.getContext('2d');
// v44 画质：按设备像素比放大画布（上限 2 倍），文字/机体/特效在高清屏上不再发糊；地形瓦片为绘画质感、维持原分辨率
let DPR = Math.min(2, window.devicePixelRatio || 1);
if (DPR > 1){ cv.width = 480 * DPR; cv.height = 720 * DPR; }
const W = 480, H = 720;
const TAU = Math.PI * 2;
// 遭遇 BOSS 的节奏：每滚动 BOSS_INTERVAL 秒遭遇一台 BOSS（随后 3 秒预警动画再开打）
const BOSS_INTERVAL = 60;
const clamp = (v,a,b)=> v<a?a : v>b?b : v;
const rand = (a,b)=> a + Math.random()*(b-a);
const irand = (a,b)=> Math.floor(rand(a,b+1));
const choice = arr => arr[Math.floor(Math.random()*arr.length)];
const dist2 = (x1,y1,x2,y2)=>{ const dx=x2-x1, dy=y2-y1; return dx*dx+dy*dy; };
function mulberry32(seed){ let a = seed>>>0; return function(){ a|=0; a=(a+0x6D2B79F5)|0; let t=Math.imul(a^(a>>>15),1|a); t=(t+Math.imul(t^(t>>>7),61|t))^t; return ((t^(t>>>14))>>>0)/4294967296; }; }

// ---------- tiny synth sfx（v12：全量重规划） ----------
// 设计原则：
//   ① 巨炮类 = 次低频冲击 + 噪声爆发 + 长尾残响 → 要有「震一下」的重量感
//   ② 激光类 = 持续 0.9s 以上的下滑长音 → 一听就知道是持续型伤害
//   ③ 跟踪导弹 = 带通噪声由高扫到低 = 「嗖」
//   ④ 每个技能 / 每招 BOSS 都有专属音色，不再共用一个 spec()
// 技术：oscillator beep() 负责有音高的部分；noiseHit() 负责气流 / 爆炸质感。
let AC = null, muted = false, NOISE_BUF = null;
function beep(f, d, type, g, slide){
  if (muted) return;
  try{
    if (!AC) AC = new (window.AudioContext||window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    const o = AC.createOscillator(), gn = AC.createGain();
    o.type = type||'square'; o.frequency.value = f;
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide), AC.currentTime + d);
    gn.gain.setValueAtTime(g||0.05, AC.currentTime);
    gn.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + d);
    o.connect(gn); gn.connect(AC.destination); o.start(); o.stop(AC.currentTime + d);
  }catch(e){}
}
// 白噪声缓冲：所有「气流 / 爆炸 / 嗖」音色的原料（只烘焙一次）
function noiseBuffer(){
  if (NOISE_BUF) return NOISE_BUF;
  try{
    if (!AC) AC = new (window.AudioContext||window.webkitAudioContext)();
    const len = Math.floor(AC.sampleRate*1.5);
    NOISE_BUF = AC.createBuffer(1, len, AC.sampleRate);
    const d = NOISE_BUF.getChannelData(0);
    for (let i=0;i<len;i++) d[i] = Math.random()*2-1;
  }catch(e){ NOISE_BUF = null; }
  return NOISE_BUF;
}
// 带通滤波扫频噪声：从 f0 扫到 f1 —— 「嗖」的本质
function noiseHit(dur, f0, f1, gain, q){
  if (muted) return;
  try{
    if (!AC) AC = new (window.AudioContext||window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    const buf = noiseBuffer(); if (!buf) return;
    const src = AC.createBufferSource(); src.buffer = buf;
    const bp = AC.createBiquadFilter(); bp.type='bandpass'; bp.Q.value = (q==null?4:q);
    const gn = AC.createGain();
    const t0 = AC.currentTime;
    bp.frequency.setValueAtTime(Math.max(40,f0), t0);
    bp.frequency.exponentialRampToValueAtTime(Math.max(40,f1), t0+dur);
    gn.gain.setValueAtTime(gain==null?0.06:gain, t0);
    gn.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    src.connect(bp); bp.connect(gn); gn.connect(AC.destination);
    src.start(t0); src.stop(t0+dur);
  }catch(e){}
}
// 低通噪声「闷雷」：频率从高往低塌 —— 爆炸的身体，比带通噪声更接近真实爆轰
function thump(dur, f0, gain){
  if (muted) return;
  try{
    if (!AC) AC = new (window.AudioContext||window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    const buf = noiseBuffer(); if (!buf) return;
    const src = AC.createBufferSource(); src.buffer = buf; src.playbackRate.value = 0.7+Math.random()*0.3;
    const lp = AC.createBiquadFilter(); lp.type='lowpass'; lp.Q.value = 0.8;
    const gn = AC.createGain();
    const t0 = AC.currentTime;
    lp.frequency.setValueAtTime(Math.max(60,f0), t0);
    lp.frequency.exponentialRampToValueAtTime(60, t0+dur);
    gn.gain.setValueAtTime(gain, t0);
    gn.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    src.connect(lp); lp.connect(gn); gn.connect(AC.destination);
    src.start(t0); src.stop(t0+dur);
  }catch(e){}
}
function primeAudio(){
  try{
    if (!AC) AC = new (window.AudioContext||window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
  }catch(e){}
}
// ================= BGM 程序化音乐引擎（v46） =================
// 格式定案：不用 MIDI（浏览器不能直接播 .mid，仍需合成器）。曲子以音符数据写在代码里、
// 由 WebAudio 实时合成 —— 单文件零素材、可无缝循环。预留真实文件位：同目录（或同源）
// music/stage.mp3、music/boss.mp3 一旦存在且可播，自动改走文件、合成退为兜底。
let musicOn = false;
try { musicOn = localStorage.getItem('kongsun_music') === '1'; } catch(e) {}   // v49：音乐默认关闭，玩家自行开启
const MUSIC_BTN = { x: W - 30, y: 92, r: 15 };
const MUSIC_TBTN = { x: 190, y: 660, w: 100, h: 44 };
let musicBus = null, stageGain = null, bossGain = null, bgmTheme = 'stage', bgmStep = 0, bgmNextT = 0;
const bgmFile = {}, bgmFileReady = { stage: false, boss: false };
function mtof(m){ return 440 * Math.pow(2, (m - 69) / 12); }
function bgmEnsure(){
  if (musicBus || !AC) return;
  musicBus = AC.createGain(); musicBus.gain.value = 0.9; musicBus.connect(AC.destination);
  stageGain = AC.createGain(); stageGain.gain.value = 0; stageGain.connect(musicBus);
  bossGain = AC.createGain(); bossGain.gain.value = 0; bossGain.connect(musicBus);
  for (const k of ['stage', 'boss']){
    try {
      const el = new Audio();
      el.loop = true; el.preload = 'auto'; el.volume = 0;
      el.addEventListener('canplaythrough', () => { bgmFileReady[k] = true; });
      el.addEventListener('error', () => { bgmFileReady[k] = false; });
      el.src = 'music/' + k + '.mp3';
      bgmFile[k] = el;
    } catch(e) {}
  }
}
function mOsc(t, midi, dur, type, vol, dest, glideTo){
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(mtof(midi), t);
  if (glideTo) o.frequency.exponentialRampToValueAtTime(mtof(glideTo), t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(dest); o.start(t); o.stop(t + dur + 0.05);
}
function mCrash(t, vol, dest, dur){
  // 大镲：宽带亮噪 + 长衰减
  mNoiseHit(t, dur || 0.9, vol, dest, 7800, 5200, 'highpass');
  mNoiseHit(t, (dur || 0.9) * 0.6, vol * 0.6, dest, 4600, 3000, 'bandpass');
}
function mHat(t, vol, dest, open){
  // 踩镲：闭镲短促、开镲拉长
  mNoiseHit(t, open ? 0.22 : 0.045, vol, dest, 9000, null, 'highpass');
}
function mTaiko(t, vol, dest, pitch){
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(pitch || 118, t);
  o.frequency.exponentialRampToValueAtTime(36, t + 0.24);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.30);
  o.connect(g); g.connect(dest); o.start(t); o.stop(t + 0.32);
  const buf = noiseBuffer(); if (!buf) return;
  const src = AC.createBufferSource(); src.buffer = buf; src.playbackRate.value = 0.6;
  const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 420;
  const ng = AC.createGain();
  ng.gain.setValueAtTime(vol * 0.5, t);
  ng.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);
  src.connect(lp); lp.connect(ng); ng.connect(dest); src.start(t); src.stop(t + 0.18);
}
function mNoiseHit(t, dur, vol, dest, f0, f1, type){
  const buf = noiseBuffer(); if (!buf) return;
  const src = AC.createBufferSource(); src.buffer = buf;
  const f = AC.createBiquadFilter(); f.type = type || 'bandpass'; f.Q.value = 1.1;
  f.frequency.setValueAtTime(f0, t);
  if (f1) f.frequency.exponentialRampToValueAtTime(f1, t + dur);
  const g = AC.createGain();
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  src.connect(f); f.connect(g); g.connect(dest); src.start(t); src.stop(t + dur + 0.02);
}
// ---- 曲目数据（16 分音符网格） ----
// v49（用户定）：不要旋律、不要和声 —— 只有鼓组 + 贝斯。平时靠律动，BOSS 靠全鼓组（太鼓/军鼓/大镲/踩镲）。
// 平时 132bpm · 贝斯根音进行（每小节）：D D Bb Bb F F C C
const STAGE_ROOTS = [38, 38, 34, 34, 41, 41, 36, 36];
// BOSS 152bpm · 根音：D D Eb D
const BOSS_ROOTS = [38, 38, 39, 38];
function scheduleStep(theme, step, t){
  const bar = (step >> 4) & 7, s16 = step & 15;
  if (theme === 'stage'){
    const dest = stageGain, root = STAGE_ROOTS[bar];
    // —— 鼓组：底鼓切分律动 + 军鼓 4/12 + 踩镲织体 ——
    if (s16 === 0) mTaiko(t, 0.52, dest);
    if (s16 === 7) mTaiko(t, 0.30, dest, 104);
    if (s16 === 8) mTaiko(t, 0.40, dest);
    if (s16 === 10) mTaiko(t, 0.26, dest, 96);
    if (s16 === 4 || s16 === 12) mNoiseHit(t, 0.10, 0.13, dest, 1800, 900, 'bandpass');   // 军鼓
    if (s16 % 2 === 0) mHat(t, s16 % 4 === 0 ? 0.055 : 0.038, dest);
    if (s16 === 14) mHat(t, 0.05, dest, true);                                            // 开镲收尾
    if (bar === 7 && s16 >= 12) mTaiko(t, 0.30, dest, 170 - (s16 - 12) * 22);             // 小节尾滚奏
    if (bar === 0 && s16 === 0) mCrash(t, 0.10, dest, 1.2);                               // 循环头大镲
    // —— 贝斯：八分驱动 + 八度/五度跳进（纯节奏声部） ——
    if (s16 % 2 === 0){
      const off = (s16 === 6 || s16 === 14) ? 12 : (s16 === 11 ? 7 : 0);
      mOsc(t, root + off, 0.17, 'sawtooth', 0.085, dest);
    }
    if (s16 === 15) mOsc(t, root + 10, 0.09, 'sawtooth', 0.05, dest);                     // 过门滑音感
  } else {
    const dest = bossGain, b4 = bar & 3, root = BOSS_ROOTS[b4];
    // —— 全鼓组：疾驰太鼓 + 双踩镲 + 军鼓 + 大镲重音 ——
    if (s16 === 0 || s16 === 6 || s16 === 8 || s16 === 14) mTaiko(t, 0.56, dest);
    if (s16 === 3 || s16 === 11) mTaiko(t, 0.36, dest, 100);
    if (s16 === 4 || s16 === 12) mNoiseHit(t, 0.12, 0.17, dest, 1900, 800, 'bandpass');   // 军鼓
    mHat(t, s16 % 4 === 0 ? 0.06 : 0.034, dest);                                          // 踩镲 16 分全程
    if (s16 === 15) mHat(t, 0.05, dest, true);
    if (bar % 2 === 1 && s16 >= 12) mTaiko(t, 0.34, dest, 175 - (s16 - 12) * 24);          // 滚奏
    if (s16 === 0) mCrash(t, 0.13, dest, 1.1);                                            // 每小节头大镲
    if (b4 === 2 && s16 === 8) mCrash(t, 0.10, dest, 0.8);
    if (s16 === 0){ mOsc(t, root - 12, 0.9, 'sine', 0.10, dest); mOsc(t, root - 12, 0.9, 'sawtooth', 0.03, dest); }   // 低音轰底
    // —— 贝斯：16 分狂奔 ——
    const boff = [0,0,12,0, 0,0,12,0, 0,0,12,0, 1,0,12,0][s16];
    mOsc(t, root + boff, 0.085, 'sawtooth', 0.09, dest);
  }
}
function bgmSchedule(){
  if (!AC || muted || !musicOn || bgmFileReady[bgmTheme]) return;
  const bpm = bgmTheme === 'boss' ? 152 : 132;
  const steps = bgmTheme === 'boss' ? 64 : 128;
  const stepDur = 60 / bpm / 4;
  if (!bgmNextT || bgmNextT < AC.currentTime - 0.1){ bgmNextT = AC.currentTime + 0.06; bgmStep = 0; }
  while (bgmNextT < AC.currentTime + 0.22){
    scheduleStep(bgmTheme, bgmStep, bgmNextT);
    bgmStep = (bgmStep + 1) % steps;
    bgmNextT += stepDur;
  }
}
function bgmTick(){
  if (!AC) return;
  bgmEnsure(); if (!musicBus) return;
  const want = (G.state === 'boss' || G.state === 'warn') ? 'boss' : 'stage';
  if (want !== bgmTheme){ bgmTheme = want; bgmStep = 0; bgmNextT = 0; }
  const t = AC.currentTime, on = musicOn && !muted;
  const lvl = G.state === 'title' ? 0.22 : (bgmTheme === 'boss' ? 0.44 : 0.36);   // v48：整体音量下调
  stageGain.gain.setTargetAtTime(on && bgmTheme === 'stage' ? lvl : 0, t, 0.35);
  bossGain.gain.setTargetAtTime(on && bgmTheme === 'boss' ? lvl : 0, t, 0.35);
  for (const k of ['stage', 'boss']){
    const el = bgmFile[k]; if (!el || !bgmFileReady[k]) continue;
    const target = on && bgmTheme === k ? (G.state === 'title' ? 0.38 : 0.6) : 0;
    el.volume = Math.max(0, Math.min(1, el.volume + (target - el.volume) * 0.3));
    if (target > 0 && el.paused) el.play().catch(() => {});
    if (target === 0 && !el.paused && el.volume < 0.03){ el.pause(); }
  }
  bgmSchedule();
}
setInterval(bgmTick, 120);
function toggleMusic(){
  musicOn = !musicOn;
  try { localStorage.setItem('kongsun_music', musicOn ? '1' : '0'); } catch(e) {}
}

const sfx = {
  // ---- 基础反馈 ----
  hit(){ beep(180,0.12,'sawtooth',0.06,-120); },
  boom(){ thump(0.34, 950, 0.16); beep(64,0.30,'triangle',0.11,-26); noiseHit(0.13, 2500, 640, 0.045, 1.1); },
  explodeS(){ thump(0.20, 760, 0.10); noiseHit(0.10, 2100, 520, 0.038, 1.4); beep(96,0.16,'triangle',0.06,-30); },
  eliteBoom(){ thump(0.62, 720, 0.22); beep(44,0.80,'sine',0.17,-16); noiseHit(0.5, 1500, 90, 0.11, 0.9); setTimeout(()=>thump(0.3, 500, 0.10), 130); },
  bigBoom(){ thump(1.0, 620, 0.26); beep(36,1.3,'sine',0.20,-12); noiseHit(0.8, 1300, 70, 0.13, 0.8); setTimeout(()=>thump(0.45, 420, 0.12), 180); setTimeout(()=>noiseHit(0.3, 900, 200, 0.05, 1), 300); },
  pow(){ beep(660,0.09,'square',0.06,440); setTimeout(()=>beep(990,0.12,'square',0.06,220),70); },
  spec(){ beep(320,0.25,'square',0.07,520); },
  warn(){ beep(440,0.16,'square',0.08); setTimeout(()=>beep(440,0.16,'square',0.08),220); setTimeout(()=>beep(440,0.16,'square',0.08),440); },
  hurt(){ beep(140,0.25,'sawtooth',0.12,-80); },
  // ---- 巨炮类：低频冲击 + 噪声爆发 + 长尾 ----
  heavy(){
    beep(52,1.35,'sine',0.20,-26);          // 次低频「轰」
    beep(126,0.40,'sawtooth',0.12,-78);     // 开炮瞬间的拍击
    noiseHit(0.60, 900, 90, 0.13, 1.1);     // 破空与硝烟
    beep(74,0.75,'triangle',0.09,-30);      // 残响尾音
  },
  // ---- 战斗集群：电台呼号双音 + 编队升空的连续嗖声 + 远空引擎底噪 ----
  swarm(){
    beep(1180,0.06,'square',0.034); setTimeout(()=>beep(1560,0.07,'square',0.034), 75);
    for (let i=0;i<3;i++) setTimeout(()=>noiseHit(0.42, 1500, 480, 0.05, 4), 130+i*140);
    noiseHit(1.0, 260, 980, 0.028, 2);
  },
  // ---- 脉冲类：上扫的「滋」声 ----
  pulse(){
    noiseHit(0.60, 3400, 5200, 0.055, 9);   // 上扫的高频嘶声
    beep(1650,0.32,'square',0.026,900);     // 一点点电子感
    thump(0.4, 500, 0.10);                  // v23：巨人的光束要有低频身体
  },
  // ---- 跟踪导弹：「嗖」 ----
  missile(){
    noiseHit(0.55, 1900, 380, 0.075, 5.5);  // 高 → 低 的带通扫频 = 嗖
    beep(320,0.45,'sawtooth',0.030,-190);
    setTimeout(()=>noiseHit(0.4, 1600, 420, 0.04, 5), 110);   // 第二层拖尾，拉开齐射的层次
  },
  // ---- 潜伏导弹：自下方升空的低频嗖 ----
  lurking(){
    noiseHit(0.70, 260, 1500, 0.050, 3.0);
    beep(70,0.60,'triangle',0.070,120);
  },
  // ---- 三连舰炮：与「巨炮」完全同配方，但整体更厚、更低、更饱满（单发闷轰） ----
  triple(){
    beep(41,1.55,'sine',0.235,-20);         // 次低频「轰」——比巨炮更低一档
    beep(96,0.46,'sawtooth',0.140,-62);     // 开炮瞬间的拍击
    noiseHit(0.70, 720, 70, 0.150, 1.0);    // 破空与硝烟
    beep(58,0.90,'triangle',0.105,-24);     // 残响尾音更长
  },
  // ---- 僚机无人机：电子提示双音 ----
  drones(){ beep(880,0.07,'square',0.040,0); setTimeout(()=>beep(1320,0.10,'square',0.040,0),80); },
  // ---- 集束炸弹：闷响 + 空气摩擦 ----
  cluster(){ thump(0.28, 520, 0.13); noiseHit(0.20, 900, 300, 0.05, 1.5); beep(196,0.16,'triangle',0.06,-70); },   // v36：投放声；引爆声 = bigBoom
  // ---- 精英火箭车齐射：改回旧配方（闷响 + 空气摩擦），与集束炸弹技能音色分开 ----
  mlrs(){ beep(150,0.35,'square',0.070,-80); noiseHit(0.32, 700, 220, 0.050, 2); },
  // ---- 磁轨重炮：撕裂的高频 + 底部冲击 ----
  rail(){ noiseHit(0.05, 3000, 900, 0.17, 1.2); beep(210,0.06,'square',0.14,-140); setTimeout(()=>beep(150,0.09,'square',0.08,-60), 45); },   // v41：打击感「咔」

function playSfx(name, gap){
  if (!name || typeof sfx[name] !== 'function') return;
  const now = (typeof performance!=='undefined' && performance.now) ? performance.now()/1000 : 0;
  const g = (gap==null) ? 0.07 : gap;
  if (SFX_LAST[name]!=null && now - SFX_LAST[name] < g) return;
  SFX_LAST[name] = now;
  try{ sfx[name](); }catch(e){}
}

let touchPadOn = false, padEl = null, dotEl = null, padPid = null, padLast = null;
const padDelta = { x:0, y:0 };
let __padW = -1, __padH = -1;
function ensurePad(){
  if (padEl) return;
  padEl = document.createElement('div');
  padEl.id = 'touchPad';
  padEl.style.cssText = 'position:fixed;display:none;z-index:30;touch-action:none;border-top:1px solid rgba(154,220,255,.14);background:rgba(120,180,255,0.03)';
  dotEl = document.createElement('div');
  dotEl.style.cssText = 'position:absolute;width:56px;height:56px;border-radius:50%;background:rgba(154,220,255,.18);border:1.5px solid rgba(154,220,255,.4);transform:translate(-50%,-50%);display:none;pointer-events:none';
  padEl.appendChild(dotEl);
  document.body.appendChild(padEl);
  function moveDot(e){
    const pr = padEl.getBoundingClientRect();
    dotEl.style.left = (e.clientX - pr.left) + 'px';
    dotEl.style.top = (e.clientY - pr.top) + 'px';
  }
  padEl.addEventListener('pointerdown', e => {
    if (padPid !== null) return;
    padPid = e.pointerId; padLast = { x: e.clientX, y: e.clientY };
    try { padEl.setPointerCapture(e.pointerId); } catch(err) {}
    dotEl.style.display = 'block'; moveDot(e);
    e.preventDefault();
  });
  padEl.addEventListener('pointermove', e => {
    if (e.pointerId !== padPid || !padLast) return;
    const r = cv.getBoundingClientRect();
    const g = (480 / r.width) * 1.15;   // CSS 位移 → 游戏位移，1.15 倍灵敏度（触控板式相对操控）
    padDelta.x += (e.clientX - padLast.x) * g;
    padDelta.y += (e.clientY - padLast.y) * g;
    padLast = { x: e.clientX, y: e.clientY };
    moveDot(e);
  });
  const endPad = e => { if (e.pointerId === padPid){ padPid = null; padLast = null; dotEl.style.display = 'none'; } };
  padEl.addEventListener('pointerup', endPad);
  padEl.addEventListener('pointercancel', endPad);
}
function layoutPad(){
  ensurePad();
  const r = cv.getBoundingClientRect();
  const vh = (window.visualViewport ? window.visualViewport.height : window.innerHeight);
  const below = vh - r.bottom;
  touchPadOn = below >= 120;
  if (touchPadOn){
    padEl.style.left = r.left + 'px';
    padEl.style.top = r.bottom + 'px';
    padEl.style.width = r.width + 'px';
    padEl.style.height = below + 'px';
  } else if (padPid !== null){ padPid = null; padLast = null; padDelta.x = 0; padDelta.y = 0; dotEl.style.display = 'none'; }
}
function syncPad(){
  if (!padEl) return;
  if (window.innerWidth !== __padW || window.innerHeight !== __padH){ __padW = window.innerWidth; __padH = window.innerHeight; layoutPad(); }
  const show = touchPadOn && (G.state==='play' || G.state==='boss' || G.state==='warn') && !G.paused && !P.dead;
  const want = show ? 'block' : 'none';
  if (padEl.style.display !== want) padEl.style.display = want;
}

// fBm 高度场 + hillshade 浮雕 + 矢量地物，六种地貌之间像素级平滑过渡。
const BIOMES = ['grass','desert','city','ruins','sea','fortress','mountain','jungle'];
const SEG = 160;
const TILE_VARIANTS = 8;
let segs = [];
const tileCache = new Map();

function makeSeg(y, biome, blend, step){
  return { y, biome, variant: irand(0, TILE_VARIANTS-1), seed: irand(1, 1e9), blend: blend||null, step: step||0 };
}
// 预排全部图幅，让标题界面后台分批烘焙，进入战斗/BOSS 时不再生成瓦片
function prewarmQueue(){
  for (const b of BIOMES) for (let v=0;v<TILE_VARIANTS;v++){
    const k=b+':'+v;
    if (!tileCache.has(k) && !tileQueue.includes(k)) tileQueue.push(k);
  }
}
function initTerrain(){
  segs = [];
  G.terrainCur = BIOMES[G.biomeIdx];
  G.blendFrom = G.terrainCur; G.blendTo = G.terrainCur; G.blendSteps = 0; G.blendTotal = 4;
  for (let y=-SEG; y<H+SEG; y+=SEG) segs.push(makeSeg(y, G.terrainCur));
  prewarmQueue();
}
// 请求切换群系：不立即替换画面，而是让后续新生成的瓦片跨 N 段连续渐变
function requestBiome(idx, steps){
  const to = BIOMES[idx];
  G.biomeIdx = idx;
  if (to === G.terrainCur) return;
  G.blendFrom = G.terrainCur;
  G.blendTo   = to;
  G.blendTotal = clamp(steps||4, 2, 6);
  G.blendSteps = G.blendTotal;
  G.terrainCur = to;
  // 预排过渡带瓦片：分批烘焙，避免切换那一帧集中生成造成卡顿
  for (let i=0;i<G.blendTotal;i++) getBlendTile(G.blendFrom, to, i, G.blendTotal);
}
function nextSegmentPlan(){
  if (G.blendSteps > 0){
    const i = G.blendTotal - G.blendSteps;
    G.blendSteps--;
    return { biome:G.blendTo, blend:{ from:G.blendFrom, to:G.blendTo, total:G.blendTotal }, step:i };
  }
  return { biome:G.terrainCur, blend:null, step:0 };
}
function scrollSpeed(){ return (G.state==='boss' && !(G.blendSteps>0)) ? 26 : 96; }   // v22：过渡未完时不降速，保证 BOSS 在其属地开战
function updateTerrain(dt){
  const sp = scrollSpeed();
  G.scrolled = (G.scrolled||0) + sp*dt;
  for (const s of segs) s.y += sp*dt;
  if (!segs.length) return;
  let topY = Math.min(...segs.map(s=>s.y));
  for (const s of segs){
    if (s.y > H + 4){
      s.y = topY - SEG; topY = s.y;
      const p = nextSegmentPlan();
      Object.assign(s, makeSeg(s.y, p.biome, p.blend, p.step));
    }
  }
}

function hash2(x, y, seed){
  let h = Math.imul(x|0, 374761393) + Math.imul(y|0, 668265263) + Math.imul(seed|0, 2246822519);
  h = Math.imul(h ^ (h>>>13), 1274126177);
  return ((h ^ (h>>>16)) >>> 0) / 4294967296;
}
function vnoise(x, y, seed){
  const xi=Math.floor(x), yi=Math.floor(y), xf=x-xi, yf=y-yi;
  const u=xf*xf*(3-2*xf), v=yf*yf*(3-2*yf);
  const a=hash2(xi,yi,seed), b=hash2(xi+1,yi,seed), c=hash2(xi,yi+1,seed), d=hash2(xi+1,yi+1,seed);
  const t=a+(b-a)*u;
  return t + ((c+(d-c)*u)-t)*v;
}
function fbm(x, y, seed){
  let s=0, a=0.55, f=1;
  for (let i=0;i<4;i++){ s += a*vnoise(x*f, y*f, seed+i*131); f *= 2; a *= 0.5; }
  return s;
}

function palColor(t, stops){
  t = clamp(t, 0, 1);
  for (let i=1;i<stops.length;i++){
    if (t <= stops[i][0]){
      const p0=stops[i-1][0], c0=stops[i-1][1], p1=stops[i][0], c1=stops[i][1];
      const k=(t-p0)/(p1-p0||1);
      _col[0]=c0[0]+(c1[0]-c0[0])*k; _col[1]=c0[1]+(c1[1]-c0[1])*k; _col[2]=c0[2]+(c1[2]-c0[2])*k;
      return _col;
    }

// --- 3D 投影绘制工具（统一左上光源，阴影投向右下）---
function box3d(g, x, y, w, h, z, top, side, opts){
  opts = opts || {};
  const ox=-z*0.44, oy=-z*0.58;
  g.save(); g.translate(x,y);
  if (opts.rot) g.rotate(opts.rot);
  g.fillStyle='rgba(6,10,12,0.40)';
  g.beginPath(); g.moveTo(-w/2+z*0.65,-h/2+z*0.85); g.lineTo(w/2+z*0.65,-h/2+z*0.85);
  g.lineTo(w/2+z*0.65,h/2+z*0.85); g.lineTo(-w/2+z*0.65,h/2+z*0.85); g.closePath(); g.fill();
  g.fillStyle=side;
  g.beginPath(); g.moveTo(-w/2,h/2); g.lineTo(w/2,h/2); g.lineTo(w/2+ox,h/2+oy); g.lineTo(-w/2+ox,h/2+oy); g.closePath(); g.fill();
  g.fillStyle='rgba(0,0,0,0.20)'; g.fill();
  g.fillStyle=side;
  g.beginPath(); g.moveTo(w/2,-h/2); g.lineTo(w/2,h/2); g.lineTo(w/2+ox,h/2+oy); g.lineTo(w/2+ox,-h/2+oy); g.closePath(); g.fill();
  g.fillStyle='rgba(0,0,0,0.06)'; g.fill();
  g.fillStyle=top; g.fillRect(-w/2+ox, -h/2+oy, w, h);
  g.strokeStyle='rgba(255,255,255,0.13)'; g.lineWidth=1;
  g.strokeRect(-w/2+ox+0.5, -h/2+oy+0.5, w-1, h-1);
  g.fillStyle='rgba(255,255,255,0.10)'; g.fillRect(-w/2+ox+2, -h/2+oy+2, w-4, 2);
  if (opts.roof){
    const rw=Math.max(3,w*0.17), rh=Math.max(2,h*0.15);
    g.fillStyle='rgba(18,24,28,0.34)';
    g.fillRect(-w/2+ox+w*0.12, -h/2+oy+h*0.15, rw, rh);
    g.fillRect(-w/2+ox+w*0.60, -h/2+oy+h*0.58, rw*0.8, rh);
    g.strokeStyle='rgba(0,0,0,0.20)';
    g.beginPath(); g.moveTo(-w/2+ox+w*0.5,-h/2+oy); g.lineTo(-w/2+ox+w*0.5,-h/2+oy+h); g.stroke();
  }
  g.restore();
}

function lighthouse(g, x, y, rng){
  g.fillStyle='rgba(20,24,26,0.4)'; g.beginPath(); g.ellipse(x+3,y+4,10,6,0,0,TAU); g.fill();
  g.fillStyle='#5c5648'; g.beginPath(); g.ellipse(x,y+3,9,5.5,0,0,TAU); g.fill();
  g.fillStyle='#e8e4da'; g.beginPath(); g.moveTo(x-3.4,y+3); g.lineTo(x-2.2,y-13); g.lineTo(x+2.2,y-13); g.lineTo(x+3.4,y+3); g.closePath(); g.fill();
  g.fillStyle='#c8453a'; g.fillRect(x-2.9,y-4.5,5.8,3.4); g.fillRect(x-2.45,y-11,4.9,3);
  g.fillStyle='#2c3136'; g.fillRect(x-2.6,y-16.5,5.2,3.6);
  const gr=g.createRadialGradient(x,y-15,0,x,y-15,15);
  gr.addColorStop(0,'rgba(255,220,130,0.85)'); gr.addColorStop(1,'rgba(255,220,130,0)');
  g.fillStyle=gr; g.beginPath(); g.arc(x,y-15,15,0,TAU); g.fill();
  g.fillStyle='#ffe9a8'; g.beginPath(); g.arc(x,y-15,1.9,0,TAU); g.fill();
  g.fillStyle='rgba(255,236,170,0.10)';
  g.beginPath(); g.moveTo(x,y-15); g.lineTo(x+44,y-24); g.lineTo(x+44,y-7); g.closePath(); g.fill();
}
function palmTree(g, x, y, s, rng){
  g.strokeStyle='rgba(90,70,44,0.9)'; g.lineWidth=1.4;
  g.beginPath(); g.moveTo(x,y); g.quadraticCurveTo(x+1.5,y-s*0.5,x+2.6,y-s); g.stroke();
  g.strokeStyle='#3f7038'; g.lineWidth=1.2;
  for (let k=0;k<6;k++){ const a=-0.4-k*0.5; g.beginPath(); g.moveTo(x+2.6,y-s); g.quadraticCurveTo(x+2.6+Math.cos(a)*s*0.7, y-s+Math.sin(a)*s*0.7-1.5, x+2.6+Math.cos(a)*s*1.05, y-s+Math.sin(a)*s*1.05+1.5); g.stroke(); }
}
function fieldRect(g, x, y, w, h, col, rng){
  g.fillStyle=col; g.fillRect(x,y,w,h);
  g.strokeStyle='rgba(255,248,220,0.13)'; g.lineWidth=1; g.strokeRect(x+0.5,y+0.5,w-1,h-1);
  g.save(); g.beginPath(); g.rect(x,y,w,h); g.clip();
  g.strokeStyle=rng()<0.5?'rgba(0,0,0,0.11)':'rgba(255,250,220,0.12)'; g.lineWidth=1;
  if (rng()<0.5){ for (let i=3;i<h;i+=4){ g.beginPath(); g.moveTo(x,y+i); g.lineTo(x+w,y+i); g.stroke(); } }
  else { for (let i=3;i<w;i+=4){ g.beginPath(); g.moveTo(x+i,y); g.lineTo(x+i,y+h); g.stroke(); } }
  g.restore();
}
function crater(g, x, y, r, rng){
  g.fillStyle='rgba(225,212,180,0.16)'; g.beginPath(); g.arc(x,y,r*1.35,0,TAU); g.fill();
  g.fillStyle='rgba(28,24,20,0.46)'; g.beginPath(); g.arc(x,y,r,0,TAU); g.fill();
  g.fillStyle='rgba(8,8,8,0.32)'; g.beginPath(); g.arc(x+r*0.1,y+r*0.1,r*0.55,0,TAU); g.fill();
  g.strokeStyle='rgba(255,240,210,0.15)'; g.lineWidth=1; g.beginPath(); g.arc(x,y,r*1.15,0,TAU); g.stroke();
  g.strokeStyle='rgba(20,16,12,0.35)';
  for (let i=0;i<5;i++){ const a=rng()*TAU; g.beginPath(); g.moveTo(x+Math.cos(a)*r*0.8,y+Math.sin(a)*r*0.8); g.lineTo(x+Math.cos(a)*r*1.7,y+Math.sin(a)*r*1.7); g.stroke(); }
}
function rock3d(g, x, y, s, rng){
  const pts=[];
  for (let i=0;i<7;i++){ const a=TAU*i/7; pts.push([x+Math.cos(a)*s*(0.7+rng()*0.5), y+Math.sin(a)*s*(0.6+rng()*0.4)]); }
  g.fillStyle='rgba(8,10,8,0.40)';
  g.beginPath(); g.moveTo(pts[0][0]+s*0.45,pts[0][1]+s*0.55);
  for (let i=1;i<7;i++) g.lineTo(pts[i][0]+s*0.45,pts[i][1]+s*0.55);
  g.closePath(); g.fill();
  g.fillStyle='rgba(70,62,48,0.85)';
  g.beginPath(); g.moveTo(pts[0][0],pts[0][1]); for (let i=1;i<7;i++) g.lineTo(pts[i][0],pts[i][1]); g.closePath(); g.fill();
  g.fillStyle='rgba(226,208,168,0.28)';
  g.beginPath(); g.moveTo(pts[5][0],pts[5][1]); g.lineTo(pts[6][0],pts[6][1]); g.lineTo(pts[0][0],pts[0][1]); g.lineTo(x,y); g.closePath(); g.fill();
}
function island(g, x, y, r, rng){
  g.fillStyle='rgba(110,190,205,0.22)'; g.beginPath(); g.ellipse(x,y,r*1.55,r*1.05,0,0,TAU); g.fill();
  g.strokeStyle='rgba(200,235,240,0.35)'; g.lineWidth=1.5; g.beginPath(); g.ellipse(x,y,r*1.35,r*0.92,0,0,TAU); g.stroke();
  const pts=[];
  for (let i=0;i<11;i++){ const a=TAU*i/11; pts.push([x+Math.cos(a)*r*(0.65+rng()*0.5), y+Math.sin(a)*r*0.6*(0.65+rng()*0.5)]); }
  g.fillStyle='rgba(12,20,14,0.35)'; g.beginPath(); g.moveTo(pts[0][0]+r*0.3,pts[0][1]+r*0.28);
  for (let i=1;i<11;i++) g.lineTo(pts[i][0]+r*0.3,pts[i][1]+r*0.28); g.closePath(); g.fill();
  g.fillStyle='#c2ab7d'; g.beginPath();
  { const sx=x+(pts[0][0]-x)*1.16, sy=y+(pts[0][1]-y)*1.16; g.moveTo(sx,sy);
    for (let i=1;i<11;i++) g.lineTo(x+(pts[i][0]-x)*1.16, y+(pts[i][1]-y)*1.16); g.closePath(); g.fill(); }
  g.fillStyle='#5b6b3c'; g.beginPath(); g.moveTo(pts[0][0],pts[0][1]);
  for (let i=1;i<11;i++) g.lineTo(pts[i][0],pts[i][1]); g.closePath(); g.fill();
  g.fillStyle='rgba(190,200,140,0.25)'; g.beginPath(); g.ellipse(x-r*0.2,y-r*0.12,r*0.55,r*0.28,-0.3,0,TAU); g.fill();
}

    g.strokeStyle='rgba(196,172,124,0.35)'; g.lineWidth=2;
    for (let i=0;i<2;i++){ const x=rng()*W; g.beginPath(); g.moveTo(x,0); g.bezierCurveTo(x+18,SEG*0.3,x-22,SEG*0.7,x+8,SEG); g.stroke(); }

    for (let i=0;i<5;i++){ const x=rng()*W-20, y=rng()*SEG-14, w=36+rng()*70, h=22+rng()*40; g.strokeRect(x,y,w,h); }

  } else if (biome==='desert'){

      g.beginPath();
      for (let x=-10;x<=W+10;x+=12) { const yy=y+Math.sin(x*0.035+i)*5; if(x===-10) g.moveTo(x,yy); else g.lineTo(x,yy); }
      g.stroke();
    }
    g.strokeStyle='rgba(196,170,120,0.42)'; g.lineWidth=13; g.lineCap='round';
    const wy=rng()*SEG;

    }

  } else if (biome==='ruins'){

      const x=rng()*W, y=rng()*SEG, w=16+rng()*30, h=12+rng()*20;
      box3d(g, x, y, w, h, 6+rng()*12, rng()<0.5?'#9c9382':'#7e786c', '#565044', {roof:rng()<0.5, rot:rand(-0.18,0.18)});
      g.fillStyle='rgba(30,26,22,0.45)'; g.fillRect(x-w*0.2, y-h*0.2, w*0.28, h*0.3);

      g.fillStyle=rng()<0.5?'rgba(28,24,20,0.5)':'rgba(210,196,168,0.25)'; g.fillRect(x,y,1+rng()*2.4,1+rng()*2);

  } else if (biome==='jungle'){

    for (let i=0;i<6;i++) box3d(g, rng()*W, rng()*SEG, 24+rng()*26, 16+rng()*16, 12+rng()*12,

const tileQueue = [], placeholderCache = new Map();
function placeholderFor(biome){
  for (let v=0;v<TILE_VARIANTS;v++){ const c=tileCache.get(biome+':'+v); if (c) return c; }
  let c=placeholderCache.get(biome);
  if (c) return c;
  c=document.createElement('canvas'); c.width=W; c.height=SEG;
  const g=c.getContext('2d'), m=PALETTES[biome][2][1];
  g.fillStyle='rgb('+m[0]+','+m[1]+','+m[2]+')'; g.fillRect(0,0,W,SEG);
  const gr=g.createLinearGradient(0,0,W,SEG);
  gr.addColorStop(0,'rgba(255,255,255,0.06)'); gr.addColorStop(1,'rgba(0,0,0,0.12)');
  g.fillStyle=gr; g.fillRect(0,0,W,SEG);
  placeholderCache.set(biome,c);
  return c;
}
function getTile(biome, variant){
  const key=biome+':'+variant, c=tileCache.get(key);
  if (c) return c;
  if (!tileQueue.includes(key)) tileQueue.push(key);
  return placeholderFor(biome);
}
function pumpTiles(n){
  for (let i=0;i<n && tileQueue.length;i++){
    const key=tileQueue.shift();
    if (tileCache.has(key)) continue;
    const sp=key.split(':');
    buildTile(sp[0], +sp[1]);
  }
  // 过渡带优先、每帧最多烘焙 1 张
  for (let i=0;i<1 && blendQueue.length;i++) buildBlendTile(blendQueue.shift());
}
function buildTile(biome, variant){
  const key = biome+':'+variant;
  let c = tileCache.get(key);
  if (c) return c;
  const seed = 9137 + variant*7919 + BIOMES.indexOf(biome)*104729;
  const rng = mulberry32(seed);
  const NW=360, NH=120;   // v22：地表内部分辨率 240×80 → 360×120，颗粒更细
  const small=document.createElement('canvas'); small.width=NW; small.height=NH;
  const sg=small.getContext('2d'), img=sg.createImageData(NW,NH), data=img.data;
  const HF=new Float32Array(NW*NH);
  for (let py=0;py<NH;py++) for (let px=0;px<NW;px++)
    HF[py*NW+px] = fbm(px/17,py/17,seed)*0.60 + fbm(px/52,py/52,seed+991)*0.28 + fbm(px/6,py/6,seed+517)*0.12;   // v22：加一层细 octave 颗粒
  // 归一化每个图幅的平均高度，保证不同瓦片底色一致、拼接无色差
  let mean=0; for (let i=0;i<HF.length;i++) mean+=HF[i]; mean/=HF.length;
  for (let i=0;i<HF.length;i++) HF[i]=0.5+(HF[i]-mean)*0.95;
  const at=(x,y)=> HF[clamp(y,0,NH-1)*NW + clamp(x,0,NW-1)];
  const stops=PALETTES[biome], isSea=biome==='sea';
  const amp=isSea?2.0:(biome==='mountain'?7.2:4.6), lo=isSea?0.84:0.70, hi=isSea?1.12:1.28, grainAmp=isSea?3:7;
  for (let py=0;py<NH;py++) for (let px=0;px<NW;px++){
    const h=HF[py*NW+px];
    const ridge = biome==='desert' ? Math.sin(px*0.10+py*0.24+h*8)*0.045 : 0;
    let t=clamp(0.5+(h-0.5)*0.80+ridge+(hash2(px,py,seed+7)-0.5)*0.05,0,1);
    if (biome==='mountain') t=clamp(Math.pow(t,1.45)*1.22,0,1);   // 山地：压暗谷底、抬高峰顶出雪线
    if (biome==='jungle') t=clamp(0.5+(t-0.5)*0.72,0,1);          // 丛林：压平起伏，底色沉稳
    const col=palColor(t,stops);
    const d=(at(px-1,py)-at(px+1,py)) + (at(px,py-1)-at(px,py+1));
    const light=clamp(0.97+d*amp,lo,hi);
    const grain=(hash2(px,py,seed+31)-0.5)*grainAmp;
    const i4=(py*NW+px)*4;
    data[i4]  =clamp(col[0]*light+grain,0,255);
    data[i4+1]=clamp(col[1]*light+grain,0,255);
    data[i4+2]=clamp(col[2]*light+grain,0,255);
    data[i4+3]=255;
  }
  // 边缘 4px 向基准色渐变，消除图幅之间的硬接缝
  const mid=palColor(0.5,stops).slice();
  for (let py=0;py<NH;py++){
    const edge = py<4 ? (4-py)/4 : (py>NH-5 ? (py-(NH-5))/4 : 0);
    if (!edge) continue;
    const k=edge*0.45;
    for (let px=0;px<NW;px++){
      const i4=(py*NW+px)*4;
      data[i4]  =data[i4]*(1-k)+mid[0]*k;
      data[i4+1]=data[i4+1]*(1-k)+mid[1]*k;
      data[i4+2]=data[i4+2]*(1-k)+mid[2]*k;
    }
  }
  sg.putImageData(img,0,0);
  c=document.createElement('canvas'); c.width=W; c.height=SEG;
  const g=c.getContext('2d');
  g.imageSmoothingEnabled=true; g.drawImage(small,0,0,W,SEG);
  drawTileFeatures(g,biome,rng);
  tileCache.set(key,c);
  return c;
}
// 连续道路层：以"屏幕世界坐标"定义曲线，段循环时无接缝
function traceSmooth(g, pts, cont){
  // v48：贝塞尔平滑描摹 —— 以相邻点中点为锚、原点为控制点画二次曲线，折线变真曲线
  if (cont) g.lineTo(pts[0][0], pts[0][1]); else g.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length - 1; i++){
    const mx = (pts[i][0] + pts[i+1][0]) / 2, my = (pts[i][1] + pts[i+1][1]) / 2;
    g.quadraticCurveTo(pts[i][0], pts[i][1], mx, my);
  }
  g.lineTo(pts[pts.length - 1][0], pts[pts.length - 1][1]);
}
function drawRoadLayer(g, biome, segY, phase){
  if (biome==='sea' || biome==='jungle') return;   // v43：丛林无道路 —— 河流取代道路
  const isCity=biome==='city', isFort=biome==='fortress';
  const w = 30;   // v43：全群系统一宽度，群系交界不再粗细突变
  const gx = y => W*0.44 + Math.sin((segY+y-phase)/210)*56 + Math.sin((segY+y-phase)/72)*10;
  const path = off =>{ const pts=[]; for (let y=-24;y<=SEG+24;y+=10) pts.push([gx(y)+(off||0), y]); g.beginPath(); traceSmooth(g, pts); };
  g.save(); g.lineCap='butt'; g.lineJoin='round';
  // v22：平行土路（非城市/堡垒）——与主路同曲线偏置，无接缝
  if (!isCity && !isFort){
    path(-86); g.strokeStyle='rgba(30,26,20,0.18)'; g.lineWidth=9; g.stroke();
    path(-86); g.strokeStyle= biome==='desert' ? 'rgba(214,188,138,0.30)' : 'rgba(178,158,118,0.30)'; g.lineWidth=6.5; g.stroke();
    path(-86); g.setLineDash([3,9]); g.strokeStyle='rgba(70,58,40,0.30)'; g.lineWidth=1.1; g.stroke(); g.setLineDash([]);
  }
  path(0); g.strokeStyle='rgba(6,10,10,0.30)'; g.lineWidth=w+10; g.stroke();
  path(0); g.strokeStyle=isFort?'rgba(215,218,205,0.5)':(biome==='desert'?'rgba(226,204,158,0.35)':'rgba(190,190,178,0.35)'); g.lineWidth=w+4; g.stroke();
  path(0); g.strokeStyle=isFort?'#3c4346':(isCity?'#3a4042':(biome==='desert'?'#9c8054':'#494a46')); g.lineWidth=w; g.stroke();
  // v22：路缘线
  path(-w/2+1.6); g.strokeStyle='rgba(238,238,228,0.34)'; g.lineWidth=1.3; g.stroke();
  path( w/2-1.6); g.strokeStyle='rgba(238,238,228,0.34)'; g.lineWidth=1.3; g.stroke();
  path(0); g.setLineDash(isFort?[26,20]:[15,13]);
  g.strokeStyle=isCity?'rgba(240,205,90,0.65)':'rgba(240,232,200,0.55)'; g.lineWidth=isCity?2.4:1.8; g.stroke();
  g.setLineDash([]);
  if (!isCity && !isFort){
    g.strokeStyle='rgba(20,22,20,0.30)'; g.lineWidth=1.4;
    for (let y=10;y<SEG;y+=46){
      const x=gx(y);
      g.beginPath(); g.moveTo(x+w*0.5+3,y); g.lineTo(x+w*0.5+13,y+8); g.stroke();
      g.fillStyle='rgba(28,28,26,0.55)'; g.fillRect(x+w*0.5+1,y-2,2.6,8);
    }
  }
  g.restore();
}

// ---- 河流 / 桥梁层（草原与丛林；世界坐标定义，与道路一样跨段无接缝） ----------
// v45 河流系统：全图一条统一河道（与道路同源曲线 + 恒定右偏移 94–162，河永远在道路右侧、永不交叉）；
// 宽度/颜色按群系：高山细溪 12 → 丛林大河 100（亚马逊感、带沙洲）→ 草原 36 → 沙漠干涸（留干河床痕）
// → 城市小渠 16 → 废墟小河 16 → 入海消失。过渡段宽度线性渐变 —— 汇入、变宽、干涸都连续发生，不跳变。
function riverXAt(segY, y, phase){
  return W*0.44 + Math.sin((segY+y-phase)/210)*56 + Math.sin((segY+y-phase)/72)*10 + 128 + Math.sin((segY+y-phase)/340)*34;
}
const RIVER_DEF = {
  grass:   { half:18, bank:9,  water:'#2e6b7d', center:'#5b9cae', bankCol:'#8a6f4d', sandCol:'#c9b183' },
  jungle:  { half:50, bank:16, water:'#2e6b7d', center:'#5b9cae', bankCol:'#6e5136', sandCol:'#b39b6d' },   // v47：水色与草原统一，不再换色
  city:    { half:8,  bank:5,  water:'#46626e', center:'#5f8694', bankCol:'#7d838a', sandCol:'#83898f' },
  ruins:   { half:8,  bank:7,  water:'#4d6b63', center:'#68847a', bankCol:'#77684f', sandCol:'#a5936f' },
  mountain:{ half:6,  bank:5,  water:'#4d8093', center:'#79aec2', bankCol:'#6f6e6a', sandCol:'#8e8c85' },
};
function drawRiverLayer(g, s, phase, u){
  const toD = RIVER_DEF[s.biome] || null;
  const fromD = s.blend ? (RIVER_DEF[s.blend.from] || null) : null;
  const segY = s.y;
  // v48 汇入定版（用户定）：不用宽度渐变（楔形棱角），改模糊融合 —— from/to 两套河流同道叠绘，
  // 透明度不只整段交叉、还在段内沿流向用渐变连续过渡（段首/段尾进度衔接邻段），横向分界线也消除。
  // 河道本身：左右两岸用贝塞尔曲线描边（traceSmooth），是真曲线。
  const colA = (col, a) => {
    if (col[0] === '#'){ const n = parseInt(col.slice(1), 16); return 'rgba(' + (n >> 16 & 255) + ',' + (n >> 8 & 255) + ',' + (n & 255) + ',' + a + ')'; }
    return col.replace('rgb(', 'rgba(').replace(')', ',' + a + ')');
  };
  const gradFor = (col, aT, aB, mult) => {
    const gr = g.createLinearGradient(0, 0, 0, SEG);
    gr.addColorStop(0, colA(col, aT * mult)); gr.addColorStop(1, colA(col, aB * mult));
    return gr;
  };
  const ribbonC = (halfW, extra) => {
    const L = [], R = [];
    for (let y = -24; y <= SEG + 24; y += 10){ const x = riverXAt(segY, y, phase); L.push([x - halfW - extra, y]); R.push([x + halfW + extra, y]); }
    g.beginPath();
    traceSmooth(g, L);
    g.lineTo(R[R.length - 1][0], R[R.length - 1][1]);
    traceSmooth(g, R.slice().reverse(), true);
    g.closePath();
  };
  // 一趟河流：aT/aB = 段首/段尾不透明度（非过渡时恒 1）
  const riverPass = (def, aT, aB) => {
    if (!def || Math.max(aT, aB) <= 0.01) return;
    if (def.half < 1){ if (def === RIVER_DEF.desert) dryPass(aT, aB); return; }
    const flat = aT === aB;
    const sty = (col, mult) => flat ? (g.globalAlpha = aT * mult, col) : gradFor(col, aT, aB, mult);
    g.fillStyle = sty(def.bankCol, 0.30); ribbonC(def.half, def.bank + 6); g.fill();
    g.fillStyle = sty(def.bankCol, 1);    ribbonC(def.half, def.bank); g.fill();
    g.fillStyle = sty(def.sandCol, 1);    ribbonC(def.half, def.bank * 0.45); g.fill();
    g.fillStyle = sty(def.water, 1);      ribbonC(def.half, 0); g.fill();
    g.fillStyle = sty(def.center, 0.55);  ribbonC(def.half * 0.42, 0); g.fill();
    g.globalAlpha = 1;
  };
  const dryPass = (aT, aB) => {
    const flat = aT === aB;
    const sty = (col, mult) => flat ? (g.globalAlpha = aT * mult, col) : gradFor(col, aT, aB, mult);
    g.fillStyle = sty('#927246', 0.45); ribbonC(0, 13); g.fill();
    g.fillStyle = sty('#70522c', 0.32); ribbonC(0, 6); g.fill();
    g.globalAlpha = 1;
  };
  const sidePass = (def, biomeName, aT, aB) => {
    if (def) riverPass(def, aT, aB);
    else if (biomeName === 'desert') dryPass(aT, aB);
  };
  g.save();
  g.beginPath(); g.rect(-20, 0, W + 40, SEG); g.clip();   // 按本段裁切：半透明层不与邻段叠绘
  if (s.blend){
    const u0 = s.step / s.blend.total, u1 = (s.step + 1) / s.blend.total;
    sidePass(fromD, s.blend.from, 1 - u0, 1 - u1);
    sidePass(toD, s.blend.to, u0, u1);
  } else if (toD) riverPass(toD, 1, 1);
  else if (s.biome === 'desert') dryPass(1, 1);
  // 沙洲与碎光按主导侧画
  const dom = (s.blend && u < 0.5) ? fromD : toD;
  if (dom && dom.half > 34){
    const k = Math.round((segY - phase) / SEG);
    if (hash2(k, 515, 8) < 0.55){
      const yy = 30 + hash2(k, 77, 8) * (SEG - 60);
      const xx = riverXAt(segY, yy, phase) + (hash2(k, 91, 8) - 0.5) * dom.half * 0.8;
      g.save(); g.translate(xx, yy); g.rotate((hash2(k, 33, 8) - 0.5) * 0.7);
      g.fillStyle = dom.sandCol; g.globalAlpha = 0.9;
      g.beginPath(); g.ellipse(0, 0, 16 + hash2(k, 55, 8) * 16, 6 + hash2(k, 66, 8) * 5, 0, 0, TAU); g.fill();
      g.globalAlpha = 0.5; g.fillStyle = dom.center;
      g.beginPath(); g.ellipse(0, 0, 9 + hash2(k, 55, 8) * 10, 3.5, 0, 0, TAU); g.fill();
      g.restore(); g.globalAlpha = 1;
    }
  }
  if (dom && dom.half >= 1){
    g.strokeStyle = 'rgba(235,250,255,0.20)'; g.lineWidth = 1.4; g.lineCap = 'round';
    const stepY = dom.half > 34 ? 44 : 26;
    for (let y = 6; y < SEG; y += stepY){ const x = riverXAt(segY, y, phase) + ((y * 37) % 13) - 6; g.beginPath(); g.moveTo(x - 5, y); g.lineTo(x + 5, y + 2); g.stroke(); }
  }
  g.restore();
}

// ---- 群系过渡带 ----------------------------------------------------------
// 旧做法是「一段草地 / 一段海面」直接换瓦片，边界就是一条直线。
// 现在把 from / to 两张航拍瓦片按 u∈[0,1] 连续混合：u 在整个过渡区
// （total 段）里单调递增，再叠加 fBm 波浪扰动，得到自然曲折的海岸线；
// 海陆交界处按 u 的距离渲染湿沙、干沙与两道浪花。城市/沙漠交界则渲染
// 碎石粉尘渐隐带。过渡段之间 u 首尾相接，不会出现色阶断层。
const blendCache = new Map(), blendQueue = [];
function blendTileKey(from,to,step,total){ return from+'>'+to+'#'+step+'/'+total; }
function getBlendTile(from,to,step,total){
  const key=blendTileKey(from,to,step,total);
  const c=blendCache.get(key);
  if (c) return c;
  if (!blendQueue.some(r=>r.key===key)) blendQueue.push({key,from,to,step,total});
  return null;
}
function buildBlendTile(rec){
  if (blendCache.has(rec.key)) return;
  const va = rec.step % TILE_VARIANTS, vb = (rec.step*3+2) % TILE_VARIANTS;   // v41：每步换一对变体，过渡带内特征不再整段重复
  if (!tileCache.has(rec.from+':'+va)) buildTile(rec.from,va);
  if (!tileCache.has(rec.to+':'+vb))   buildTile(rec.to,vb);
  const A=tileCache.get(rec.from+':'+va), B=tileCache.get(rec.to+':'+vb);
  if (!A || !B) return;
  const ca=document.createElement('canvas'); ca.width=W; ca.height=SEG;
  const ga=ca.getContext('2d'); ga.drawImage(A,0,0);
  const cb=document.createElement('canvas'); cb.width=W; cb.height=SEG;
  const gb=cb.getContext('2d'); gb.drawImage(B,0,0);
  const ia=ga.getImageData(0,0,W,SEG), ib=gb.getImageData(0,0,W,SEG);
  const da=ia.data, db=ib.data;
  const seaPair    = rec.from==='sea' || rec.to==='sea';
  const desertPair = rec.from==='desert' || rec.to==='desert';
  const cityPair   = ['city','ruins','fortress'].includes(rec.from) || ['city','ruins','fortress'].includes(rec.to);
  const seed = rec.from.length*911 + rec.to.length*337 + rec.step*77;
  const wave = new Float32Array(W);
  for (let x=0;x<W;x++)
    wave[x] = Math.sin(x*0.021+seed)*30 + Math.sin(x*0.057+seed*1.7)*12
            + (fbm(x/38, rec.step*0.8+3, seed)-0.5)*60;
  for (let x=0;x<W;x++){
    const w = wave[x]/(SEG*rec.total);
    for (let y=0;y<SEG;y++){
      const u = clamp((rec.step + 1 - y/SEG)/rec.total + w, 0, 1);
      const a = u*u*(3-2*u);
      const i=(y*W+x)*4;
      let R=da[i]*(1-a)+db[i]*a, Gc=da[i+1]*(1-a)+db[i+1]*a, Bc=da[i+2]*(1-a)+db[i+2]*a;
      const d=Math.abs(u-0.5);
      if (seaPair){
        const sand=clamp(1-d/0.115,0,1)*0.88;
        if (sand>0){ R=R*(1-sand)+218*sand; Gc=Gc*(1-sand)+201*sand; Bc=Bc*(1-sand)+156*sand; }
        const foam=clamp(1-Math.abs(d-0.093)/0.012,0,1)*0.85;
        if (foam>0){ R=R*(1-foam)+240*foam; Gc=Gc*(1-foam)+250*foam; Bc=Bc*(1-foam)+246*foam; }
        const wet=clamp(1-Math.abs(d-0.135)/0.022,0,1)*0.32;
        if (wet>0){ R=R*(1-wet)+126*wet; Gc=Gc*(1-wet)+158*wet; Bc=Bc*(1-wet)+166*wet; }
      } else {
        const band=clamp(1-d/0.13,0,1)*0.28;
        if (band>0){
          const cr=desertPair?198:152, cg=desertPair?178:148, cb2=desertPair?134:140;
          R=R*(1-band)+cr*band; Gc=Gc*(1-band)+cg*band; Bc=Bc*(1-band)+cb2*band;
        }
      }
      if (cityPair && d<0.16 && hash2(x,y,seed+51)>0.987){ R=232; Gc=224; Bc=204; }
      da[i]=R; da[i+1]=Gc; da[i+2]=Bc; da[i+3]=255;
    }
  }
  ga.putImageData(ia,0,0);
  // 沿同一条波浪海岸线补浪花弧线与砾石，让过渡带更像真实潮间带
  if (seaPair){
    ga.save(); ga.lineWidth=1.6; ga.lineCap='round';
    for (const dd of [0.093,0.135]){
      ga.strokeStyle = dd<0.1 ? 'rgba(242,252,250,0.55)' : 'rgba(92,148,166,0.38)';
      ga.beginPath();
      for (let x=0;x<=W;x+=6){
        const yy = SEG*(rec.step+1 - rec.total*(0.5+dd - wave[Math.min(x,W-1)]/(SEG*rec.total)));
        if (x===0) ga.moveTo(x,yy); else ga.lineTo(x,yy);
      }
      ga.stroke();
    }
    ga.restore();
  }
  const rng=mulberry32(seed*13+7);
  for (let i=0;i<46;i++){
    const x=rng()*W, u=0.5+(rng()-0.5)*0.22;
    const yy=SEG*(rec.step+1 - rec.total*(u - wave[Math.min(x|0,W-1)]/(SEG*rec.total)));
    if (yy<-4 || yy>SEG+4) continue;
    ga.fillStyle = rng()<0.5 ? 'rgba(70,66,56,0.34)' : 'rgba(236,228,202,0.42)';
    ga.beginPath(); ga.ellipse(x,yy,1+rng()*2.6,0.6+rng()*1.4,0,0,TAU); ga.fill();
  }
  blendCache.set(rec.key, ca);
  // 过渡瓦片是有限组合但会随长局不断新增，给一个宽松的 FIFO 上限防止内存无限增长
  if (blendCache.size > 160){
    let n = 0;
    for (const k of blendCache.keys()){ if (++n > 40) break; blendCache.delete(k); }
  }
}
function drawSeg(s){
  ctx.save(); ctx.translate(0, s.y);
  ctx.beginPath(); ctx.rect(0,-2,W,SEG+4); ctx.clip();
  let roadA = 1, blendU = 0;
  if (s.blend){
    const bt = getBlendTile(s.blend.from, s.blend.to, s.step, s.blend.total);
    if (bt) ctx.drawImage(bt, 0, -1, W, SEG+2);
    else { // 瓦片尚未烘焙完：用简易交叉淡入兜底，绝不留白
      const f=(s.step+1)/s.blend.total;
      ctx.drawImage(getTile(s.blend.from,s.variant), 0, -1, W, SEG+2);
      ctx.globalAlpha=f; ctx.drawImage(getTile(s.blend.to,s.variant), 0, -1, W, SEG+2);
      ctx.globalAlpha=1;
    }
    blendU = clamp((s.step+0.5)/s.blend.total, 0, 1);
    roadA = 1 - 0.25*Math.sin(Math.PI*blendU);   // v45：过渡段靠双样式交叉淡化衔接，路面不再深褪
  } else {
    ctx.drawImage(getTile(s.biome, s.variant), 0, -1, W, SEG+2);
  }
  drawRiverLayer(ctx, s, G.scrolled||0, blendU);
  if (s.blend){
    ctx.globalAlpha = roadA * (1 - blendU); drawRoadLayer(ctx, s.blend.from, s.y, G.scrolled||0);
    ctx.globalAlpha = roadA * blendU;       drawRoadLayer(ctx, s.blend.to,   s.y, G.scrolled||0);
    ctx.globalAlpha = 1;
  } else if (roadA > 0.05){ ctx.globalAlpha = roadA; drawRoadLayer(ctx, s.biome, s.y, G.scrolled||0); ctx.globalAlpha = 1; }
  if (s.biome==='city' && !s.blend){
    // v43：体育场 = 世界坐标地标；v47：只在纯城市段出现，过渡带里不刷（约每 14 段滚动一张）—— 贴道路一侧、画在道路之后，永不被路压住
    const k = Math.round((s.y - (G.scrolled||0)) / SEG);
    let stadOK = hash2(k, 7717, 99) < 0.07;
    if (stadOK) for (let d=1; d<=8; d++) if (hash2(k-d, 7717, 99) < 0.07){ stadOK = false; break; }   // 至少隔 8 段才再出一座，杜绝扎堆
    if (stadOK){
      const yMid = 48 + hash2(k, 31, 7) * (SEG - 96);
      const ph = G.scrolled || 0;
      const gxMid = W*0.44 + Math.sin((s.y + yMid - ph)/210)*56 + Math.sin((s.y + yMid - ph)/72)*10;
      const side = hash2(k, 97, 3) < 0.5 ? -1 : 1;
      const sx = clamp(gxMid + side * 86, 68, W - 68);
      ctx.globalAlpha = roadA; stadium(ctx, sx, yMid, mulberry32(k * 131 + 7)); ctx.globalAlpha = 1;
    }
  }
  ctx.restore();
}

function updateAllies(dt){
  for (const a of allies){
    a.age += dt;
    if (a.age < 1.3){
      const k = 1-Math.pow(1-a.age/1.3, 3);          // easeOutCubic：缓升入场
      a.y = a.y0 + (a.y1-a.y0)*k;
      a.x = a.ax + a.ox;
    } else if (a.age < 5){
      a.y = a.y1 + Math.sin(G.t*1.6+a.ph)*4;        // 巡航悬停：整队在屏上驻留到第 5 秒
      a.x = a.ax + a.ox + Math.sin(G.t*1.1+a.ph)*3;
    } else {
      a.y -= (300 + (a.age-5)*1500)*dt;             // 第 5 秒：加速拉升离场
      a.x = a.ax + a.ox;
    }
    if (a.flash>0) a.flash -= dt;
    // 发射窗口：入场后段起、离场前止 —— 按等级把每架的导弹数均匀撒满这段时间
    if (a.age>0.7 && a.age<5){
      a.fireT -= dt;
      if (a.fireT<=0 && a.shots>0){
        const has = foes.length>0 || grounds.length>0 || (G.boss && G.boss.state==='fight');
        if (has){
          bullets.push({ kind:'missile', x:a.x, y:a.y-12, vx:rand(-26,26), vy:-320, r:6, dmg:specDmg(4)*a.pow, homing:true, life:3.2 });
          playSfx('missile', 0.14);
          a.shots--; a.fireT = a.fireInt;
        } else a.fireT = 0.3;
      }
    }
  }
  allies = allies.filter(a=> !a.dead && a.y > -70);
}

  let x, y;
  if (ts.length){
    const t = ts[Math.floor(Math.random()*ts.length)];
    x = t.x; y = t.y;
    damageTarget(t, specDmg(t===G.boss ? 12 : 6));
  } else { x = rand(40, W-40); y = rand(120, H-160); }
  beams.push({ x, y, w:9, life:0.26, max:0.26, color:'#cfe6ff', bolt:true });
  parts.push({ kind:'ring', x, y, r:4, vr:130, life:0.22, max:0.22, color:'#bfe0ff' });
  for (let i=0;i<6;i++) parts.push({ kind:'spark', x, y, vx:rand(-130,130), vy:rand(-160,30), life:rand(0.15,0.3), max:0.3, color: choice(['#cfe6ff','#ffffff','#9adcff']), size:rand(1.4,2.6) });
  playSfx('stormBolt', 0.04);
  G.shake = Math.max(G.shake, 3);
}
function castSpecial(id){
  playSfx(SKILL_SFX[id] || 'spec', 0.05);
  if (id==='heavy'){
    // 大炮类：炮弹半径随主炮等级一起变大，视觉与判定同步
    // 大炮类伤害小幅收敛：10 → 8（-20%），保留穿透与放大手感
    bullets.push({ kind:'shell', x:P.x, y:P.y-18, vx:0, vy:-720, r:10+(clamp(P.gun,1,GUN_MAX)-1)*0.55, dmg:specDmg(8), pierce:true, life:1.6 });
  } else if (id==='homing'){
    for (let i=0;i<4;i++) spawnMissile(P.x + (i-1.5)*16, P.y+6, false);
  } else if (id==='triple'){
    for (let i=-1;i<=1;i++) bullets.push({ kind:'shell', x:P.x+i*14, y:P.y-16, vx:i*70, vy:-640, r:8+(clamp(P.gun,1,GUN_MAX)-1)*0.35, dmg:specDmg(4), pierce:false, life:1.6 });
  } else if (id==='drones'){
    // v20：冷却结束不再「升级」，只把僚机回补到编制上限 P.droneCap。
    // 编制上限只由「击破无人机航母的次数」决定（2 → 4 → 6 → 8 架），
    // 所以被打掉两架之后，冷却结束只会回到编制上限，绝不会越过上限继续涨。
    const dcap = clamp(P.droneCap|0, 0, DRONE_MAX);
    if (P.droneCount < dcap){
      const add = dcap - P.droneCount;
      P.droneCount = dcap;
    }
    P.dronesUntil = G.t + 1e6;      // 僚机常驻，升级进度整局保留
  } else if (id==='lurking'){
    for (let i=0;i<6;i++) spawnMissile(30 + i*(W-60)/5, H+14, true);
  } else if (id==='swarm'){
    // 战斗集群：六机三角编队（1+2+3）自屏底升空掠过，每架按技能等级发射 1–4 枚跟踪导弹；
    // 等级 = 击破蝎王次数（specLvl.swarm）；4 枚封顶后，每再升一级导弹威力 +30%。
    const lvl = Math.max(1, P.specLvl.swarm||1);
    const per = clamp(lvl, 1, 4), pow = 1 + 0.3*Math.max(0, lvl-4);
    const ax = clamp(P.x, 112, W-112);
    const offs = [[0,64],[-44,26],[44,26],[-88,-12],[0,-12],[88,-12]];
    offs.forEach((o,i)=>{ allies.push({ x:ax+o[0], y0:H+52-o[1], y1:Math.round(H*0.66)-o[1], y:H+52-o[1], ax, ox:o[0], r:13, hp:3, flash:0, ph:rand(0,TAU), age:0, shots:per, pow, fireT:0.9+i*0.22, fireInt:3.6/Math.max(1,per) }); });
  } else if (id==='pulse'){
    P.laserUntil = G.t + 0.6; P.laserKind = 'pulse';
  } else if (id==='cluster'){
    // v41：爆炸范围随技能等级成长（+5%/级，封顶 +50% → 半径 54→81）
    const boomR = Math.round(54 * (1 + Math.min(0.50, ((P.specLvl.cluster||1)-1)*0.05)));
    for (let i=0;i<5;i++) bullets.push({ kind:'bomb', x:P.x, y:P.y-10, vx:(i-2)*95, vy:-330-Math.abs(i-2)*22, r:7, dmg:specDmg(6), life:0.8+i*0.06, boomR });   // v36：引爆时刻错开，轰隆声连成串
  } else if (id==='rail'){
    // v41：每 5 级多打一条（最多 3 条），先后间隔发出
    const n = Math.min(3, 1 + Math.floor((P.specLvl.rail||0)/5));
    railBeam();
    for (let i=1;i<n;i++) setTimeout(()=>{ if (!P.dead && (G.state==='play' || G.state==='boss')) railBeam(); }, i*170);
  } else if (id==='storm'){
    // v41：随机落雷 —— 初始 3 道、每升一级 +1（封顶 15），3 秒内逐道劈完（队列在 updatePlayer 里推进）
    const total = Math.min(15, 2 + (P.specLvl.storm||1));
    G.stormLeft = total; G.stormInt = 3/Math.max(1,total); G.stormT = 0;
  } else if (id==='stinger'){
    // v41：单发伤害 2 → 5，鲜红穿甲针，完全贯穿（每个目标只结算一次，见 collisions）
    for (let i=-2;i<=2;i++)
      bullets.push({ kind:'spike', x:P.x+i*7, y:P.y-12, vx:i*58, vy:-680, r:5, dmg:specDmg(5), pierce:true, life:1.5 });
  } else if (id==='devour'){
    const R = Math.round(195 * devourRangeMul());   // v35：基础半径 195 × 范围倍率（含清弹幕半径与光环视觉）
    parts.push({ kind:'ring', x:P.x, y:P.y, r:10, vr:R*3.1, life:0.34, max:0.34, color:'#b8f0ff' });
    parts.push({ kind:'ring', x:P.x, y:P.y, r:6,  vr:R*2.0, life:0.50, max:0.50, color:'#8f7dff' });
    for (const t of targetsList()) if (dist2(P.x,P.y,t.x,t.y) < R*R) damageTarget(t, specDmg(t===G.boss?11:8));
    ebs = ebs.filter(e=> dist2(P.x,P.y,e.x,e.y) > R*R);
    G.shake = Math.max(G.shake, 5);
  }
}
// 僚机：最多 8 架，均匀（对称）环绕主机四周；满编后每级增加每架的射击方向数。
const DRONE_MAX = 8, DRONE_SHOTS_MAX = 4;
// v37：僚机连发数 —— 随蜂巢击破数（技能等级）成长：每 3 级 +1 发，封顶 5 发
function droneBurst(){ return Math.min(5, 1 + Math.floor(((P.specLvl&&P.specLvl.drones)||0) / 3)); }
function dronePositions(){
  const n = clamp(P.droneCount|0, 0, DRONE_MAX);
  if (!n) return [];
  const sf = shipScale(G.ship)/1.15, out = [];
  if (G.ship===1){
    // 赤鸢：固定环绕（不自转），每架沿自身角度径向直射
    const R = 34*sf;
    for (let i=0;i<n;i++){
      const a = -Math.PI/2 + TAU*i/n;
      out.push({ x:P.x + Math.cos(a)*R, y:P.y + Math.sin(a)*R, a });
    }
  } else if (G.ship===2){
    // 澜隼（v39）：僚机在机身附近随机游荡 —— 每架有自己的随机航点，抵达后换新航点
    if (!P.roam) P.roam = [];
    while (P.roam.length < n) P.roam.push({ x:rand(-70,70), y:rand(-50,40), tx:rand(-88,88), ty:rand(-64,48) });
    const rdt = clamp(G.t - (P.roamT||0), 0, 0.05); P.roamT = G.t;
    for (let i=0;i<n;i++){
      const r = P.roam[i];
      const dx = r.tx - r.x, dy = r.ty - r.y, dd = Math.hypot(dx, dy);
      if (dd < 7){ r.tx = rand(-88,88); r.ty = rand(-64,48); }
      else { const step = Math.min(dd, 74*rdt); r.x += dx/dd*step; r.y += dy/dd*step; }
      out.push({ x:P.x + r.x, y:P.y + r.y, a:-Math.PI/2 });
    }
  } else if (G.ship===3){
    // 碎星（v39）：与苍隼相同的四周环绕自转阵型
    const R = 34*sf;
    for (let i=0;i<n;i++){
      const a = -Math.PI/2 + TAU*i/n + G.t*0.35;
      out.push({ x:P.x + Math.cos(a)*R, y:P.y + Math.sin(a)*R, a });
    }
  } else {
    // 苍隼：四周环绕，整体缓慢自转（原样）
    const R = 34*sf;
    for (let i=0;i<n;i++){
      const a = -Math.PI/2 + TAU*i/n + G.t*0.35;   // 等角分布 = 始终对称，整体缓慢自转
      out.push({ x:P.x + Math.cos(a)*R, y:P.y + Math.sin(a)*R, a });
    }
  }
  return out;
}
function effCd(id){ return SPECIALS[id].cd * (P.cdMul[id]||1) * (G.specCd||1); }
// v35：稀有「攻击」道具改为全体伤害加成，统一在 damageTarget 里乘 G.specPower；技能基础值不再单独放大
function specDmg(v){ return v; }
// 深渊咆哮范围倍率：重复击破噬星 +3%/次，封顶 +60%
function devourRangeMul(){ return 1 + Math.min(0.60, Math.max(0, ((P.specLvl&&P.specLvl.devour)||1) - 1) * 0.03); }
function specialWorth(id){
  const ts = targetsList();
  // 由 cd 控制节奏：每次冷却结束升一级；满级后空放没意义，
  // 但被护盾消耗掉僚机后会自动再补 +2，形成可再生资源。
  // v20：僚机的「升级」改由击破无人机航母驱动，冷却结束只负责回补，
  // 所以这里恒为 true —— 冷却照常走完，不会出现技能永远亮着的假就绪。
  if (id==='drones') return true;
  if (id==='devour') return ts.length > 0;
  if (!ts.length) return id==='heavy' || id==='triple' || id==='cluster';
  if (id==='swarm') return ts.length >= 2 || !!G.boss;
  if (id==='pulse' || id==='rail')
    return !!G.boss || ts.some(t=> Math.abs(t.x - P.x) < 72 + t.r && t.y < P.y);
  if (id==='storm') return ts.length >= 1 || !!G.boss;
  return true;
}
function autoSpecials(){
  for (const id of P.specials){
    if ((P.cds[id]||0) <= G.t && specialWorth(id)){
      castSpecial(id);
      P.cds[id] = G.t + effCd(id);
    }
  }
}

// ---------- enemies ----------
// ---------- 无尽层数曲线（v11）----------
// v12：敌军血量改为「分层规则」（见 foeHpMul）
// 「层数」= 已击败的 BOSS 数。设计基准：第 100 层应当是一道「非常厉害」的门槛，
// 所以成长必须一直延伸到 100 层以上；同时每一项都用「单调上升 + 各自封顶/收敛」，
// 保证任意两层之间不会出现断崖式跳变，也不会无限膨胀到不可玩。
//   · 血量 / 防御 / 攻击频率 / 弹速 / 齐射弹数 / 生成密度 全部单调上升
//   · 玩家的成长（重复击破强化）始终略快于 BOSS 血量，战斗时长不会失控
// v12：敌军血量分层规则
//   · 第 1–5 层：沿用原本的「正常曲线」（每层 +5.5%）
//   · 第 6 层起：每一层在基础血量上再 +5%
//       层6 +5% → 层7 +10% → 层8 +15% → 层9 +20% → 层10 +25% → 层11 +30%
//   · 第 11 层之后：保留 +30% 的加成，基础部分继续沿正常曲线往上提升（不再封顶），
//     保证无尽模式下敌军血量始终随层数上升
function foeHpMul(n){
  n = Math.max(0, n|0);
  const layer = n + 1;                                    // 当前所在层（1 起）
  const base = 1 + n*0.055;                               // 正常曲线（去封顶 → 无尽层持续变强）
  const steps = layer >= 6 ? (layer - 5) : 0;             // v19：第 6 层起每层 +5%，一直向上累计（不封顶）
  return base * (1 + steps*0.05);                         // 层 11 = +30%，层 100 = +475%
}
// v19：第 6 层起每层 +5% 的「层加成」系数（血量与防御共用同一条曲线）
function foeLayerBoost(n){
  n = Math.max(0, n|0);
  const layer = n + 1;
  return layer >= 6 ? (1 + (layer - 5)*0.05) : 1;         // 层6 → 1.05 … 层11 → 1.30 … 层100 → 5.75
}
function layerScale(n){
  n = Math.max(0, n|0);
  return {
    // ---- BOSS ----
    // 血量：12 层以内温和上升（每层 +10%）；12 层之后改用与「玩家重复击破强化」
    // 完全相同的斜率（+0.09/层，v20 由 0.12 下调），于是 战斗时长 = 血量倍率 / 输出倍率
    // 从第 12 层起基本恒定 —— 第 100 层既不会变成秒杀，也不会拖成消耗战。
    //   第 1 层 ×1.10 · 第 12 层 ×2.20 · 第 30 层 ×5.76 · 第 100 层 ×19.6 · 第 150 层 ×29.5
    bossHp:  (n <= 12) ? (1 + n*0.10) : (1 + 12*0.10) * (1 + 0.09*(n-12)),
    // 防御：每层 +1%，封顶 ×1.40（40 层）—— 防御依旧只是点缀，不做主墙
    bossDef: 1 + Math.min(0.40, n*0.010),
    // 攻击 / 技能频率：27 层内每层 +6%，之后每层再 +1%，封顶 ×3.10
    bossAtk: 1 + Math.min(1.60, n*0.060) + Math.min(0.50, Math.max(0, n-27)*0.010),
    // ---- 杂兵 ----
    hp:      foeHpMul(n),                      // 杂兵血量：第 6 层起每层 +5%，第 11 层累计 +30%；第 12 层起再 +3%/层
    foeDef:  foeLayerBoost(n),                 // v19：杂兵装甲 —— 第 6 层起每层 +5%（与血量同曲线，无限累计）
    rate:    1 + Math.min(1.60, n*0.045),       // 射击频率 封顶 ×2.60（36 层）
    // 齐射弹数：保留原有 2/5/9 层的阶梯，之后每 22 层再加 1 发，封顶 6 发
    bullets: Math.min(6, 1 + (n>=2?1:0) + (n>=5?1:0) + (n>=9?1:0) + Math.min(2, Math.floor(n/22))),
    spawn:   Math.max(0.34, 1 - n*0.010),       // 生成密度 最低 ×0.34
    speed:   1 + Math.min(0.45, n*0.0045),      // 敌弹速度 封顶 ×1.45（100 层）
  };
}
// BOSS 弹幕数量随层数平滑增加：每 perLayer 层 +1 发，封顶 cap 发
function bossVolley(base, perLayer, cap){
  return base + Math.min(cap, Math.floor((G.bossKills||0)/perLayer));
}
let DIFF = { early:0, hp:1, rate:1, bullets:1, spawn:1, speed:1 };
function foeDifficulty(){
  const n = G.bossKills||0;
  const early = (n===0 && G.t < 20) ? 1 : 0;
  const L = layerScale(n);
  return {
    early,
    hp:      (early?0.58:1) * L.hp,
    rate:    (early?0.55:1) * L.rate,
    def:     L.foeDef,                        // v16：杂兵装甲倍率
    bullets: L.bullets,
    spawn:   (early?1.45:1) * L.spawn,
    speed:   (early?0.88:1) * L.speed,
  };
}
let foeTimer = 0, groundTimer = 0;

// 地面单位准入表：陆上绝不出现炮舰，海上绝不出现坦克 / 高炮，
// 导弹发射器两岸都能部署（海面那台会坐在浮台/驳船上）。
const GROUND_LAND = ['tank','aa','launcher','mlrs'];
const GROUND_SEA  = ['gunboat','launcher'];
function groundAllowed(kind, biome){
  return (biome==='sea' ? GROUND_SEA : GROUND_LAND).includes(kind);
}
function spawnGround(){
  // 用「当前可见地形」而不是 G.biomeIdx：过渡带还没走完时仍按旧群系出兵，
  // 这样绝不会在陆地上刷出炮舰，也不会在海面上刷出坦克。
  const biome = groundBiomeCur;
  const sea = biome==='sea';
  const mk = (kind,x,y,r,hp,shootT,score,dir)=>{
    if (!groundAllowed(kind, biome)) return;          // 最后一道闸：越界一律不生成
    const g = { kind, x, y, r, hp, shootT, ph:rand(0,TAU), score, sea, dir:dir||1 };
    g.hp *= DIFF.hp;
    grounds.push(g);
  };
  if (sea){
    // 巡逻炮艇编队，偶尔换成一具驳船式舰载导弹发射平台（绝无坦克 / 高炮）
    const cnt = Math.random()<0.28 ? 2 : 1;
    for (let n=0;n<cnt;n++){
      const kind = (cnt===1 && Math.random()<0.34) ? 'launcher' : 'gunboat';
      mk(kind, clamp(rand(46,W-46)+n*54-27, 34, W-34), -44-n*18,
         kind==='launcher'?16:17, kind==='launcher'?7:6, rand(1.6,2.4)/DIFF.rate, kind==='launcher'?250:240);
    }
    return;
  }
  const kind = choice(['tank','aa','aa','launcher']);
  const x = rand(40, W-40);
  // 初始防御整体上调：坦克 3→5、防空台 4→6、导弹发射台 5→8
  if (kind==='tank') mk('tank', x, -30, 13, 5, rand(1.6,2.6)/DIFF.rate, 150, choice([-1,1]));
  else if (kind==='aa') mk('aa', x, -26, 13, 6, rand(1.2,2)/DIFF.rate, 180);
  else mk('launcher', x, -30, 15, 8, rand(2.2,3.2)/DIFF.rate, 250);
}
// ---------- v17 精英杂兵：五管火箭战车 & B2 式大型轰炸机 ----------
// v19b：血量 = 该层轰炸机（基准 12）×10 = 120×DIFF.hp；防御沿用该层轰炸机的层装甲（defMul:1，不再额外 ×10）；
// 出现频率刻意压低：开局 34s 首次，之后每轮 38~56s，场上同时最多 1 个，BOSS 战不出。
let eliteTimer = 34;
function eliteOnField(){
  return foes.some(f=>f.kind==='b2') || grounds.some(g=>g.kind==='mlrs');
}
function spawnElite(){
  if (groundBiomeCur==='sea' || Math.random()<0.5){
    // B2 式大型轰炸机：飞翼潜入，缓慢直压（海面只出它，火箭战车不上水）
    // v19b：血量 = 该层轰炸机（基准 12）×10 = 120×DIFF.hp；防御 = 该层轰炸机防御（即层装甲，defMul:1）
    foes.push({ kind:'b2', x:rand(100,W-100), y:-72, r:36, hp:120*DIFF.hp, defMul:1, vy:rand(38,50),
      ph:rand(0,TAU), shootT:rand(1.2,1.8)/DIFF.rate, t1:rand(2.8,3.6), t2:rand(4.6,5.8), score:800 });
  } else {
    // v19b：血量 = 该层轰炸机（基准 12）×10 = 120×DIFF.hp；防御 = 该层轰炸机防御（即层装甲，defMul:1）
    grounds.push({ kind:'mlrs', x:rand(70,W-70), y:-52, r:30, hp:120*DIFF.hp, defMul:1,
      shootT:rand(2.2,3.0)/DIFF.rate, ph:rand(0,TAU), score:600, sea:false,
      dir:choice([-1,1]), salvo:0, salvoT:0 });
  }
}
function fireAimed(x, y, sp, big){
  // v14：敌方普通子弹不发声
  // 敌弹速度统一由 updateBullets 里的全局系数 DIFF.speed 施加，
  // 这样 BOSS 直接 push 的子弹和这里生成的子弹遵循同一条「速度」成长曲线。
  const a = Math.atan2(P.y-y, P.x-x);
  ebs.push({ x, y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, r: big?7:4, big:!!big });
  // 击破 BOSS 越多，杂兵齐射弹数越多
  for (let i=1;i<DIFF.bullets;i++){
    const d = (i%2?1:-1)*Math.ceil(i/2)*0.13, aa=a+d;
    ebs.push({ x, y, vx:Math.cos(aa)*sp*0.94, vy:Math.sin(aa)*sp*0.94, r:4 });
  }
}
// 防空台 / 导弹发射台的跟踪导弹齐射数：0-4→1、5-9→2、10-14→3、15-19→4、20-24→5，
// 之后每 25 层再加 1 发，封顶 7 发 —— 无尽模式下继续缓慢增长但不失控。
function groundMissileCount(){
  const n = G.bossKills||0;
  return 1 + Math.min(4, Math.floor(Math.min(n,20)/5)) + Math.min(2, Math.floor(Math.max(0,n-20)/25));
}
function fireMissileSalvo(x, y, n){
  playSfx('enemyMissile', 0.16);  // 敌方跟踪导弹齐射
  const a = Math.atan2(P.y-y, P.x-x);
  for (let i=0;i<n;i++){
    const aa = a + (i-(n-1)/2)*0.22;
    const dx = (i-(n-1)/2)*13;
    ebs.push({ x:x+dx, y:y-8, vx:Math.cos(aa)*120, vy:Math.sin(aa)*120,
               r:5, missile:true, life:4 });
  }
}
function fireSpread(x, y, n, sp, baseA){
  n += DIFF.bullets-1;
  for (let i=0;i<n;i++){
    const a = baseA + (n===1?0:(i/(n-1)-0.5)*0.7);
    ebs.push({ x, y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, r:4 });
  }
}
function maybeDrop(x, y, force){
  // v10：稀有强化爆率再降 5 倍（各 0.6% → 0.12%，合计 0.24%），
  // 仍排在 P(10%) / 生命(2.5%) 的尾部，不挤占常规掉落。
  if (force){   // v18：指定掉落优先（精英必掉 P/加血），不与常规概率混判
    pows.push({ kind:force, x, y, vy:(force==='P'||force==='life')?85:70, r:(force==='P'||force==='life')?11:13, ph:rand(0,TAU) });
    return;
  }
  const roll = Math.random();
  if (roll < 0.10)        pows.push({ kind:'P',    x, y, vy:85, r:11, ph:rand(0,TAU) });
  else if (roll < 0.125)  pows.push({ kind:'life', x, y, vy:85, r:11, ph:rand(0,TAU) });
  else if (roll < 0.1262) pows.push({ kind:'cd',   x, y, vy:70, r:13, ph:rand(0,TAU) });
  else if (roll < 0.1274) pows.push({ kind:'atk',  x, y, vy:70, r:13, ph:rand(0,TAU) });
}
function addText(x, y, str, color){ texts.push({ x, y, str, color: color||'#fff', life:1.1 }); }
function burst(x, y, n, colors){
  for (let i=0;i<n;i++) parts.push({ kind:'spark', x, y, vx:rand(-190,190), vy:rand(-190,190), life:rand(0.25,0.6), max:0.6, color: choice(colors), size:rand(1.5,3.6) });
}
function damageTarget(t, dmg){
  dmg *= (G.dmgMul||1) * (G.specPower||1);   // 全体伤害 = 火力等级区 × 稀有道具区
  if (t===G.boss){ hurtBoss(dmg); }
  else {
    dmg /= (DIFF.def || 1) * (t.defMul || 1);   // v19：层装甲 + 单位自带额外防御（精英 defMul:1 = 与轰炸机同级）
    t.hp -= dmg;
    t.flash = 0.08;
    if (t.hp <= 0 && !t.dead){ killTarget(t); }
  }
  // v10：命中反馈改成几处燃烧的小火苗；连续激光按目标单独节流，避免每帧堆叠
  if (G.t - (t.flameT===undefined ? -9 : t.flameT) > 0.055){
    t.flameT = G.t;
    const r = t.r || 10;
    hitFlames(t.x + rand(-r*0.4,r*0.4), t.y + rand(-r*0.3,r*0.3), irand(2,4), 5);
  }
}
function killTarget(t){
  t.dead = true; G.kills++; G.score += t.score||50;
  spawnWreck(t);
  burst(t.x, t.y, t.r>16?20:11, ['#ffd76a','#ff9a3c','#e8e8e8']);
  // v23 爆炸分层：小单位脆爆（节流防叠）/ 常规写实闷响 / 精英强爆 + 震屏
  if (t.kind==='b2'){ playSfx('eliteBoom', 0.12); G.shake = Math.max(G.shake, 5); }
  else if (t.kind==='mlrs'){ playSfx('bigBoom', 0.2); G.shake = Math.max(G.shake, 6); }   // 精英战车：爆炸声与 BOSS 同款（用户指定）
  else if (t.kind==='fighter' || t.kind==='drone' || t.kind==='heli') playSfx('explodeS', 0.07);
  else playSfx('boom', 0.08);
  if (t.kind==='b2' || t.kind==='mlrs'){
    // v17 精英必掉强化 P；v18：必掉加血，且各 20% 机会爆出两个特殊武器强化（冷却 / 威力）
    maybeDrop(t.x, t.y, 'P');
    maybeDrop(t.x-15, t.y, 'life');
    if (Math.random()<0.20) maybeDrop(t.x+15, t.y, 'cd');
    if (Math.random()<0.20) maybeDrop(t.x+27, t.y, 'atk');
  }
  else if (t.kind==='bomber' || t.kind==='launcher' || t.kind==='gunboat') maybeDrop(t.x, t.y, Math.random()<0.4?'P':null);
  else maybeDrop(t.x, t.y, null);
}

// ---------- player ----------
function hurtPlayer(){
  if (G.t < P.invUntil || P.dead) return;
  // 僚机护盾：一次伤害消耗两架僚机，不掉血、不降主炮
  if (P.droneCount >= 2){
    P.droneCount -= 2;
    P.invUntil = G.t + 1.15; P.droneGuard = G.t + 0.45;
    G.shake = Math.max(G.shake, 4);
    addText(P.x, P.y-44, '僚机 −2', '#9adcff');
    burst(P.x, P.y, 16, ['#9adcff','#e8f6ff','#ffd76a']);
    playSfx('guard');
    return;
  }
  P.hp--; P.invUntil = G.t + 1.5; G.shake = Math.max(G.shake, 8);   // v17b：受击无敌缩短为 1.5 秒
  // 受击代价：主炮掉一级（最低保留 Lv.1），高等级火力需要靠走位守住
  if (P.gun > 1){
    P.gun--;
    addText(P.x, P.y-34, 'Lv.⬇️', '#ff8a6a');
  }
  burst(P.x, P.y, 16, ['#ff6a5c','#ffd76a','#ffffff']);
  sfx.hurt();
  if (P.hp <= 0){
    P.dead = true; G.state = 'over'; G.overT = 0; sfx.bigBoom();
    burst(P.x, P.y, 46, ['#ff6a5c','#ffd76a','#ff9a3c','#ffffff']);
  }
}
// 苍隼：中央并排直射 + 成对侧翼斜弹，12 级逐级叠弹
function fireStandard(lv){
  const t = GUN_TIERS[clamp(lv,1,GUN_MAX)-1];
  const mk = (x,vx)=> bullets.push({ kind:'shot', x, y:P.y-14, vx, vy:-560, r:3.4, dmg:1, life:1.5 });
  const gap = 8.4;
  for (let i=0;i<t.n;i++) mk(P.x + (i-(t.n-1)/2)*gap, 0);
  for (let j=1;j<=t.wing;j++){
    const off = 13 + j*7, v = 70 + j*52;
    mk(P.x-off, -v); mk(P.x+off, v);
  }
}
// 赤鸢：双联机炮扇形扫射，弹道带左右摆动；高等级再加两枚蛇形脉冲
function fireFan(lv){
  const count = Math.min(10, 2 + Math.floor((lv-1)*0.73));
  const spread = 0.09 + lv*0.021;
  const sweep = Math.sin(G.t*4.6)*0.13;
  for (let i=0;i<count;i++){
    const u = count===1 ? 0 : (i/(count-1)-0.5)*2;
    const a = -Math.PI/2 + sweep + u*spread;
    const side = (i%2) ? 1 : -1;
    bullets.push({ kind:'plasma', x:P.x+side*8, y:P.y-11,
      vx:Math.cos(a)*520, vy:Math.sin(a)*520, r:3.2, dmg:1, life:1.4 });
  }
  if (lv>=7){
    for (const s of [-1,1]) bullets.push({ kind:'plasma', x:P.x+s*17, y:P.y-3,
      vx:s*120, vy:-430, r:3.8, dmg:1, life:1.3, wobble:true, ph:G.t*6+s });
  }
}
const WAVE_TIERS = [
  { c:1, w:1 }, { c:1, w:1 }, { c:2, w:1 }, { c:2, w:1 },
  { c:2, w:2 }, { c:3, w:2 }, { c:3, w:2 }, { c:3, w:2 },
  { c:3, w:3 }, { c:4, w:3 }, { c:4, w:3 }, { c:4, w:3 },
];
// 澜隼：双股蛇形波刃左右编织 + 中央直射针 —— 摆幅扫过整条横带，专治蛇形走位的敌群
function fireWave(lv){
  const t = WAVE_TIERS[clamp(lv,1,GUN_MAX)-1];
  for (let i=0;i<t.c;i++)
    bullets.push({ kind:'wave', x:P.x + (i-(t.c-1)/2)*7, y:P.y-15, vx:0, vy:-545, r:3.4, dmg:1, life:1.5 });
  for (const sd of [-1,1]) for (let k=0;k<t.w;k++)
    bullets.push({ kind:'wave', x:P.x+sd*13, y:P.y-8, vx:0, vy:-545, r:3.4, dmg:1, life:1.5, wobble:true, ph:(sd>0?0:Math.PI)+k*1.05 });
}
// 碎星：霰射 —— 一泵喷出整片弹丸，弹丸出膛 2 点伤害、随飞行距离衰减到 1 点；等级涨弹丸数、射程并略收散布
function fireScatter(lv){
  const n = 6 + lv;
  const spread = 0.88 - lv*0.013;
  for (let i=0;i<n;i++){
    const u = (i/(n-1)-0.5)*2;
    const a = -Math.PI/2 + u*spread/2 + rand(-0.028,0.028);
    const sp = rand(540, 700);
    bullets.push({ kind:'pellet', x:P.x+rand(-6,6), y:P.y-13, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, r:2.6, dmg:2, life:0.60+lv*0.01 });
  }
  for (let i=0;i<3;i++) parts.push({ kind:'spark', x:P.x+rand(-9,9), y:P.y-16, vx:rand(-26,26), vy:rand(-46,-14), life:0.16, max:0.16, color:'#ffd76a', size:rand(1.6,2.8) });
}
function playerFire(dt){
  P.fireCd -= dt;
  // 僚机连发（v37）：独立逐帧计时 —— 一轮内每架沿自身角度以 0.055s 间隔连射 droneBurst() 发，轮间停顿 0.38s
  if (P.droneCount > 0){
    if ((P.droneBurstLeft||0) > 0){
      P.droneBurstT -= dt;
      if (P.droneBurstT <= 0){
        P.droneBurstT = 0.055;
        P.droneBurstLeft--;
        // 碎星：全队锁定同一个目标（BOSS 优先，否则离主机最近的敌人）；澜隼：子弹自动锁定最近目标
        let lockT = null;
        if (G.ship===3){
          if (G.boss && G.boss.hp > 0) lockT = G.boss;
          else { let best = 1e12; for (const t of targetsList()){ const dd = dist2(P.x,P.y,t.x,t.y); if (dd < best){ best = dd; lockT = t; } } }
        }
        for (const d of dronePositions()){
          const shot = { kind:'droneShot', x:d.x, y:d.y, vx:Math.cos(d.a)*430, vy:Math.sin(d.a)*430, r:3, dmg:specDmg(1), life:1.35 };
          if (G.ship===2) shot.seek = true;
          else if (G.ship===3 && lockT){
            const a = Math.atan2(lockT.y - d.y, lockT.x - d.x);
            shot.vx = Math.cos(a)*430; shot.vy = Math.sin(a)*430;
            shot.seek = true; shot.lockT = lockT;
          }
          bullets.push(shot);
        }
        if (P.droneBurstLeft <= 0) P.droneFireT = 0.38;
      }
    } else {
      P.droneFireT -= dt;
      if (P.droneFireT <= 0){ P.droneBurstLeft = droneBurst(); P.droneBurstT = 0; }
    }
  } else P.droneBurstLeft = 0;
  const lv = clamp(P.gun,1,GUN_MAX);
  // 等级越高射速也略微加快；赤鸢单发威力不变但扇面更宽，故基础节奏略慢
  let rate;
  if (G.ship===3) rate = 0.315 - Math.min(0.075, (lv-1)*0.0068);        // 霰射：泵动节奏
  else if (G.ship===2) rate = 0.12 - Math.min(0.028, (lv-1)*0.0024);    // 波刃
  else rate = (G.ship===1 ? 0.128 : 0.115) - Math.min(0.028, (lv-1)*0.0024);
  if (P.fireCd > 0) return;
  P.fireCd = rate;
  // v14：普通子弹不发声（只保留技能 / 导弹 / 爆炸等特效音）
  if (G.ship===1) fireFan(lv); else if (G.ship===2) fireWave(lv); else if (G.ship===3) fireScatter(lv); else fireStandard(lv);
}
function updatePlayer(dt){
  if (P.dead) return;
  if ((G.stormLeft||0) > 0){
    G.stormT -= dt;
    if (G.stormT <= 0){ G.stormLeft--; G.stormT = G.stormInt || 0.2; stormStrike(); }
  }
  const sp = G.ship===2 ? 342 : 305;   // 澜隼：机动略快（用户指定）
  let mx = 0, my = 0;
  if (keys['ArrowLeft']||keys['KeyA']) mx -= 1;
  if (keys['ArrowRight']||keys['KeyD']) mx += 1;
  if (keys['ArrowUp']||keys['KeyW']) my -= 1;
  if (keys['ArrowDown']||keys['KeyS']) my += 1;
  let moveDx = 0;
  if (mx||my){ const l = Math.hypot(mx,my); P.x += mx/l*sp*dt; P.y += my/l*sp*dt; touchTarget = null; padDelta.x = 0; padDelta.y = 0; moveDx = mx/l; }
  else if (padDelta.x || padDelta.y){
    P.x += padDelta.x; P.y += padDelta.y; moveDx = clamp(padDelta.x * 0.04, -1, 1);   // 黑区触控板：手指相对位移直接驱动战机
    padDelta.x = 0; padDelta.y = 0;
  }
  else if (touchTarget){
    const dx = touchTarget.x - P.x, dy = (touchTarget.y-46) - P.y;
    const d = Math.hypot(dx,dy);
    if (d > 4){ const v = Math.min(d*9, 560); P.x += dx/d*v*dt; P.y += dy/d*v*dt; moveDx = dx/d; }
  }
  // v12：横移时机翼偏侧 —— 移动方向一侧的机翼下沉，机体随之轻微侧倾
  let bankTarget = 0;
  if (Math.abs(moveDx) > 0.06) bankTarget = moveDx > 0 ? 1 : -1;
  P.bank += (bankTarget - P.bank) * Math.min(1, dt*9);
  if (P.bank > 1) P.bank = 1; else if (P.bank < -1) P.bank = -1;
  if (Math.abs(P.bank) < 0.004) P.bank = 0;
  P.x = clamp(P.x, 20, W-20); P.y = clamp(P.y, 60, H-24);
  playerFire(dt);
  autoSpecials();
  // laser specials damage over time
  if (G.t < P.laserUntil){
    const wHalf = P.laserKind==='pulse' ? 34 : 11;
    const dps = specDmg(P.laserKind==='pulse' ? 82 : 66);   // 激光类伤害大幅提升 + 全技能攻击升级
    for (const t of targetsList()){
      if (Math.abs(t.x - P.x) < wHalf + t.r && t.y < P.y) damageTarget(t, dps*dt);
    }
  }
}

// ---------- entity updates ----------
function updateFoes(dt){
  const scroll = scrollSpeed();
  for (const f of foes){
    if (f.swarmJet){
      // 战斗集群（BOSS 侧）：保持三角编队压下，逐架发射跟踪导弹，不走普通战机逻辑
      f.x = f.ax + f.ox;
      f.y += f.vy*dt;
      f.fireT -= dt;
      if (f.fireT<=0 && f.missiles>0 && f.y>6 && f.y<H*0.7){
        ebs.push({ x:f.x, y:f.y+14, vx:0, vy:130, r:5, missile:true, life:4 });
        playSfx('enemyMissile', 0.3);
        f.missiles--; f.fireT = 1.5;
      }
      if (f.flash>0) f.flash -= dt;
      continue;
    }
    if (f.kind==='heli'){
      // 横向巡航：不能被 clamp 回屏幕内，否则永远进不了场；随地形缓慢下沉 + 轻微起伏
      if (!f.side) f.side = f.vx>0 ? 1 : -1;
      if (!f.vx) f.vx = f.side*128;
      f.x += f.vx*dt;
      f.y += ((f.vy||24) + scroll*0.22 + Math.sin(G.t*2.2+(f.ph||0))*11)*dt;
    } else if (f.kind==='drone' && f.mode==='diag'){
      // 斜侧方切入：不能被 clamp 拉回屏幕边缘；随地形下沉，并保留轻微蛇形起伏
      f.x += (f.vx||120)*dt;
      f.y += ((f.vy||150) + scroll*0.18)*dt + Math.sin(G.t*4 + (f.ph||0))*10*dt;
    } else {
      f.y += f.vy*dt;
      if (f.kind==='fighter'){ f.x += Math.sin(G.t*2.1 + f.ph)*46*dt; f.y -= scroll*0.25*dt; }
      if (f.kind==='drone') f.x += Math.sin(G.t*5 + f.ph)*150*dt;
      if (f.kind==='b2') f.x += Math.sin(G.t*0.9 + (f.ph||0))*40*dt;   // v17 精英：飞翼巡航蛇形
      f.x = clamp(f.x, 18, W-18);
    }
    f.shootT -= dt;
    const onScreen = f.kind!=='heli' || (f.x > 8 && f.x < W-8);
    if (f.shootT <= 0 && onScreen && f.y > 10 && f.y < H*0.72){
      if (f.kind==='fighter'){ fireAimed(f.x, f.y+10, 218); f.shootT = rand(1.7, 2.8)/DIFF.rate; }
      else if (f.kind==='heli'){ fireAimed(f.x, f.y+10, 232); f.shootT = rand(1.5, 2.4)/DIFF.rate; }
      else if (f.kind==='bomber'){ fireSpread(f.x, f.y+16, 3, 196, Math.PI/2); f.shootT = rand(2, 3)/DIFF.rate; }
      else if (f.kind==='b2'){
        // v17 精英：比轰炸机更密的宽扇形压制（弹数仍随 DIFF.bullets 成长）
        fireSpread(f.x, f.y+24, 5, 188, Math.PI/2);
        f.shootT = rand(2.4, 3.2)/DIFF.rate;
      }
      else if (f.kind==='drone'){
        // v16：无人机随层数逐渐学会开火 —— 第 3 层起解锁，层数越高射得越密（间隔封顶 ×2.2 缩短）
        if (G.bossKills >= 2){
          fireAimed(f.x, f.y+8, 210);
          f.shootT = rand(3.4, 4.8) / (DIFF.rate * (1 + Math.min(1.2, G.bossKills*0.06)));
        } else f.shootT = 9;
      }
      else f.shootT = 1/DIFF.rate;
    }
    // v17 精英 b2 的两个 BOSS 级计时招：双侧交叉弹幕（战列舰式）+ 重型炸弹（BOSS 式）
    if (f.kind==='b2' && f.y>10){
      f.t1 -= dt; f.t2 -= dt;
      if (f.t1<=0){

    }
    if (g.sea){                                      // 炮艇与导弹驳船都随浪摇摆、拖出水花

          const tube = (5 - g.salvo) - 2;                  // -2..2
          const ma = Math.atan2(P.y-g.y, P.x-g.x);
          const lx = tube*13, ly = 24;                     // 炮口在发射巢的局部坐标（+y 朝玩家）
          const mx = g.x + lx*Math.sin(ma) + ly*Math.cos(ma);
          const my = g.y - lx*Math.cos(ma) + ly*Math.sin(ma);
          const a = ma + tube*0.07;
          ebs.push({ x:mx, y:my, vx:Math.cos(a)*176, vy:Math.sin(a)*176, r:6, big:true });

          if (g.salvo===1 && Math.random()<0.30) fireMissileSalvo(g.x, g.y, 1);
        } else {
          fireMissileSalvo(g.x, g.y, 1);
        }
        g.salvo--; g.salvoT = 0.24;
      }
    }
    g.shootT -= dt;
    if (g.shootT <= 0 && g.y > 6 && g.y < H*0.8){
      if (g.kind==='tank'){ fireAimed(g.x, g.y-8, 208); g.shootT = rand(2, 3)/DIFF.rate; }
      else if (g.kind==='aa'){
        const n = groundMissileCount();
        fireAimed(g.x, g.y, 246);
        if (n>1) fireMissileSalvo(g.x, g.y, n-1);   // 额外跟踪导弹随进度渐增 0→4

      }
      else if (g.kind==='launcher'){

        g.salvo = groundMissileCount(); g.salvoT = 0.24;
        g.shootT = rand(2.6, 3.6)/DIFF.rate;
      }
      else if (g.kind==='mlrs'){
