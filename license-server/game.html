// 角度差归一化：一次性取模，替换原来可能因为 Infinity/NaN 卡死的 while 循环
function wrapAngle(d){ return !isFinite(d) ? 0 : ((d+Math.PI)%TAU+TAU)%TAU-Math.PI; }
function updateBullets(dt){
  for (const b of bullets){
    if (b.kind==='droneShot' && b.seek){
      // 僚机锁定弹：无指定目标时自动锁最近敌人（目标死亡自动换锁）；有 lockT 时只追该目标（死亡后直飞）
      let tgt = b.lockT || null;
      if (tgt && (tgt.dead || tgt.hp<=0)) tgt = null;
      if (!tgt && !b.lockT){
        let best = 1e12;
        for (const t of targetsList()){ const d = dist2(b.x,b.y,t.x,t.y); if (d<best){ best=d; tgt=t; } }
      }
      if (tgt){
        const a = Math.atan2(tgt.y-b.y, tgt.x-b.x), cur = Math.atan2(b.vy, b.vx);
        const na = cur + clamp(wrapAngle(a-cur), -3.4*dt, 3.4*dt);
        b.vx = Math.cos(na)*430; b.vy = Math.sin(na)*430;
      }
    }
    if (b.kind==='missile'){
      // 拦截优先：185px 内的来袭导弹先成为目标，之后才轮到敌机 / 地面单位 / BOSS
      let tgt = null, best = 1e12;
      for (const e of ebs){
        if (!e.missile || e.dead) continue;
        const d = dist2(b.x,b.y,e.x,e.y);
        if (d < 185*185 && d < best){ best=d; tgt=e; }
      }
      if (!tgt){
        best = 1e12;
        for (const t of targetsList()){ const d = dist2(b.x,b.y,t.x,t.y); if (d<best){ best=d; tgt=t; } }
      }
      if (tgt){
        const a = Math.atan2(tgt.y-b.y, tgt.x-b.x);
        const cur = Math.atan2(b.vy, b.vx);
        let da = wrapAngle(a - cur);
        const na = cur + clamp(da, -5.4*dt, 5.4*dt);
        const sp = Math.min(Math.hypot(b.vx,b.vy) + 620*dt, 430);
        b.vx = Math.cos(na)*sp; b.vy = Math.sin(na)*sp;
      }
      if (Math.random()<0.7) parts.push({ kind:'smoke', x:b.x, y:b.y+6, vx:rand(-8,8), vy:rand(10,30), life:0.3, max:0.3, size:rand(2,4) });
    }
    if (b.kind==='bomb'){ b.vy += 260*dt; }
    if (b.wobble) b.vx = Math.cos(G.t*7 + b.ph)*165;   // 赤鸢高等级的蛇形脉冲
    if (b.kind==='pellet') b.dmg = 2 - Math.min(1, (b.age||0) / (b.life||1));   // 霰射弹丸：伤害随射程衰减 2 → 1
    b.x += b.vx*dt; b.y += b.vy*dt; b.life -= dt;
    if (b.kind==='bomb' && b.life<=0){ explode(b.x, b.y, b.boomR||54, b.dmg); b.life = -1; }
  }
  bullets = bullets.filter(b=> b.life>0 && b.y>-70 && b.y<H+40 && b.x>-40 && b.x<W+40);
  for (const e of ebs){
    if (e.missile){
      e.life -= dt;
      const a = Math.atan2(P.y-e.y, P.x-e.x);
      const cur = Math.atan2(e.vy, e.vx);
      let da = wrapAngle(a - cur);
      const na = cur + clamp(da, -1.5*dt, 1.5*dt);
      const msp = 168*(DIFF.speed||1);
      e.vx = Math.cos(na)*msp; e.vy = Math.sin(na)*msp;
      // 尾烟只做淡淡一层暖灰，避免烟团把弹体糊住（drawFx 在弹体之后绘制）
      if (Math.random()<0.26) parts.push({ kind:'smoke', x:e.x, y:e.y, vx:0, vy:0,
        life:0.24, max:0.24, size:rand(1.4,2.3), a:0.16, color:'#8a6a58' });
      // 制导弹的速度里已含全局系数，移动时不再重复乘
      e.x += e.vx*dt; e.y += e.vy*dt;
      continue;
    }
    // 全局敌弹速度系数：随层数平滑上升（弹速这条成长轴的唯一来源）
    const espd = DIFF.speed || 1;
    e.x += e.vx*dt*espd; e.y += e.vy*dt*espd;
  }
  ebs = ebs.filter(e=> (e.life===undefined || e.life>0) && e.x>-30 && e.x<W+30 && e.y>-30 && e.y<H+30);
}
function updateFx(dt){
  for (const p of parts){
    p.life -= dt;
    if (p.kind==='spark'){ p.x += p.vx*dt; p.y += p.vy*dt; p.vx *= 0.96; p.vy *= 0.96; }
    if (p.kind==='flame'){ p.x += (p.vx + Math.sin(G.t*11+p.ph)*10)*dt; p.y += p.vy*dt; p.vy *= 0.97; }
    if (p.kind==='ring') p.r += p.vr*dt;
    if (p.kind==='smoke'){ p.x += p.vx*dt; p.y += p.vy*dt; }
    if (p.kind==='ash'){ p.x += p.vx*dt + Math.sin(G.t*2.4+p.ph)*7*dt; p.y += p.vy*dt; p.vy += 11*dt; }
    if (p.kind==='debris'){ p.x += p.vx*dt; p.y += p.vy*dt; p.vy += 150*dt; p.vx *= 0.985; p.rot += p.rotV*dt; }
  }
  parts = parts.filter(p=> p.life>0);
  updateWrecks(dt);                                  // 残骸 / 遗留物随地形一起滚动
  if (parts.length>340) parts.splice(0, parts.length-340);
  for (const t of texts){ t.y -= 34*dt; t.life -= dt; }
  texts = texts.filter(t=> t.life>0);
  for (const b of beams) b.life -= dt;
  beams = beams.filter(b=> b.life>0);
  for (const pw of pows){ pw.y += pw.vy*dt; pw.ph += dt*4; }
  pows = pows.filter(pw=> pw.y < H+24);
  // 长局保险丝：任何异常路径下都不允许实体数组无限增长
  if (bullets.length>420) bullets.splice(0, bullets.length-420);
  if (ebs.length>260)     ebs.splice(0, ebs.length-260);
  if (texts.length>24)    texts.splice(0, texts.length-24);
  if (beams.length>24)    beams.splice(0, beams.length-24);
  if (pows.length>24)     pows.splice(0, pows.length-24);
}
function collisions(){
  // 我方导弹拦截敌方导弹：双方同归于尽，给一小团品红 + 橙色爆燃
  for (const b of bullets){
    if (b.life<=0 || b.kind!=='missile') continue;
    for (const e of ebs){
      if (!e.missile || e.dead) continue;
      const rr = b.r + e.r + 4;
      if (dist2(b.x,b.y,e.x,e.y) < rr*rr){
        e.dead = true; b.life = 0;
        G.score += 20;
        parts.push({ kind:'ring', x:b.x, y:b.y, r:4, vr:155, life:0.22, max:0.22, color:'#ff4fd8' });
        for (let i=0;i<8;i++) parts.push({ kind:'spark', x:b.x, y:b.y,
          vx:rand(-130,130), vy:rand(-130,130), life:rand(0.2,0.4), max:0.4,
          color: choice(['#ff4fd8','#ff9a3c','#fff1d0']), size:rand(1.4,2.6) });
        break;
      }
    }
  }
  ebs = ebs.filter(e=> !e.dead);
  // player bullets vs targets
  for (const b of bullets){
    if (b.life<=0) continue;
    for (const t of targetsList()){
      if (t.dead) continue;
      const rr = b.r + t.r;
      if (dist2(b.x,b.y,t.x,t.y) < rr*rr){
        if (b.kind==='bomb'){ explode(b.x, b.y, b.boomR||54, b.dmg); b.life = 0; }
        else if (b.kind==='missile'){ explode(b.x, b.y, 30, b.dmg); b.life = 0; }
        else {
          if (b.kind==='spike'){
            if (!b.hitSet) b.hitSet = new Set();
            if (b.hitSet.has(t)) continue;   // v41：穿甲刺完全贯穿 —— 同一目标只结算一次
            b.hitSet.add(t);
          }
          damageTarget(t, b.dmg);       // 命中火苗统一由 damageTarget 生成
          if (!b.pierce) b.life = 0;
        }
        break;
      }
    }
  }
  // enemy bullets vs 战斗集群编队机（每架 3 点耐久，击坠有爆炸反馈）
  for (const e of ebs){
    if (e.x < -100) continue;
    for (const a of allies){
      if (a.dead) continue;
      const rr = e.r + a.r;
      if (dist2(e.x,e.y,a.x,a.y) < rr*rr){
        e.x = -999; a.hp--; a.flash = 0.09;
        burst(a.x, a.y, 6, ['#ffd76a','#ff9a3c']);
        if (a.hp<=0){
          a.dead = true;
          burst(a.x, a.y, 16, ['#ffd76a','#ff9a3c','#e8e8e8']);
          playSfx('explodeS', 0.1);
        }
        break;
      }
    }
  }
  // enemy bullets vs player
  for (const e of ebs){
    if (hitsPlayer(e.x, e.y, e.r, 3)){
      e.x = -999; hurtPlayer();
    }
  }
  ebs = ebs.filter(e=> e.x > -100);
  // body collisions
  for (const t of foes.concat(grounds)){
    if (!t.dead && hitsPlayer(t.x, t.y, t.r, 2)){
      damageTarget(t, 99); hurtPlayer();
    }
  }
  if (G.boss && G.boss.state==='fight'){
    const b = G.boss;
    if (hitsPlayer(b.x, b.y, b.r*0.8, 0)) hurtPlayer();
  }
  // powerups
  for (const pw of pows){
    if (dist2(pw.x,pw.y,P.x,P.y) < (pw.r + P.r + 6)*(pw.r + P.r + 6)){
      pw.y = H + 99; sfx.pow();
      if (pw.kind==='P'){
        if (P.gun < GUN_MAX){ P.gun++; addText(P.x, P.y-30, 'Lv.⬆️', '#ffd76a'); }
        else { G.score += 500; addText(P.x, P.y-30, '+500', '#ffd76a'); }
      } else if (pw.kind==='life'){
        if (P.hp < P.maxhp){ P.hp++; addText(P.x, P.y-30, '❤️+1', '#7dff8a'); }
        else { G.score += 800; addText(P.x, P.y-30, '+800', '#7dff8a'); }
      } else if (pw.kind==='cd'){
        const oldCd = G.specCd||1;
        G.specCd = Math.max(0.50, oldCd*0.94);   // v35：冷却升级统一 −6%
        const ratio = G.specCd/oldCd;
        for (const sid of P.specials){
          const left = (P.cds[sid]||0) - G.t;
          if (left > 0) P.cds[sid] = G.t + left*ratio;
        }
        P.specCdLv = (P.specCdLv||0)+1;
        G.score += 600;
        addText(P.x, P.y-30, '冷却⬇️', '#7ad9ff');
        burst(P.x, P.y, 18, ['#7ad9ff','#ffffff','#9adcff']);
      } else if (pw.kind==='atk'){
        G.specPower = Math.min(3.0, (G.specPower||1)+0.12);   // v35：全体伤害 +12%/个，封顶 ×3.0
        P.specAtkLv = (P.specAtkLv||0)+1;
        G.score += 600;
        addText(P.x, P.y-30, '伤害⬆️', '#ff9a4c');
        burst(P.x, P.y, 18, ['#ff9a4c','#ffd76a','#ffffff']);
      }
    }
  }
  pows = pows.filter(pw=> pw.y < H+24);
}

// v12：受击面 —— 随「机翼偏侧」收窄
// 横向半径随倾斜量压缩（最多压到 66%），纵向半径不变；
// 于是向左横移时子弹可以从左侧机翼旁边擦过去。
function playerHitRadii(extra, shrink){
  const b = Math.abs(P.bank||0);
  const e = (extra||0) - (shrink||0);
  return { rx: Math.max(2, P.r*(1 - 0.34*b) + e), ry: Math.max(2, P.r + e) };
}
function hitsPlayer(x, y, extra, shrink){
  const R = playerHitRadii(extra, shrink);
  const dx = (x - P.x)/R.rx, dy = (y - P.y)/R.ry;
  return dx*dx + dy*dy <= 1;
}

function pickBossIdx(){
  if (BOSSES.length < 2) return 0;
  // 抽取本身保持均匀随机（26 台没遇到某一台的概率约 8%，属于运气）。
  // 但连续 8 台 BOSS 都没带来新技能时给一次温和保底：从「尚未移植过技能」的 BOSS 里抽，
  // 避免收集型技能被纯随机的长尾拖到几十台之后。全部技能已收集时自动退化为普通随机。
  const unowned = [];
  for (let j=0;j<BOSSES.length;j++)
    if (!P.specials.includes(BOSSES[j].equip) && j!==G.lastBossIdx) unowned.push(j);
  if ((G.bossDry||0) >= 8 && unowned.length) return unowned[irand(0, unowned.length-1)];

  for (let k=0; k<10 && i===G.lastBossIdx; k++) i = irand(0, BOSSES.length-1);
  return i;
}

  const defMul = L.bossDef;
  G.boss = {
    defIdx: idx, def, x: W/2, y: -120, r: def.r, hp: Math.round(def.hp*hpMul), maxhp: Math.round(def.hp*hpMul),
    defMul, atkR: L.bossAtk, state:'enter', enterT:0, t:0, moveT:0, t1:1.2, t2:2.5, t3:4, sigT:3.2,
    mode:'up', modeT:5, ang: Math.PI/2, flash:0,
    beamTele:null, beamOn:null, dieT:0, spawnN:0,
  };
  G.state = 'boss';
  G.shake = Math.max(G.shake, 5);
}
function hurtBoss(dmg){
  const b = G.boss; if (!b || b.state==='dying') return;
  dmg /= (b.defMul||1);            // BOSS 装甲只小幅成长
  if (b.defIdx===4 && b.mode==='down') dmg *= 0.35;
  b.hp -= dmg; b.flash = 0.06;
  if (b.hp <= 0){ b.state = 'dying'; b.dieT = 0; sfx.bigBoom(); G.shake = 14; }
}
function bossBeamDamage(x, w){
  if (Math.abs(P.x - x) < w/2 + P.r - 4 && P.y > G.boss.y) hurtPlayer();
}
function bossFinish(){
  const b = G.boss;
  G.score += 3000 + G.bossKills*300;
  G.bossKills++;
  const eq = b.def.equip;
  P.specLvl[eq] = (P.specLvl[eq]||0) + 1;   // v23：技能等级（战斗集群的导弹数/威力据此成长）
  // v20：无人机航母（蜂巢航母）是僚机编制的唯一来源 ——
  //   击破 1 次 → 2 架 · 2 次 → 4 架 · 3 次 → 6 架 · 4 次 → 8 架（满编）
  //   满编后继续击破 → 僚机连发数随技能等级成长（droneBurst：每 3 级 +1 发，封顶 5）
  // 冷却结束不再「升级」，只把僚机回补到编制上限，绝不会越过上限继续涨。
  let droneMsg = '';
  if (eq === 'drones'){
    const burstUp = ((P.specLvl.drones||0) % 3 === 0);   // 本次击破正好跨过 3 的倍数 → 连发 +1
    if (P.droneCap < DRONE_MAX){
      P.droneCap = Math.min(DRONE_MAX, P.droneCap + 2);
      P.droneCount = P.droneCap;                 // 新编制立即到位
      droneMsg = ' · 僚机 +2' + (burstUp ? ' · 连发⬆️' : '');
    } else {
      droneMsg = burstUp ? ' · 连发⬆️' : '';
    }
  }
  const lvlNow = P.specLvl[eq] || 1;
  if (!P.specials.includes(eq)){
    P.specials.push(eq); P.cur = P.specials.length - 1;
    G.bossDry = 0;
    G.bannerText = '科技复制【' + SPECIALS[eq].name + '】' + droneMsg;
    G.bannerSub = 'Lv.1 · ' + SPECIALS[eq].desc;   // v47：横幅副行写技能状态
  } else {
    G.bossDry = (G.bossDry||0) + 1;
    if (eq==='devour'){
      // v35：深渊咆哮专属成长 —— 重复击破噬星不缩冷却、不加全体火力，改为技能范围 +3%/次（封顶 +60%）；稀有道具加成照常生效
      G.bannerText = '【' + SPECIALS[eq].name + '】⬆️' + droneMsg;
      G.bannerSub = 'Lv.' + lvlNow + ' · 技能范围 +' + Math.min(60, (lvlNow-1)*3) + '%';
    } else {
      // v35：冷却缩短统一 −6%/次（系数 0.94，下限 ×0.4）；全体火力斜率 0.09 → 0.06（+6%/级，封顶 ×100 不变）
      P.cdMul[eq] = Math.max(0.4, (P.cdMul[eq]||1) * 0.94);
      G.powerLvl++;
      G.dmgMul = Math.min(100, 1 + G.powerLvl*0.06);
      G.visMul = 1 + Math.min(0.8, G.powerLvl * 0.045);
      G.bannerText = '【' + SPECIALS[eq].name + '】⬆️' + droneMsg;
      let extra = '';
      if (eq==='swarm') extra = lvlNow <= 4 ? ' · 导弹 ' + lvlNow + ' 发/机' : ' · 导弹伤害 +30%';
      else if (eq==='cluster') extra = ' · 爆炸半径 +' + Math.min(50, (lvlNow-1)*5) + '%';
      else if (eq==='rail') extra = ' · 磁轨 ' + Math.min(3, 1 + Math.floor(lvlNow/5)) + ' 条';
      else if (eq==='storm') extra = ' · 落雷 ' + Math.min(15, 2 + lvlNow) + ' 道';
      G.bannerSub = 'Lv.' + lvlNow + ' · 冷却 −6% · 全体火力 +6%' + extra;
    }
  }
  G.bannerT = 3.6;
  if (P.hp < P.maxhp) P.hp++;
  pows.push({ kind:'P', x:b.x, y:b.y+10, vy:85, r:11, ph:0 });
  G.boss = null; G.state = 'play'; G.scrollTime = 0;
  ebs = [];
}
function updateBoss(dt){
  const b = G.boss; if (!b) return;
  b.t += dt; if (b.flash>0) b.flash -= dt;
  if (b.state==='enter'){
    // 固定时长三次缓出的入场，避免指数逼近造成「快到却迟迟不开打」的假卡顿
    b.enterT += dt;
    const p = clamp(b.enterT/1.7, 0, 1), e = 1-Math.pow(1-p,3);
    b.y = -120 + (b.def.y+120)*e;
    if (p>=1){ b.y=b.def.y; b.state='fight'; b.sigT=2.4; }
    return;
  }
  if (b.state==='dying'){
    b.dieT += dt;
    if (Math.random() < 0.5) burst(b.x + rand(-b.r, b.r)*0.8, b.y + rand(-b.r, b.r)*0.6, 8, ['#ffd76a','#ff9a3c','#e8e8e8']);
    if (b.dieT > 1.6) bossFinish();
    return;
  }
  const px = P.x;
  // 独立的移动时钟：入场时 b.t 已经累加到 1.7，若直接拿它算 sin 相位，
  // 开打第一帧 sin 恒为正，BOSS 会突然向右跳一下。moveT 只在 fight 阶段计时。
  b.moveT = (b.moveT||0) + dt;
  b.ang = Math.atan2(P.y - b.y, P.x - b.x);
  // 攻击/技能频率随层数显著提升（在 BOSS 出场时算定并存在 b.atkR 上）
  const atkR = b.atkR || 1;
  // beam telegraph / fire shared（预警时间也随等级缩短）
  if (b.beamTele){
    if (!b.beamTele.snd){ b.beamTele.snd = 1; playSfx('bossBeam'); }   // v40：激光预告（红框）统一充能警示音
    b.beamTele.t -= dt*Math.min(2.0, atkR);
    if (b.beamTele.follow) b.beamTele.x = b.x;
    if (b.beamTele.t <= 0){
      b.beamOn = { x:b.beamTele.x, t:0.55, w:b.beamTele.w||30 };
      b.beamTele = null; playSfx('bossBeamFire');
    }
  }
  if (b.beamOn){
    b.beamOn.t -= dt; bossBeamDamage(b.beamOn.x, b.beamOn.w||30);
    if (b.beamOn.t <= 0) b.beamOn = null;
  }
  b.t1 -= dt*atkR; b.t2 -= dt*atkR; b.t3 -= dt*atkR; b.sigT -= dt*atkR;
  switch (b.defIdx){
    case 0: // giant cannon
      if (b.t1<=0){
        // v16：巨炮随层数进化 —— 弹速最高 +90%（第 20 层满），装填在 atkR 之外再提速最高 35%
        const hv = 248 * (1 + Math.min(0.90, G.bossKills*0.045));
        ebs.push({ x:b.x+Math.cos(b.ang)*54, y:b.y+Math.sin(b.ang)*54, vx:Math.cos(b.ang)*hv, vy:Math.sin(b.ang)*hv, r:8, big:true });
        playSfx('bossCannon'); b.t1 = 2.6 / (1 + Math.min(0.35, G.bossKills*0.012));
      }
      if (b.t2<=0){ fireSpread(b.x, b.y+30, 5, 205, Math.PI/2 + (px>b.x?0.16:-0.16)); b.t2 = 4.2; }
      break;
    case 1: // battleship
      b.x = W/2 + Math.sin(b.moveT*0.35)*58;
      if (b.t1<=0){ fireSpread(b.x-52, b.y+22, 3, 230, Math.PI/2); fireSpread(b.x+52, b.y+22, 3, 230, Math.PI/2); b.t1 = 2.3; }
      if (b.t2<=0){ fireSpread(b.x, b.y+30, 7 + (G.bossKills>=5?2:0), 196, Math.PI/2); b.t2 = 4.6; }
      break;
    case 2: // fortress
      if (b.t1<=0){ const offs=[-58,0,58]; fireAimed(b.x+offs[b.spawnN%3], b.y+16, 238); b.spawnN++; b.t1 = 0.85; }
      if (b.t2<=0){ for (let i=-1;i<=1;i++) ebs.push({ x:b.x+i*40, y:b.y+26, vx:(px-b.x)*0.55 + i*36, vy:150, r:7, big:true }); b.t2 = 4.8; }
      break;
    case 3: // carrier
      b.x = W/2 + Math.sin(b.moveT*0.28)*44;
      if (b.t1<=0){
        // v16：航母蜂群随层数扩大 —— 每波 1 架 → 每两层 +1 架，封顶 6 架；机群继承层级血量（DIFF.hp）
        const cn = 1 + Math.min(5, Math.floor(G.bossKills/2));
        for (let i=0;i<cn && foes.length<10;i++){
          const f = { kind: Math.random()<0.5?'fighter':'drone', x:b.x+rand(-60,60), y:b.y+34, r:12, hp:2, vy:rand(150,210), ph:rand(0,TAU), shootT:rand(1.4,2.4), score:100 };
          if (f.kind==='drone'){ f.hp=1; f.r=10; }
          f.hp *= DIFF.hp;
          foes.push(f);
        }
        b.t1 = 3.4;
      }
      if (b.t2<=0){ fireAimed(b.x-70, b.y+10, 226); fireAimed(b.x+70, b.y+10, 226); b.t2 = 2.9; }
      break;
    case 4: // submarine
      b.modeT -= dt;
      if (b.mode==='up'){
        b.x += Math.sin(b.moveT*0.7)*36*dt;
        if (b.t1<=0){ const a = Math.atan2(P.y-b.y, P.x-b.x); ebs.push({ x:b.x, y:b.y-16, vx:Math.cos(a)*130, vy:Math.sin(a)*130, r:5, missile:true, life:4.5 }); b.t1 = 2.1; }
        if (b.t2<=0){ fireAimed(b.x, b.y+8, 224); b.t2 = 2.6; }
        if (b.modeT<=0){ b.mode='down'; b.modeT = 4; }
      } else {
        b.x += Math.sin(b.moveT*1.6)*90*dt;
        if (b.modeT<=0){ b.mode='up'; b.modeT = 6; b.t1 = 0.8; }
      }
      b.x = clamp(b.x, 70, W-70);
      break;
    case 5: // drone war-vehicle
      b.x = W/2 + Math.sin(b.moveT*0.5)*105;
      if (b.t1<=0){ for (let i=0;i<4 && foes.length<10;i++) foes.push({ kind:'drone', x:b.x+(i-1.5)*22, y:b.y+30, r:10, hp:1*DIFF.hp, vy:rand(210,260), ph:rand(0,TAU), shootT:9, score:80 }); b.t1 = 5; }
      if (b.t2<=0){ if (!b.beamTele && !b.beamOn) b.beamTele = { x:px, t:0.75 }; b.t2 = 5.6; }
      if (b.t3<=0){ fireAimed(b.x, b.y+16, 232); b.t3 = 2.4; }
      break;
    case 6: // iron giant
      {
        const tx = W/2 + Math.sin(b.moveT*0.55)*140, ty = b.def.y + Math.sin(b.moveT*1.3)*26;
        b.x += (tx-b.x)*Math.min(1, dt*1.8); b.y += (ty-b.y)*Math.min(1, dt*1.8);
        if (b.t1<=0){ for (let i=0;i<3;i++) setTimeout(()=>{ if (G.boss===b && b.state==='fight') fireAimed(b.x, b.y+6, 258); }, i*130); b.t1 = 2.1; }
        if (b.t2<=0){ if (!b.beamTele && !b.beamOn) b.beamTele = { x:b.x, t:0.8, follow:true }; b.t2 = 7; }
        if (b.beamTele && b.beamTele.follow) b.beamTele.x = b.x;
      }
      break;
    case 7: // bomber
      b.x = W/2 + Math.sin(b.moveT*0.22)*150;
      if (b.t1<=0){ for (let i=-1;i<=1;i++) ebs.push({ x:b.x+i*30, y:b.y+30, vx:i*16, vy:158, r:6, bomb:true }); playSfx('bossBomb'); b.t1 = 2.9; }
      if (b.t2<=0){ fireAimed(b.x, b.y+6, 230); b.t2 = 2.4; }
      break;
    case 8: // railgun fortress
      if (b.t1<=0){ if (!b.beamTele && !b.beamOn) b.beamTele = { x:px, t:1.0 }; b.t1 = 6; }
      if (b.t2<=0){ fireAimed(b.x-62, b.y+14, 240); fireAimed(b.x+62, b.y+14, 240); b.t2 = 2.3; }
      if (b.t3<=0){ const bn = bossVolley(12, 5, 8); for (let i=0;i<bn;i++){ const a = Math.PI*(0.08 + 0.84*i/(bn-1)); ebs.push({ x:b.x, y:b.y+24, vx:Math.cos(a)*186, vy:Math.sin(a)*186, r:4 }); } playSfx('rail'); b.t3 = 5.2; }
      break;
    case 9: // sky fortress
      b.x = W/2 + Math.sin(b.moveT*0.3)*66;
      if (b.t1<=0){ const bn = bossVolley(14, 8, 6), bs = 168; for (let i=0;i<bn;i++){ const a = TAU*i/bn + b.moveT; ebs.push({ x:b.x, y:b.y+8, vx:Math.cos(a)*bs, vy:Math.sin(a)*bs, r:4 }); } playSfx('storm'); b.t1 = 4.6; }
      if (b.t2<=0){ fireSpread(b.x-40, b.y+26, 3, 238, Math.PI/2); fireSpread(b.x+40, b.y+26, 3, 238, Math.PI/2); b.t2 = 2.2; }
      if (b.t3<=0){ if (foes.length<3) foes.push({ kind:'fighter', x:b.x+rand(-50,50), y:b.y+40, r:13, hp:2*DIFF.hp, vy:170, ph:rand(0,TAU), shootT:2, score:100 }); b.t3 = 5; }
      break;
    case 10: // 沙蝎要塞·钳狱：双钳横扫 + 沙潜无人机
      b.x = W/2 + Math.sin(b.moveT*0.42)*92;
      if (b.t1<=0){ fireAimed(b.x-52,b.y+18,236); fireAimed(b.x+52,b.y+18,236); b.t1 = 2.2; }
      if (b.t2<=0){ for(let i=-1;i<=1;i+=2) if(foes.length<7) foes.push({kind:'drone',x:b.x+i*54,y:b.y+30,r:10,hp:1*DIFF.hp,vy:rand(200,250),ph:rand(0,TAU),shootT:9,score:80}); b.t2 = 5.2; }
      if (b.t3<=0){ fireSpread(b.x,b.y+26,3,205,Math.PI/2); b.t3 = 3.4; }
      break;
    case 11: // 深渊巨兽·噬星：触须放射 + 孢子群
      b.x = W/2 + Math.sin(b.moveT*0.26)*74;
      b.y = b.def.y + Math.sin(b.moveT*0.9)*9;
      if (b.t1<=0){ const bn = bossVolley(9, 6, 6); for(let i=0;i<bn;i++){ const a=Math.PI*(0.12+0.76*i/(bn-1)); bossShot(b.x,b.y+18,a,190,5); } b.t1 = 3.1; }
      if (b.t2<=0){ for(let i=0;i<3;i++) if(foes.length<7) foes.push({kind:'drone',x:b.x+(i-1)*40,y:b.y+34,r:10,hp:1*DIFF.hp,vy:rand(180,230),ph:rand(0,TAU),shootT:9,score:80}); b.t2 = 5.6; }
      if (b.t3<=0){ fireAimed(b.x,b.y+20,224); b.t3 = 2.6; }
      break;
  }
  // 招牌技：与移植技能共用同一条 SPECIALS 记录，保证一一对应
  if (b.sigT <= 0){
    const sp = SPECIALS[b.def.equip];
    if (sp && sp.boss) sp.boss(b);
    b.sigT = Math.max(3.4, sp.cd*0.92);
  }
}

// ---------- drawing: units ----------
// 苍隼：保留原本三角翼 + 尖鼻剪影，补上金属蒙皮渐变、前缘高光、
// 双垂尾、座舱框架、进气道、双尾喷口与机徽，让它更像一架真实战机。
function drawJet(x, y, s, body, wing, flip, bank){
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s*(flip?-1:1));
  const poly = p => { ctx.beginPath(); ctx.moveTo(p[0][0],p[0][1]);
    for(let i=1;i<p.length;i++) ctx.lineTo(p[i][0],p[i][1]); ctx.closePath(); };
  // v12：机翼偏侧 —— 移动方向一侧的机翼下沉（模型坐标），对侧上抬
  const dip = 3.6*clamp(bank||0, -1, 1);
  const sideDy = px => px < 0 ? -dip : px > 0 ? dip : 0;
  // 机身厚度投影
  ctx.fillStyle='rgba(4,10,20,0.26)';
  poly([[2,-20],[6,-6],[7,12],[2,17],[-3,12],[-2,-6]]); ctx.fill();
  // 主翼
  const WG=[[0,-6],[-19,8],[-19,14],[-7,12],[0,17],[7,12],[19,14],[19,8]]
            .map(p => [p[0], p[1] + sideDy(p[0])]);
  ctx.fillStyle=wing; poly(WG); ctx.fill();
  ctx.save(); poly(WG); ctx.clip();
  const wg=ctx.createLinearGradient(-19,0,19,16);
  wg.addColorStop(0,'rgba(255,255,255,0.30)');
  wg.addColorStop(0.48,'rgba(255,255,255,0.02)');
  wg.addColorStop(1,'rgba(8,18,32,0.34)');
  ctx.fillStyle=wg; ctx.fillRect(-20,-8,40,28); ctx.restore();
  ctx.strokeStyle='rgba(10,20,34,0.62)'; ctx.lineWidth=0.8; poly(WG); ctx.stroke();
  ctx.strokeStyle='rgba(238,249,255,0.55)'; ctx.lineWidth=0.9;
  ctx.beginPath(); ctx.moveTo(0,-5.4); ctx.lineTo(-18.4,8.4+sideDy(-18.4));
  ctx.moveTo(0,-5.4); ctx.lineTo(18.4,8.4+sideDy(18.4)); ctx.stroke();
  ctx.strokeStyle='rgba(16,28,44,0.40)'; ctx.lineWidth=0.7;
  ctx.beginPath(); ctx.moveTo(-11,7+sideDy(-11)); ctx.lineTo(-15,12+sideDy(-15));
  ctx.moveTo(11,7+sideDy(11)); ctx.lineTo(15,12+sideDy(15)); ctx.stroke();
  // 双垂尾
  for(const sx of [-1,1]){
    const dyv = sx<0 ? -dip : dip;
    ctx.fillStyle=wing;
    poly([[sx*4,5+dyv],[sx*10,3+dyv],[sx*10,15+dyv],[sx*4,13+dyv]]); ctx.fill();
    ctx.strokeStyle='rgba(232,244,255,0.42)'; ctx.lineWidth=0.6; ctx.stroke();
  }
  // 机身：金属渐变 + 脊线
  const FG=[[0,-21],[4.5,-7],[5.5,10],[3,15],[-3,15],[-5.5,10],[-4.5,-7]];
  ctx.fillStyle=body; poly(FG); ctx.fill();
  ctx.save(); poly(FG); ctx.clip();
  const fg=ctx.createLinearGradient(-6,0,6,0);
  fg.addColorStop(0,'rgba(255,255,255,0.40)');
  fg.addColorStop(0.42,'rgba(255,255,255,0.02)');
  fg.addColorStop(1,'rgba(10,24,40,0.38)');
  ctx.fillStyle=fg; ctx.fillRect(-7,-22,14,40); ctx.restore();
  ctx.strokeStyle='rgba(16,30,48,0.68)'; ctx.lineWidth=0.8; poly(FG); ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,0.38)'; ctx.lineWidth=0.6;
  ctx.beginPath(); ctx.moveTo(0,-17); ctx.lineTo(0,12); ctx.stroke();
  // 座舱玻璃 + 框架 + 反光
  ctx.fillStyle='#16364c'; ctx.beginPath(); ctx.ellipse(0,-8,3.2,6.4,0,0,TAU); ctx.fill();
  const cg=ctx.createLinearGradient(-3,-14,3,-2);
  cg.addColorStop(0,'#c9f0ff'); cg.addColorStop(0.45,'#5d93ad'); cg.addColorStop(1,'#132e42');
  ctx.fillStyle=cg; ctx.beginPath(); ctx.ellipse(0,-8,2.6,5.7,0,0,TAU); ctx.fill();
  ctx.strokeStyle='rgba(232,250,255,0.75)'; ctx.lineWidth=0.6;
  ctx.beginPath(); ctx.moveTo(-2,-11); ctx.lineTo(1,-5); ctx.stroke();
  // 机鼻整流罩、双进气道、双尾喷口
  ctx.fillStyle='#eef6fc'; poly([[0,-21],[2,-17],[-2,-17]]); ctx.fill();
  ctx.fillStyle='rgba(26,42,58,0.86)'; ctx.fillRect(-7.6,-1,2.6,7); ctx.fillRect(5,-1,2.6,7);
  ctx.fillStyle='#263544'; ctx.fillRect(-4.3,12.8,3.2,3.2); ctx.fillRect(1.1,12.8,3.2,3.2);
  ctx.fillStyle='rgba(255,172,92,0.92)'; ctx.fillRect(-3.7,15,2,1.4); ctx.fillRect(1.7,15,2,1.4);
  // 机翼圆徽
  for(const sx of [-12,12]){
    const dyv = sx<0 ? -dip : dip;

    if (G.ship===0 || G.ship===1 || G.ship===3){

      ctx.beginPath(); ctx.arc(P.x, P.y, R, 0, TAU); ctx.stroke();
    }
    for (let i=0;i<dps.length;i++){
      const d = dps[i];
      ctx.save(); ctx.translate(d.x, d.y); ctx.rotate(d.a + Math.PI/2);
      ctx.fillStyle = 'rgba(4,10,18,0.34)';
      ctx.beginPath(); ctx.ellipse(2,2,9,6,0,0,TAU); ctx.fill();

      ctx.beginPath(); ctx.moveTo(-7,-6); ctx.lineTo(7,6); ctx.moveTo(7,-6); ctx.lineTo(-7,6); ctx.stroke();
      ctx.strokeStyle = 'rgba(200,230,255,'+(0.30+0.16*Math.sin(G.t*17+i))+')'; ctx.lineWidth = 0.9;
      ctx.beginPath(); ctx.arc(0,0,9.6,0,TAU); ctx.stroke();
      ctx.fillStyle = '#3b4b5a'; ctx.beginPath(); ctx.arc(0,0,4.3,0,TAU); ctx.fill();
      ctx.fillStyle = '#ffd76a'; ctx.beginPath(); ctx.arc(0,-1,2.1,0,TAU); ctx.fill();
      ctx.fillStyle = 'rgba(255,90,70,0.95)'; ctx.beginPath(); ctx.arc(-7,-6,1.7,0,TAU); ctx.fill();

// 杂兵改用「预烘焙航拍质感精灵」：金属蒙皮渐变 + 光照倒角 + 颗粒噪声 +
// 蒙皮接缝/铆钉 + 迷彩斑块 + 玻璃座舱反射 + 地面投影 + 引擎热光 + 水面尾迹。
// 每种单位只在首次出现时烘焙一次，之后每帧仅一次 drawImage，不增加帧开销。
const unitCache = new Map();
function uPath(g,pts){
  g.beginPath(); g.moveTo(pts[0][0],pts[0][1]);
  for(let i=1;i<pts.length;i++) g.lineTo(pts[i][0],pts[i][1]);
  g.closePath();
}
function uGrad(g,stops,x0,y0,x1,y1){
  const gr=g.createLinearGradient(x0,y0,x1,y1);
  for(const q of stops) gr.addColorStop(q[0],q[1]);
  return gr;
}
function uPart(g,pts,stops,edge){
  uPath(g,pts);
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for(const p of pts){ x0=Math.min(x0,p[0]); y0=Math.min(y0,p[1]); x1=Math.max(x1,p[0]); y1=Math.max(y1,p[1]); }
  g.fillStyle=uGrad(g,stops,x0,y0,x1,y1); g.fill();
  g.strokeStyle=edge||'rgba(10,16,20,0.82)'; g.lineWidth=1.1; g.stroke();
}
function uShadow(g,pts,dx,dy,a){
  g.save(); g.translate(dx||3, unitFlipY ? -(dy||5) : (dy||5)); uPath(g,pts);
  g.fillStyle='rgba(4,8,12,'+(a||0.42)+')'; g.fill(); g.restore();
}
function uSkin(g,pts,seed,n){
  g.save(); uPath(g,pts); g.clip();
  const rng=mulberry32(seed);
  for(let i=0;i<n;i++){
    const x=(rng()-0.5)*90, y=(rng()-0.5)*90;
    g.fillStyle=rng()<0.5?'rgba(255,255,255,0.11)':'rgba(0,0,0,0.17)';
    g.fillRect(x,y,0.7+rng()*1.5,0.7+rng()*1.1);
  }
  const sg=g.createLinearGradient(-34,-30,26,34);
  sg.addColorStop(0,'rgba(255,255,255,0.20)'); sg.addColorStop(0.42,'rgba(255,255,255,0.02)'); sg.addColorStop(1,'rgba(0,0,0,0.21)');
  g.fillStyle=sg; g.fillRect(-60,-60,120,120);
  g.restore();
}
function uSeam(g,segs,col,w){
  g.strokeStyle=col||'rgba(12,18,22,0.38)'; g.lineWidth=w||0.8;
  for(const L of segs){ g.beginPath(); g.moveTo(L[0],L[1]); g.lineTo(L[2],L[3]); g.stroke(); }
}
function uRivets(g,list){
  g.fillStyle='rgba(240,245,240,0.36)';

}
function uCanopy(g,x,y,w,h,tint){
  const gr=g.createLinearGradient(x-w/2,y-h/2,x+w/2,y+h/2);
  gr.addColorStop(0,'rgba(228,247,255,0.94)'); gr.addColorStop(0.34,tint||'#4e8fa8');
  gr.addColorStop(0.76,'#22475c'); gr.addColorStop(1,'rgba(10,24,34,0.96)');
  uPath(g,[[x,y-h/2],[x+w/2,y-h*0.22],[x+w*0.34,y+h/2],[x-w*0.34,y+h/2],[x-w/2,y-h*0.22]]);
  g.fillStyle=gr; g.fill(); g.strokeStyle='rgba(8,16,22,0.85)'; g.lineWidth=1.1; g.stroke();
  g.beginPath(); g.moveTo(x-w*0.28,y-h*0.34); g.lineTo(x-w*0.04,y+h*0.36);

function uHazard(g,x,y,w,h){
  g.save(); g.beginPath(); g.rect(x-w/2,y-h/2,w,h); g.clip();
  g.fillStyle='#d8b23c'; g.fillRect(x-w/2,y-h/2,w,h);

    g.lineTo(x+i+2.6+h,y+h/2); g.lineTo(x+i+h,y+h/2); g.closePath(); g.fill();

}
function uLight(g,x,y,r,c,a){

function uMark(g,txt,x,y,size){

      [[0,'#93a6a8'],[1,'#26363c']]);
    uHazard(g,0,-19,26,3); uMark(g,'MB-7',0,15,3.8);
    uLight(g,-18,-18,4,'255,90,70',0.7); uLight(g,18,-18,4,'90,255,150',0.7);
    g.strokeStyle='rgba(236,250,255,0.42)'; g.lineWidth=1.8;
    g.beginPath(); g.arc(0,27,12,0.2,Math.PI-0.2); g.stroke();
  },
  t_seabarge(g){
    uShadow(g,[[-15,-10],[15,-10],[15,7],[-15,7]],2,3,0.28);
    uPart(g,[[-15,-10],[15,-10],[16,6],[-16,6]],[[0,'#b3beb2'],[0.45,'#6a7970'],[1,'#28342c']]);
    for(let i=-1;i<=1;i++){
      const dx=i*9;
      g.fillStyle='#172019'; g.beginPath(); g.arc(dx,9,3.8,0,TAU); g.fill();
      g.fillStyle='#cdd6c8'; g.beginPath(); g.arc(dx,9,2.4,0,TAU); g.fill();
      g.fillStyle='#d8b23c'; g.fillRect(dx-3,2,6,2);
    }
    uSeam(g,[[-14,-3,14,-3]]); uHazard(g,0,-7,22,2.6); uMark(g,'VLS',0,-2,3.6);
  },
  t_tank(g){
    uShadow(g,[[-9,-10],[9,-10],[9,10],[-9,10]],2,3,0.3);
    uPart(g,[[-9,-10],[9,-10],[10,4],[7,10],[-7,10],[-10,4]],[[0,'#adb390'],[0.45,'#6d7759'],[1,'#313a2b']]);
    uSeam(g,[[-8,-3,8,-3]]);
    uPart(g,[[-2.6,4],[2.6,4],[2.6,18],[-2.6,18]],[[0,'#929a83'],[1,'#293026']]);
    g.fillStyle='#151a14'; g.fillRect(-2.9,16,5.8,3);
    uRivets(g,[[-7,-7],[7,-7],[-7,6],[7,6]]);
  },
  t_aa(g){
    uPart(g,[[-9,-9],[9,-9],[10,4],[-10,4]],[[0,'#a4a792'],[0.45,'#666c5c'],[1,'#2b3127']]);
    for(const dx of [-4.2,4.2]){
      uPart(g,[[dx-1.8,2],[dx+1.8,2],[dx+1.8,17],[dx-1.8,17]],[[0,'#8e9682'],[1,'#232a20']]);
      g.fillStyle='#121812'; g.fillRect(dx-2,15,4,2.6);
    }
    uSeam(g,[[-8,-3,8,-3]]); uRivets(g,[[-7,-6],[7,-6]]);
  },
  t_launcher(g){
    uPart(g,[[-14,-9],[14,-9],[15,5],[-15,5]],[[0,'#a5aa90'],[0.45,'#6b745e'],[1,'#2d3528']]);
    for(let i=-1;i<=1;i++){
      const dx=i*9;
      g.fillStyle='#1b2118'; g.beginPath(); g.arc(dx,8,3.4,0,TAU); g.fill();
      g.fillStyle='#c9cec2'; g.beginPath(); g.arc(dx,8,2.2,0,TAU); g.fill();
      g.fillStyle='#d8b23c'; g.fillRect(dx-3,2,6,2);
    }
    uSeam(g,[[-13,-3,13,-3]]); uHazard(g,0,-6,20,2.6);

};
function blitUnit(key,x,y,rot){
  const sp=UNIT_SPEC[key]; if(!sp) return;
  const c=makeUnit(key,sp[0],sp[1],UNIT_PAINTS[key]);
  ctx.save(); ctx.translate(x,y); if(rot) ctx.rotate(rot);
  ctx.drawImage(c,-sp[0]/2,-sp[1]/2); ctx.restore();
}
function drawFoes(){
  for (const f of foes){
    let key=f.kind, rot=0;
    if (key==='heli'){
      key='heli'+(Math.floor(G.t*22)%4);
      // 精灵原本机头朝下；横飞时转 90° 指向飞行方向，再叠一点压坡度
      const sd = f.side || (f.vx>0 ? 1 : -1);
      rot = -sd*Math.PI/2 + Math.sin(G.t*2.2+(f.ph||0))*0.05;
    }
    // 斜向无人机给一点压坡度，机身方向与飞行方向一致
    if (f.kind==='drone' && f.mode==='diag') rot = clamp((f.vx||0)*0.0026, -0.42, 0.42);
    blitUnit(key,f.x,f.y,rot);
    if (f.flash>0){
      ctx.save(); ctx.globalCompositeOperation='lighter';
      ctx.fillStyle='rgba(255,255,255,'+Math.min(0.55,f.flash*7)+')';
      ctx.beginPath(); ctx.arc(f.x,f.y,f.r*1.25,0,TAU); ctx.fill(); ctx.restore();
    }
  }
}
function drawGrounds(){
  for (const g of grounds){
    const a=Math.atan2(P.y-g.y,P.x-g.x);
    ctx.save();
    if (g.retireT) ctx.globalAlpha = clamp(g.retireT/0.95,0,1);
    blitUnit(groundSprite(g),g.x,g.y,0);
    blitUnit(groundTurret(g),g.x,g.y,a-Math.PI/2);
    if (g.flash>0){ ctx.fillStyle='rgba(255,255,255,0.45)'; ctx.beginPath(); ctx.arc(g.x,g.y,g.r,0,TAU); ctx.fill(); }
    ctx.restore();
  }
}

// ---------- 摧毁动画 & 画面遗留物 ----------
// 群系切换时不硬删不兼容单位：留一团尘/水雾，随滚动淡出退场
function syncGroundBiome(){
  const b = G.blendSteps>0 ? G.blendFrom : G.terrainCur;
  if (!b || b===groundBiomeCur) return;
  groundBiomeCur = b;
  for (const g of grounds){
    if (g.retireT || g.dead) continue;
    if (!groundAllowed(g.kind, b)){
      g.retireT = 0.95;
      for (let i=0;i<10;i++) parts.push({ kind:'smoke', x:g.x+rand(-g.r,g.r), y:g.y+rand(-8,8),
        vx:rand(-22,22), vy:rand(-8,14), life:rand(0.45,0.8), max:0.8, a:0.34, size:rand(2.6,5.2) });
    }
  }
}
function groundSprite(g){ return (g.sea && g.kind==='launcher') ? 'seabarge' : g.kind; }
function groundTurret(g){ return (g.sea && g.kind==='launcher') ? 't_seabarge' : 't_'+g.kind; }

// 焦黑残骸：把原单位精灵压暗、叠烧蚀斑，预烘焙一次，之后每帧只 drawImage
const wreckCache = new Map();
function charredUnit(key){
  let c=wreckCache.get(key); if (c) return c;
  const sp=UNIT_SPEC[key]; if (!sp) return null;
  const src=makeUnit(key,sp[0],sp[1],UNIT_PAINTS[key]);
  c=document.createElement('canvas'); c.width=sp[0]; c.height=sp[1];
  const g=c.getContext('2d');
  g.drawImage(src,0,0);
  g.globalCompositeOperation='source-atop';
  g.fillStyle='rgba(24,19,15,0.46)'; g.fillRect(0,0,sp[0],sp[1]);
  const rng=mulberry32(613+sp[0]*7+sp[1]);
  for(let i=0;i<30;i++){
    g.fillStyle='rgba(8,7,6,'+(0.22+rng()*0.42).toFixed(2)+')';
    g.beginPath(); g.arc(rng()*sp[0],rng()*sp[1],0.8+rng()*3.2,0,TAU); g.fill();
  }
  g.globalCompositeOperation='source-over';
  wreckCache.set(key,c); return c;
}
// 小型机体（战斗机 / 无人机 / 直升机）：只炸成一蓬金属碎片、火花后消失，
// 不留残骸也不在地面留焦痕；只有大型轰炸机才会裂成两半坠毁。
function shatterFoe(t){
  const pal = t.kind==='fighter' ? ['#b85e51','#8e423a','#d8b7ad','#3a2a28']
            : t.kind==='drone'  ? ['#8d9aa4','#5c6a72','#c3ced2','#2c3940']
            :                     ['#8a9276','#5e6650','#c0c6ae','#30382a'];
  parts.push({ kind:'ring', x:t.x, y:t.y, r:3, vr:150, life:0.28, max:0.28, color:'rgba(255,214,150,0.55)' });
  for(let i=0;i<16;i++){
    const a=rand(0,TAU), sp=rand(70,235), L=rand(0.45,0.85);
    parts.push({ kind:'debris', x:t.x+rand(-6,6), y:t.y+rand(-6,6),
      vx:Math.cos(a)*sp, vy:Math.sin(a)*sp-34, rot:rand(0,TAU), rotV:rand(-9,9),
      size:rand(2,5), color:choice(pal), life:L, max:L });
  }
  for(let i=0;i<14;i++) parts.push({ kind:'spark', x:t.x+rand(-9,9), y:t.y+rand(-9,9),
    vx:rand(-180,180), vy:rand(-170,90), life:rand(0.22,0.52), max:0.52,
    color:choice(['#ffd76a','#ff8a3c','#fff1c2','#8a8a86']), size:rand(1.6,3.4) });
  for(let i=0;i<4;i++) parts.push({ kind:'smoke', x:t.x+rand(-8,8), y:t.y+rand(-8,8),
    vx:rand(-20,20), vy:rand(-26,-6), life:0.5, max:0.5, a:0.28, size:rand(2.4,4.2) });
}
function spawnWreck(t){
  const sea = !!(t.sea || t.kind==='gunboat');
  const land = !sea && (t.kind==='tank'||t.kind==='aa'||t.kind==='launcher'||t.kind==='mlrs');
  const cat = sea ? 'sea' : land ? 'land' : 'air';
  if (cat==='air' && t.kind!=='bomber' && t.kind!=='b2'){ shatterFoe(t); return; }
  let key = t.kind==='heli' ? 'heli0' : t.kind;
  if (sea && t.kind==='launcher') key='seabarge';
  if (!UNIT_SPEC[key]) return;
  const w = { cat, key, x:t.x, y:t.y, t:0,
    max: cat==='air'?1.7:cat==='sea'?2.5:3.0,
    rot:0, rotV:rand(-2.0,2.0), vx:rand(-30,30), vy:rand(45,90),
    spin:rand(0,TAU), seed:Math.random()*1e6 };
  w.life=w.max;
  wrecks.push(w); if (wrecks.length>16) wrecks.shift();
  decals.push({ kind: sea?'oil':'scorch', x:t.x, y:t.y, t:0,
    max: sea?7.0:9.0, r:Math.max(16,(t.r||12)*(sea?1.65:1.55)), seed:Math.random()*1e6 });
  if (decals.length>20) decals.shift();
  parts.push({ kind:'ring', x:t.x, y:t.y, r:3, vr:108, life:0.26, max:0.26, color:'rgba(255,206,142,0.48)' });
  for(let i=0;i<(cat==='air'?14:10);i++){
    parts.push({ kind:'spark', x:t.x+rand(-8,8), y:t.y+rand(-8,8),
      vx:rand(-110,110), vy:rand(-110,60), life:rand(0.25,0.6), max:0.6,
      color:choice(['#ffd76a','#ff8a3c','#fff1c2','#8a8a86']), size:rand(1.6,3.6) });
  }
}
function updateWrecks(dt){
  const scroll = scrollSpeed();
  for (const w of wrecks){
    w.t += dt; w.life -= dt;
    w.y += (scroll + (w.cat==='air'?w.vy:0))*dt;
    if (w.cat==='air'){ w.x += w.vx*dt; w.vy += 48*dt; w.rot += w.rotV*dt; }
    else if (w.cat==='sea'){ w.rot = Math.min(0.72, w.t*0.44); w.x += Math.sin(G.t*2+w.spin)*7*dt; }
    if (w.t < w.max*0.82){
      if (Math.random()<0.34) parts.push({ kind:'smoke', x:w.x+rand(-9,9), y:w.y+rand(-10,6),
        vx:rand(-16,16), vy:rand(-34,-8), life:rand(0.55,1.0), max:1.0, a:0.34, size:rand(3,6.5) });
      if (Math.random()<0.38) parts.push({ kind:'ash', x:w.x+rand(-13,13), y:w.y+rand(-10,10),
        vx:rand(-24,24), vy:rand(-18,26), ph:rand(0,TAU), life:rand(0.8,1.8), max:1.8,
        color:Math.random()<0.28?'#ffb45c':'#b9b3a6', size:rand(1.2,2.8) });
    }
  }
  wrecks = wrecks.filter(w=> w.life>0 && w.y<H+100);
  for (const d of decals){ d.t += dt; d.y += scroll*dt; }
  decals = decals.filter(d=> d.t<d.max && d.y<H+80);
}
// 地面遗留物：焦痕灰烬 / 浮油碎片，随地形滚动并缓慢淡出
function drawDecals(){
  for (const d of decals){
    const a = Math.max(0, 1 - d.t/d.max);
    const rng = mulberry32(Math.floor(d.seed));
    ctx.save(); ctx.globalAlpha = a;
    if (d.kind==='scorch'){
      const gr=ctx.createRadialGradient(d.x,d.y,0,d.x,d.y,d.r);
      gr.addColorStop(0,'rgba(14,11,9,0.78)'); gr.addColorStop(0.58,'rgba(30,24,18,0.42)'); gr.addColorStop(1,'rgba(38,32,24,0)');
      ctx.fillStyle=gr; ctx.beginPath(); ctx.ellipse(d.x,d.y,d.r,d.r*0.62,0,0,TAU); ctx.fill();
      for(let i=0;i<26;i++){
        const th=rng()*TAU, rr=rng()*d.r*1.15;
        ctx.fillStyle=rng()<0.3?'rgba(196,186,168,0.5)':'rgba(24,20,17,0.6)';
        ctx.fillRect(d.x+Math.cos(th)*rr, d.y+Math.sin(th)*rr*0.62, 1+rng()*2.4, 1+rng()*1.8);
      }
      ctx.strokeStyle='rgba(12,10,8,0.34)'; ctx.lineWidth=1;
      for(let i=0;i<3;i++){ const th=rng()*TAU;
        ctx.beginPath(); ctx.moveTo(d.x,d.y); ctx.lineTo(d.x+Math.cos(th)*d.r*0.85,d.y+Math.sin(th)*d.r*0.5); ctx.stroke(); }
      if (d.t < 1.5){                                   // 刚击破时焦痕里还有未熄的余烬
        const ea=(1-d.t/1.5)*0.85;
        for(let i=0;i<7;i++){
          const th=rng()*TAU, rr=rng()*d.r*0.82;
          ctx.fillStyle='rgba(255,'+(140+Math.floor(rng()*80))+',70,'+ea.toFixed(2)+')';
          ctx.fillRect(d.x+Math.cos(th)*rr, d.y+Math.sin(th)*rr*0.62, 1.6, 1.6);
        }
      }
    } else {
      const gr=ctx.createRadialGradient(d.x,d.y,0,d.x,d.y,d.r);
      gr.addColorStop(0,'rgba(12,24,28,0.66)'); gr.addColorStop(0.55,'rgba(24,46,52,0.34)'); gr.addColorStop(1,'rgba(40,70,78,0)');
      ctx.fillStyle=gr; ctx.beginPath(); ctx.ellipse(d.x,d.y,d.r,d.r*0.55,0,0,TAU); ctx.fill();
      ctx.strokeStyle='rgba(150,210,224,0.30)'; ctx.lineWidth=1.2;
      for(let i=0;i<2;i++){ ctx.beginPath(); ctx.ellipse(d.x,d.y,d.r*(0.45+i*0.28),d.r*(0.24+i*0.15),0,0,TAU); ctx.stroke(); }
      ctx.strokeStyle='rgba(226,248,255,0.34)';
      for(let i=0;i<3;i++){ ctx.beginPath(); ctx.ellipse(d.x,d.y,d.r*(0.7+i*0.2),d.r*(0.38+i*0.11),0,0,TAU); ctx.stroke(); }
      for(let i=0;i<12;i++){
        const th=rng()*TAU, rr=rng()*d.r;
        ctx.fillStyle=rng()<0.5?'rgba(196,212,210,0.55)':'rgba(28,44,48,0.7)';
        ctx.fillRect(d.x+Math.cos(th)*rr, d.y+Math.sin(th)*rr*0.5, 2+rng()*4, 1+rng()*2);
      }
    }
    ctx.restore();
  }
}
// 残骸本体：飞机裂成两半翻滚坠落 / 陆战单位原地烧塌 / 舰艇倾斜下沉
function drawWrecks(){
  for (const w of wrecks){
    const c=charredUnit(w.key), sp=UNIT_SPEC[w.key];
    if (!c || !sp) continue;
    if (w.t < 0.55){
      const f=1-w.t/0.55, R=30*(1+w.t*0.6);
      const fg=ctx.createRadialGradient(w.x,w.y,0,w.x,w.y,R);
      fg.addColorStop(0,'rgba(255,176,84,'+(0.30*f).toFixed(3)+')');
      fg.addColorStop(0.42,'rgba(248,116,48,'+(0.15*f).toFixed(3)+')');
      fg.addColorStop(1,'rgba(240,96,32,0)');
      ctx.save(); ctx.fillStyle=fg;                  // 正常混合：不会把浅色地形烧成白块
      ctx.beginPath(); ctx.arc(w.x,w.y,R,0,TAU); ctx.fill(); ctx.restore();
    }
    const a=Math.max(0,Math.min(1,w.life/Math.min(0.9,w.max)));
    ctx.save(); ctx.globalAlpha=a;
    if (w.cat==='air'){
      const half=Math.floor(sp[0]/2), p=w.t;
      for(const s of [-1,1]){
        const sw = s<0 ? half : sp[0]-half;
        ctx.save();
        // 先把半片放回它在完整机体里的中心位置，再叠加分离量：
        // p=0 时严丝合缝像一整架飞机，随后左右拉开、上下错开、反向翻滚。
        const off = s*(sp[0]/4 + 2 + Math.min(1.5,p)*26);
        ctx.translate(w.x+off, w.y+s*(Math.min(1.5,p)*15)+p*4);
        ctx.rotate(w.rot + s*Math.min(1.5,p)*2.0);
        ctx.drawImage(c, s<0?0:half, 0, sw, sp[1], -sw/2, -sp[1]/2, sw, sp[1]);
        ctx.restore();
      }
    } else {
      const q=w.cat==='sea' ? Math.min(1,w.t/1.9) : Math.min(1,w.t/w.max);
      ctx.translate(w.x, w.y + (w.cat==='sea'?q*9:q*3));
      ctx.rotate(w.rot);
      ctx.scale(1 - (w.cat==='sea'?q*0.22:0), 1 - (w.cat==='land'?q*0.42:q*0.16));
      ctx.drawImage(c,-sp[0]/2,-sp[1]/2);
      if (w.cat==='sea'){
        ctx.globalCompositeOperation='lighter';
        for(let i=0;i<3;i++){
          const rr=10+i*9+w.t*16;
          ctx.strokeStyle='rgba(200,238,250,'+(0.30*(1-q)+0.06).toFixed(3)+')';
          ctx.lineWidth=1.6; ctx.beginPath(); ctx.ellipse(0,0,rr,rr*0.42,0,0,TAU); ctx.stroke();
        }
      }
    }
    ctx.restore();
  }
}


function drawBullets(){
  for (const b of bullets){
    if (b.kind==='shot'){
      const vm = (G.visMul||1)*(1+(clamp(P.gun,1,GUN_MAX)-1)*0.045);
      ctx.fillStyle = '#ffe9a8'; ctx.fillRect(b.x-1.8*vm, b.y-7*vm, 3.6*vm, 11*vm);
      ctx.fillStyle = 'rgba(255,190,80,0.5)'; ctx.fillRect(b.x-3.4*vm, b.y-4*vm, 6.8*vm, 6*vm);
    } else if (b.kind==='plasma'){
      // 赤鸢的脉冲弹：青蓝发光梭形，按飞行方向旋转
      const vm = (G.visMul||1)*(1+(clamp(P.gun,1,GUN_MAX)-1)*0.045);
      ctx.save(); ctx.translate(b.x,b.y); ctx.rotate(Math.atan2(b.vy,b.vx)+Math.PI/2);
      ctx.globalCompositeOperation='lighter';
      ctx.fillStyle='rgba(90,200,255,0.30)';
      ctx.beginPath(); ctx.ellipse(0,0,4.6*vm,9*vm,0,0,TAU); ctx.fill();
      ctx.fillStyle='#a8ecff'; ctx.fillRect(-1.7*vm,-7*vm,3.4*vm,11*vm);
      ctx.fillStyle='#ffffff'; ctx.fillRect(-0.8*vm,-5*vm,1.6*vm,7*vm);
      ctx.restore();
    } else if (b.kind==='wave'){
      // 澜隼的波刃弹：薄荷绿发光梭形（与赤鸢的青蓝脉冲区分）
      const vm = (G.visMul||1)*(1+(clamp(P.gun,1,GUN_MAX)-1)*0.045);
      ctx.save(); ctx.translate(b.x,b.y); ctx.rotate(Math.atan2(b.vy,b.vx)+Math.PI/2);
      ctx.globalCompositeOperation='lighter';
      ctx.fillStyle='rgba(87,230,201,0.30)';
      ctx.beginPath(); ctx.ellipse(0,0,4.6*vm,9*vm,0,0,TAU); ctx.fill();
      ctx.fillStyle='#c9ffe9'; ctx.fillRect(-1.7*vm,-7*vm,3.4*vm,11*vm);
      ctx.fillStyle='#ffffff'; ctx.fillRect(-0.8*vm,-5*vm,1.6*vm,7*vm);
      ctx.restore();
    } else if (b.kind==='pellet'){
      // 碎星的霰射弹丸（v38）：穿甲重弹 —— 按飞行方向旋转的尖头弹体 + 白热芯 + 火焰尾迹
      const vm = (G.visMul||1)*(1+(clamp(P.gun,1,GUN_MAX)-1)*0.045);
      ctx.save(); ctx.translate(b.x,b.y); ctx.rotate(Math.atan2(b.vy,b.vx)+Math.PI/2);
      ctx.globalCompositeOperation='lighter';
      ctx.fillStyle='rgba(255,130,30,0.30)';
      ctx.beginPath(); ctx.ellipse(0,0,5.0*vm,10.5*vm,0,0,TAU); ctx.fill();
      // 尾迹：弹体后方一截抖动的火焰拖尾
      ctx.fillStyle='rgba(255,110,25,0.38)';
      ctx.beginPath(); ctx.moveTo(-2.0*vm,6*vm); ctx.lineTo(0,(15+Math.random()*6)*vm); ctx.lineTo(2.0*vm,6*vm); ctx.closePath(); ctx.fill();
      // 弹体：尖头重弹（橙金外壳）
      ctx.fillStyle='#ff9e2c';

      ctx.fillStyle = '#e2543e'; ctx.beginPath(); ctx.moveTo(-3,-8); ctx.lineTo(0,-13); ctx.lineTo(3,-8); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#ffb35c'; ctx.beginPath(); ctx.moveTo(-2.4,5); ctx.lineTo(0,11+Math.random()*4); ctx.lineTo(2.4,5); ctx.closePath(); ctx.fill();

    } else if (b.kind==='droneShot'){
      const vm = (G.visMul||1)*(1+(clamp(P.gun,1,GUN_MAX)-1)*0.045);
      ctx.fillStyle = 'rgba(154,220,255,0.32)';
      ctx.beginPath(); ctx.arc(b.x,b.y,6.2*vm,0,TAU); ctx.fill();
      ctx.fillStyle = '#bff0ff'; ctx.beginPath(); ctx.arc(b.x,b.y,2.9*vm,0,TAU); ctx.fill();
      ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(b.x,b.y,1.3*vm,0,TAU); ctx.fill();

      ctx.save(); ctx.translate(b.x,b.y); ctx.rotate(Math.atan2(b.vy,b.vx)+Math.PI/2);

      ctx.fillStyle = '#0d1014'; ctx.fillRect(-4.4, 2, 8.8, 4);                 // 尾翼
      ctx.fillStyle = '#0a0c10'; ctx.fillRect(-3.4, -8, 6.8, 13);              // 弹体暗边
      ctx.fillStyle = '#2f353d'; ctx.fillRect(-2.7, -7, 5.4, 11);              // 金属黑主体
      ctx.fillStyle = '#6e7883'; ctx.fillRect(-2.7, -7, 1.2, 11);              // 冷色金属高光
      ctx.fillStyle = '#151a20'; ctx.fillRect(1.2, -7, 1.5, 11);               // 背光面
      ctx.fillStyle = '#ff2fbf'; ctx.beginPath(); ctx.moveTo(-2.7,-7); ctx.lineTo(0,-12); ctx.lineTo(2.7,-7); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#ffb3ec'; ctx.beginPath(); ctx.arc(0,-8.4,0.9,0,TAU); ctx.fill();
      ctx.fillStyle = '#ff8a2b'; ctx.beginPath(); ctx.moveTo(-2.2,5); ctx.lineTo(0,12); ctx.lineTo(2.2,5); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#ffd76a'; ctx.beginPath(); ctx.moveTo(-1.1,5); ctx.lineTo(0,9); ctx.lineTo(1.1,5); ctx.closePath(); ctx.fill();
      ctx.restore();
    } else if (e.bomb){
      ctx.fillStyle = '#23262b'; ctx.beginPath(); ctx.arc(e.x, e.y, 6, 0, TAU); ctx.fill();
      ctx.fillStyle = Math.floor(G.t*6)%2 ? '#ff5040' : '#ffd34d'; ctx.beginPath(); ctx.arc(e.x, e.y-2, 2, 0, TAU); ctx.fill();
    } else {
      ctx.fillStyle = e.big ? '#ff9a3c' : '#ff5c7a';
      ctx.beginPath(); ctx.arc(e.x, e.y, e.r, 0, TAU); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(e.x, e.y, e.r*0.42, 0, TAU); ctx.fill();

function drawPows(){
  for (const pw of pows){
    const bob = Math.sin(pw.ph)*3;
    ctx.save(); ctx.translate(pw.x, pw.y + bob);
    if (pw.kind==='P'){
      ctx.fillStyle = '#e8a71c'; ctx.beginPath(); ctx.arc(0,0,11,0,TAU); ctx.fill();
      ctx.fillStyle = '#ffd76a'; ctx.beginPath(); ctx.arc(0,0,8.6,0,TAU); ctx.fill();
      ctx.fillStyle = '#7a4d00'; ctx.font = 'bold 12px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText('P', 0, 1);
    } else if (pw.kind==='life'){
      ctx.fillStyle = '#2f9e57'; ctx.beginPath(); ctx.arc(0,0,11,0,TAU); ctx.fill();
      ctx.fillStyle = '#7dff8a'; ctx.fillRect(-2.2,-7,4.4,14); ctx.fillRect(-7,-2.2,14,4.4);
    } else if (pw.kind==='cd' || pw.kind==='atk'){
      // 稀有道具：旋转八芒星 + 呼吸光环，一眼看出与普通 P / 生命不同
      const isCd = pw.kind==='cd', col = isCd ? '#7ad9ff' : '#ff9a4c';
      ctx.save(); ctx.rotate(G.t*0.8);
      ctx.fillStyle = 'rgba(8,14,22,0.94)'; ctx.beginPath();
      for (let i=0;i<8;i++){
        const a=TAU*i/8-Math.PI/2, r=i%2?7.4:13.4;
        const qx=Math.cos(a)*r, qy=Math.sin(a)*r;
        if (!i) ctx.moveTo(qx,qy); else ctx.lineTo(qx,qy);
      }
      ctx.closePath(); ctx.fill(); ctx.strokeStyle=col; ctx.lineWidth=1.8; ctx.stroke(); ctx.restore();
      ctx.strokeStyle=col; ctx.globalAlpha=0.30+0.18*Math.sin(G.t*4); ctx.lineWidth=1;
      ctx.beginPath(); ctx.arc(0,0,16,0,TAU); ctx.stroke(); ctx.globalAlpha=1;
      ctx.fillStyle=col; ctx.font='bold 9px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(isCd ? 'CD' : 'ATK', 0, 0);
    }
    ctx.restore();
  }
}
function drawFx(){
  for (const p of parts){
    if (p.kind==='spark'){ ctx.globalAlpha = Math.max(0, p.life/p.max); ctx.fillStyle = p.color; ctx.fillRect(p.x-p.size/2, p.y-p.size/2, p.size, p.size); }
    else if (p.kind==='flame'){
      // 三层泪滴形火苗：外焰红橙 → 中焰橙黄 → 内核亮黄；随时间收缩、上飘、左右摆动
      const k = Math.max(0, p.life/p.max), sz = p.size*(0.5+0.5*k);
      const lean = Math.sin(G.t*12+p.ph)*sz*0.24;
      ctx.save(); ctx.translate(p.x, p.y);
      ctx.globalAlpha = 0.52*k; ctx.fillStyle = '#ff5a1e'; flamePath(sz*1.08, lean);       ctx.fill();
      ctx.globalAlpha = 0.86*k; ctx.fillStyle = '#ffa32b'; flamePath(sz*0.72, lean*0.7);   ctx.fill();
      ctx.globalAlpha = 0.96*k; ctx.fillStyle = '#ffe9a0'; flamePath(sz*0.40, lean*0.4);   ctx.fill();
      ctx.restore();
    }
    else if (p.kind==='ring'){ ctx.globalAlpha = Math.max(0, p.life/p.max)*0.9; ctx.strokeStyle = p.color; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, TAU); ctx.stroke(); }
    else if (p.kind==='smoke'){ ctx.globalAlpha = (p.a||0.3)*Math.max(0, p.life/p.max); ctx.fillStyle = p.color || '#aab3bc'; ctx.beginPath(); ctx.arc(p.x, p.y, p.size*2, 0, TAU); ctx.fill(); }
    else if (p.kind==='ash'){ ctx.globalAlpha = 0.72*Math.max(0, p.life/p.max); ctx.fillStyle = p.color; ctx.fillRect(p.x-p.size/2, p.y-p.size/2, p.size, p.size*0.8); }
    else if (p.kind==='debris'){
      ctx.save(); ctx.globalAlpha = Math.max(0, p.life/p.max);
      ctx.translate(p.x,p.y); ctx.rotate(p.rot); ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.moveTo(-p.size,-p.size*0.42); ctx.lineTo(p.size*0.8,-p.size*0.68);
      ctx.lineTo(p.size,p.size*0.5); ctx.lineTo(-p.size*0.6,p.size*0.72); ctx.closePath();
      ctx.fill(); ctx.strokeStyle='rgba(0,0,0,0.38)'; ctx.lineWidth=0.6; ctx.stroke(); ctx.restore();
    }
  }
  ctx.globalAlpha = 1;
  for (const bm of beams){
    const a = Math.max(0, bm.life/bm.max);
    if (bm.bolt){
      const endY = Math.min(isFinite(bm.y) ? bm.y : H, H+40);
      const pts = [[bm.x, 0]];
      { let by = 0; while (by < endY && pts.length < 60){ by += rand(18, 40); pts.push([bm.x + rand(-11, 11), Math.min(by, endY)]); } }
      const trace = (w, style) => { ctx.strokeStyle = style; ctx.lineWidth = w; ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]); for (let i=1;i<pts.length;i++) ctx.lineTo(pts[i][0], pts[i][1]); ctx.stroke(); };
      trace(6.5, 'rgba(120,180,255,'+(0.30*a)+')');
      trace(2.8, 'rgba(190,225,255,'+(0.9*a)+')');
      trace(1.2, 'rgba(255,255,255,'+(0.95*a)+')');
      const fg = ctx.createRadialGradient(bm.x, endY, 0, bm.x, endY, 26);
      fg.addColorStop(0, 'rgba(220,240,255,'+(0.55*a)+')'); fg.addColorStop(1, 'rgba(220,240,255,0)');
      ctx.fillStyle = fg; ctx.beginPath(); ctx.arc(bm.x, endY, 26, 0, TAU); ctx.fill();
    } else {
      ctx.fillStyle = 'rgba(150,220,255,'+(0.55*a)+')'; ctx.fillRect(bm.x-bm.w/2, 0, bm.w, H);
      ctx.fillStyle = 'rgba(255,255,255,'+(0.85*a)+')'; ctx.fillRect(bm.x-2.4, 0, 4.8, H);
    }
  }
  ctx.font = 'bold 14px sans-serif'; ctx.textAlign = 'center';
  for (const t of texts){ ctx.globalAlpha = Math.min(1, t.life); ctx.fillStyle = t.color; ctx.fillText(t.str, t.x, t.y); }
  ctx.globalAlpha = 1;
}

function lightenHex(hex,k){
  const n=parseInt(hex.slice(1),16);
  const r=clamp(((n>>16)&255)*k,0,255)|0, g=clamp(((n>>8)&255)*k,0,255)|0, b=clamp((n&255)*k,0,255)|0;
  return 'rgb('+r+','+g+','+b+')';
}
function bPoly(pts, fill, stroke, lw){
  ctx.beginPath(); ctx.moveTo(pts[0][0],pts[0][1]);
  for (let i=1;i<pts.length;i++) ctx.lineTo(pts[i][0],pts[i][1]);
  ctx.closePath();
  if (fill){ ctx.fillStyle=fill; ctx.fill(); }
  if (stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=lw||1.2; ctx.stroke(); }
}
function bPlate(x,y,w,h,color,opts){

  ctx.save(); ctx.translate(x,y); if (opts.rot) ctx.rotate(opts.rot);
  ctx.fillStyle='rgba(0,0,0,0.38)'; ctx.fillRect(-w/2+2.5,-h/2+3.5,w,h);

    for (const rx of [-w/2+4,w/2-4]) for (const ry of [-h/2+4,h/2-4]){ ctx.beginPath(); ctx.arc(rx,ry,1.3,0,TAU); ctx.fill(); }

  ctx.restore();
}
function bGlow(x,y,r,c,a){
  const g=ctx.createRadialGradient(x,y,0,x,y,r);

      bThruster(-30,60,8,S.glow,t); bThruster(30,60,8,S.glow,t);
      // v23 精修：甲壳荧光斑（呼吸）+ 两侧孢子囊（脉动）
      for (let i=0;i<7;i++){

        ctx.fillStyle='rgba('+S.glow+','+(0.35+0.25*Math.sin(t*2.4+i*1.3))+')';

    ctx.save(); ctx.globalCompositeOperation='lighter';

  }
  ctx.restore();
  if (b.flash>0) bossFlash(b);
}

  ctx.font='10px sans-serif'; ctx.fillStyle='rgba(255,255,255,0.55)'; ctx.textAlign='center';
  ctx.fillText('移植装备 · 自动发射', W/2, iy-6);

function hexToRgb(h){
  const n=parseInt(h.slice(1),16);
  return ((n>>16)&255)+','+((n>>8)&255)+','+(n&255);
}
// 12 个独立小图标（矢量，不用文字，也不用图片资源）
function drawSpecialIcon(id, cx, cy, s, col, owned){
  ctx.save(); ctx.translate(cx,cy); ctx.scale(s/20,s/20);
  ctx.lineWidth=1.7; ctx.lineCap='round'; ctx.lineJoin='round';
  ctx.strokeStyle=col; ctx.fillStyle=col;
  const dot=(x,y,r)=>{ ctx.beginPath(); ctx.arc(x,y,r,0,TAU); ctx.fill(); };
  switch(id){
    case 'heavy':
      dot(0,0,6.5); ctx.fillStyle=owned?'rgba(255,255,255,0.9)':col; dot(0,0,2.6);
      ctx.fillRect(-9,-1.2,3,2.4); ctx.fillRect(6,-1.2,3,2.4); break;
    case 'homing':
      ctx.beginPath(); ctx.moveTo(0,-8); ctx.lineTo(4,1); ctx.lineTo(0,7); ctx.lineTo(-4,1); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(-4,3); ctx.lineTo(-7,7); ctx.moveTo(4,3); ctx.lineTo(7,7); ctx.stroke();
      ctx.beginPath(); ctx.arc(0,0,8.5,0.7,2.4); ctx.stroke(); break;
    case 'triple':
      for(const dx of [-6,0,6]){ ctx.fillRect(dx-1.4,-7,2.8,12); dot(dx,-8.5,1.6); } break;
    case 'drones':
      for(const sx of [-1,1]){ ctx.beginPath(); ctx.moveTo(sx*9,-5); ctx.lineTo(sx*4,0); ctx.lineTo(sx*9,5); ctx.closePath(); ctx.fill(); }
      dot(0,0,2.4); break;
    case 'lurking':
      ctx.beginPath(); ctx.moveTo(0,-8); ctx.lineTo(5,-1); ctx.lineTo(2,-1); ctx.lineTo(2,4); ctx.lineTo(-2,4); ctx.lineTo(-2,-1); ctx.lineTo(-5,-1); ctx.closePath(); ctx.fill();
      for(const dx of [-5,0,5]) dot(dx,8,1.3); break;
    case 'swarm':
      for(const p of [[0,-6],[-6,3],[6,3]]){
        ctx.beginPath(); ctx.moveTo(p[0],p[1]-4); ctx.lineTo(p[0]+2.6,p[1]+3); ctx.lineTo(p[0],p[1]+1.2); ctx.lineTo(p[0]-2.6,p[1]+3); ctx.closePath(); ctx.fill();
      }
      dot(0,8.5,1.3); dot(-6,8.5,1.3); dot(6,8.5,1.3); break;
    case 'pulse':
      ctx.beginPath(); ctx.moveTo(-3,-8); ctx.lineTo(3,-8); ctx.lineTo(7,8); ctx.lineTo(-7,8); ctx.closePath(); ctx.fill();
      ctx.strokeStyle=col;
      for(const yy of [-3,1,5]){ ctx.beginPath(); ctx.moveTo(-8,yy); ctx.lineTo(8,yy); ctx.stroke(); } break;
    case 'cluster':
      for(const p of [[0,-5],[-5,0],[5,0],[-3,6],[3,6]]) dot(p[0],p[1],2.3);
      ctx.beginPath(); ctx.arc(0,0,8.5,0,TAU); ctx.stroke(); break;
    case 'rail':
      ctx.fillRect(-7,-8,3,16); ctx.fillRect(4,-8,3,16);
      ctx.fillStyle=owned?'rgba(255,255,255,0.9)':col; ctx.beginPath();
      ctx.moveTo(-1,-8); ctx.lineTo(3,-1); ctx.lineTo(0,0); ctx.lineTo(3,8); ctx.lineTo(-1,4); ctx.lineTo(0,0); ctx.closePath(); ctx.fill(); break;
    case 'storm':
      ctx.beginPath(); ctx.moveTo(2,-9); ctx.lineTo(-5,1); ctx.lineTo(-1,1); ctx.lineTo(-3,9); ctx.lineTo(6,-2); ctx.lineTo(1,-2); ctx.closePath(); ctx.fill(); break;
    case 'stinger':
      ctx.beginPath(); ctx.moveTo(-8,6); ctx.bezierCurveTo(-8,-4,4,-3,5,-7); ctx.lineTo(8,-9); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(6,-10); ctx.lineTo(9,-6); ctx.lineTo(4,-5); ctx.closePath(); ctx.fill();
      for(const p of [[-8,7],[-4,8],[0,8]]) dot(p[0],p[1],1.3); break;
    case 'devour':
      ctx.beginPath(); ctx.arc(0,0,8,0.35,Math.PI*2-0.35); ctx.stroke();
      ctx.beginPath(); ctx.arc(0,0,4.6,0.35,Math.PI*2-0.35); ctx.stroke();
      dot(0,0,2.2);
      ctx.beginPath(); ctx.moveTo(6,-6); ctx.lineTo(9,-9); ctx.moveTo(6,6); ctx.lineTo(9,9); ctx.stroke(); break;
  }
  ctx.restore();
}

function rrPath(x, y, w, h, r){

  ctx.arcTo(x, y+h, x, y, r); ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
}

// ---------- main update & loop ----------
function update(dt){
  G.t += dt;
  if (G.saveMsgT > 0) G.saveMsgT = Math.max(0, G.saveMsgT - dt);   // 提示在暂停 / 标题页也会消退
  DIFF = foeDifficulty();
  updateSpecialFlash();
  pumpTiles(G.state==='title' ? 3 : 2);
  if (G.paused) return;
  if (G.bannerT > 0) G.bannerT -= dt;
  if (G.shake > 0) G.shake = Math.max(0, G.shake - dt*26);
  if (G.state==='over'){ G.overT += dt; updateFx(dt); return; }
  if (G.state==='title'){ updateTerrain(dt); return; }
  updateTerrain(dt);
  if (G.state==='play' || G.state==='warn'){
    G.scrollTime += dt; G.biomeTimer += dt;
    if (G.biomeTimer > 35 && G.state==='play'){
      G.biomeTimer = 0;
      requestBiome((G.biomeIdx + 1) % BIOMES.length, 5);   // 不再一条横线硬切
    }
    syncGroundBiome();
    foeTimer -= dt; groundTimer -= dt;
    // v17：精英杂兵计时 —— 频率压低、场上最多 1 个、BOSS 战不出
    eliteTimer -= dt;
    if (eliteTimer <= 0){
      eliteTimer = rand(38, 56);
      if (G.state==='play' && !eliteOnField()) spawnElite();
    }
    const k = Math.min(G.bossKills, 14);
    if (foeTimer <= 0){
      spawnFoe();
      if (k >= 3 && Math.random() < 0.28) spawnFoe();
      if (k >= 6 && Math.random() < 0.22) spawnFoe();
      if (k >= 10 && Math.random() < 0.16) spawnFoe();
      foeTimer = rand(0.95, 1.35) * DIFF.spawn;
    }
    if (groundTimer <= 0){ spawnGround(); groundTimer = rand(2.2, 3.4) * DIFF.spawn; }
    if (G.state==='play' && G.scrollTime >= BOSS_INTERVAL){
      G.state = 'warn'; G.warnT = 3; G.nextBossIdx = pickBossIdx(); sfx.warn();
      if (!BOSSES[G.nextBossIdx].air) requestBiome(BOSSES[G.nextBossIdx].biome, 3);   // 预警阶段就开始过渡地形（空天母舰除外）
    } else if (G.state==='warn'){
      G.warnT -= dt;
      if (G.warnT <= 0) startBoss();
    }
  }
  updatePlayer(dt);
  updateFoes(dt);
  updateAllies(dt);
  updateGrounds(dt);
  if (G.state==='boss') updateBoss(dt);
  updateBullets(dt);
  updateFx(dt);
  collisions();
}
// 冷却结束的瞬间只让对应图标闪一下，不显示任何数字
function updateSpecialFlash(){
  if (!P.cdPrev) P.cdPrev = {};
  for (const id of P.specials){
    const cooling = (P.cds[id]||0) > G.t;
    if (P.cdPrev[id] && !cooling) P.readyFlash[id] = G.t + 0.62;
    P.cdPrev[id] = cooling;
  }
}
function render(){
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);
  ctx.save();
  if (G.shake > 0) ctx.translate(rand(-G.shake, G.shake)*0.5, rand(-G.shake, G.shake)*0.5);
  for (const s of segs) if (s.y > -SEG && s.y < H) drawSeg(s);
  drawAtmosphere();
  drawDecals();
  drawGrounds();
  drawWrecks();
  drawPows();
  drawFoes();
  drawAllies();
  if (G.boss){ drawBossBeams(G.boss); drawBoss(G.boss); }
  drawBullets();
  drawPlayer();
  drawFx();
  drawVignette();
  ctx.restore();
  if (G.state!=='title') drawHUD();
  syncPad();
  drawTouchUI();
  drawScreens();
}
function drawTouchUI(){
  if (G.paused || P.dead) return;
  if (G.state!=='play' && G.state!=='boss' && G.state!=='warn') return;
  // 右下角暂停钮
  ctx.save();
  ctx.fillStyle = 'rgba(8,16,28,0.55)';
  ctx.beginPath(); ctx.arc(PAUSE_BTN.x, PAUSE_BTN.y, PAUSE_BTN.r, 0, TAU); ctx.fill();
  ctx.strokeStyle = 'rgba(232,240,246,0.55)'; ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.arc(PAUSE_BTN.x, PAUSE_BTN.y, PAUSE_BTN.r, 0, TAU); ctx.stroke();
  ctx.fillStyle = 'rgba(232,240,246,0.92)';
  ctx.fillRect(PAUSE_BTN.x - 8, PAUSE_BTN.y - 9, 5.5, 18);
  ctx.fillRect(PAUSE_BTN.x + 2.5, PAUSE_BTN.y - 9, 5.5, 18);
  ctx.restore();
  // v46：右上音乐开关小圆钮（随时可停）
  ctx.save();
  ctx.beginPath(); ctx.arc(MUSIC_BTN.x, MUSIC_BTN.y, MUSIC_BTN.r, 0, TAU);
  ctx.fillStyle = 'rgba(8,16,28,0.55)'; ctx.fill();
  ctx.strokeStyle = 'rgba(232,240,246,0.55)'; ctx.lineWidth = 1.4; ctx.stroke();
  ctx.fillStyle = musicOn ? '#ffd76a' : 'rgba(200,210,220,0.6)';
  ctx.font = 'bold 15px sans-serif'; ctx.textAlign = 'center';
  ctx.fillText('♪', MUSIC_BTN.x, MUSIC_BTN.y + 5);
  if (!musicOn){ ctx.strokeStyle = '#ff7a6e'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(MUSIC_BTN.x - 8, MUSIC_BTN.y + 8); ctx.lineTo(MUSIC_BTN.x + 8, MUSIC_BTN.y - 8); ctx.stroke(); }
  ctx.restore();
}
let lastTs = 0, frameErrors = 0, lastErrAt = -1e9, __ftAcc = 0, __ftN = 0;
function loop(ts){
  try{
    // v44 自适应分辨率：帧时持续 >19ms 就逐级降渲染倍率保帧率（只降不升，切后台的大间隔不计）
    if (lastTs){ const raw = ts - lastTs; if (raw < 100){ __ftAcc += raw; __ftN++;
      if (__ftN >= 90){ const avg = __ftAcc / __ftN; __ftAcc = 0; __ftN = 0;
        if (avg > 19 && DPR > 1){ DPR = DPR > 1.9 ? 1.5 : (DPR > 1.4 ? 1.25 : 1); cv.width = W * DPR; cv.height = H * DPR; } } } }
    const dt = Math.min(0.033, (ts - lastTs)/1000 || 0.016);
    lastTs = ts;
    update(dt);
    render();
    // 按时间窗口衰减异常计数，间歇性异常不会被「成功一帧就清零」掩盖
    if (G.t - lastErrAt > 1.5) frameErrors = 0;
  }catch(err){
    frameErrors++; lastErrAt = G.t;
    if (frameErrors <= 3) console.error('[frame]', err);
    // 异常帧先做轻量限长，避免半更新状态逐帧累积
    if (parts.length > 340) parts.length = 340;
    if (bullets.length > 420) bullets.length = 420;
    if (frameErrors >= 8){
      // 自愈：只清空可疑实体，保留 BOSS 与关卡进度，
      // 否则长局中一次渲染异常会表现为「BOSS 突然消失 / 像是自动退出」。
      ebs = []; foes = []; grounds = []; wrecks = []; decals = []; allies = [];
      bullets = []; parts = []; texts = []; beams = [];
      if (G.boss && G.boss.state==='fight'){
        const b = G.boss;
        b.beamTele = null; b.beamOn = null;
        b.t1 = Math.max(b.t1||0, 1.2); b.t2 = Math.max(b.t2||0, 1.8); b.t3 = Math.max(b.t3||0, 2.4);
      }
      if (['play','boss','warn','title','over'].indexOf(G.state) < 0) G.state = 'play';
      P.invUntil = Math.max(P.invUntil, G.t + 1.0);
      G.lastFrameError = String(err && err.message || err);
      frameErrors = 0;
      console.warn('[frame] 自愈完成：已保留 BOSS 与关卡进度');
    }
  }finally{
    requestAnimationFrame(loop);   // 永远调度下一帧，游戏不会停死
  }
}
initTerrain();
refreshSaveInfo();
requestAnimationFrame(loop);

/* ===== 部署版开局门禁：未激活不得开始（本地 file:// 母本不设卡） ===== */
function licGate(){
  if (location.protocol === 'file:') return true;
  if (LIC.code) return true;
  openLicBox('请先输入授权码，激活后才能开始游戏。');
  return false;
}
function startGame(){ if (!licGate()) return; startGameCore(); }
function continueGame(){ if (!licGate()) return; continueGameCore(); }
function loadGame(){ if (!licGate()) return false; return loadGameCore.apply(null, arguments); }
