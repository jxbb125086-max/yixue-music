<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>实验打飞机 · 授权门禁复刻</title>
<style>
  html,body{margin:0;padding:0;background:#05070c;height:100%;overflow:hidden}
  #wrap{display:flex;align-items:flex-start;justify-content:center;height:100%}
  canvas{background:#000;display:block;touch-action:none}
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="480" height="720"></canvas></div>
<script>
'use strict';
const cv = document.getElementById('game'), ctx = cv.getContext('2d');
const W = 480, H = 720, TAU = Math.PI * 2;
// ===== 授权模块（与正式部署版同一套逻辑：开局门禁 + 服务器激活 + 管理员同步） =====
const SLIC_KEY = 'kongtest_v1_slic';
let SLIC = { code: '', token: '', admin: false, deviceId: '' };
try {
  const s = JSON.parse(localStorage.getItem(SLIC_KEY) || 'null');
  if (s && typeof s === 'object') SLIC = Object.assign(SLIC, s);
} catch (e) {}
if (!SLIC.deviceId) SLIC.deviceId = 'dev-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8);
function slicSave() { try { localStorage.setItem(SLIC_KEY, JSON.stringify(SLIC)); } catch (e) {} }
slicSave();
async function licActivate(code) {
  const r = await fetch('/api/activate', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ code: String(code || '').trim().toUpperCase(), deviceId: SLIC.deviceId }) });
  const d = await r.json().catch(() => ({}));
  if (r.ok && d.ok) {
    SLIC.code = String(code || '').trim().toUpperCase(); SLIC.token = d.token || ''; SLIC.admin = !!d.admin; slicSave();
    return { ok: true, admin: SLIC.admin };
  }
  return { ok: false, err: d.err || 'NET' };
}
function openLicBox(note) {
  let box = document.getElementById('licBox');
  if (!box) {
    box = document.createElement('div'); box.id = 'licBox';
    box.style.cssText = 'position:fixed;inset:0;background:rgba(2,6,12,.72);display:flex;align-items:center;justify-content:center;z-index:99;font-family:sans-serif';
    box.innerHTML = '<div style="width:320px;max-width:88vw;background:#0b1524;border:1px solid rgba(255,215,106,.45);border-radius:14px;padding:20px 18px;color:#e8eef7">'
      + '<div style="font-size:17px;font-weight:700;margin-bottom:6px">输入授权码</div>'
      + '<div id="licMsg" style="font-size:12.5px;color:#9fb4cc;min-height:18px;margin-bottom:10px"></div>'
      + '<input id="licIn" maxlength="32" autocomplete="off" style="width:100%;box-sizing:border-box;background:#060d18;border:1px solid rgba(160,190,230,.35);border-radius:8px;color:#fff;font-size:17px;letter-spacing:2px;padding:10px 12px;text-transform:uppercase" placeholder="8 位授权码">'
      + '<div style="display:flex;gap:10px;margin-top:14px">'
      + '<button id="licOk" style="flex:1;background:linear-gradient(180deg,#ffe9a8,#e8b93e);border:0;border-radius:9px;color:#231a04;font-size:15px;font-weight:700;padding:11px 0;cursor:pointer">激活</button>'
      + '<button id="licCancel" style="flex:1;background:rgba(140,170,210,.14);border:1px solid rgba(160,190,230,.3);border-radius:9px;color:#cfe0f2;font-size:15px;padding:11px 0;cursor:pointer">取消</button>'
      + '</div></div>';
    document.body.appendChild(box);
    const msg = t => { box.querySelector('#licMsg').textContent = t || ''; };
    box.querySelector('#licCancel').onclick = () => { box.style.display = 'none'; };
    box.querySelector('#licOk').onclick = async () => {
      const v = box.querySelector('#licIn').value.trim();
      if (!v) { msg('请先输入授权码'); return; }
      msg('正在验证…');
      try {
        const res = await licActivate(v);
        if (res.ok) { box.style.display = 'none'; draw(); }
        else msg(res.err === 'NO_CODE' ? '授权码不存在，请核对后重试'
          : res.err === 'FROZEN' ? '该码已被冻结，请联系卖家'
          : res.err === 'RATE_LIMIT' ? '尝试过于频繁，请稍后再试'
          : res.err === 'NO_DEVICE' ? '设备标识异常，请刷新页面重试'
          : '验证失败：' + res.err);
      } catch (e) { msg('网络异常，验证失败'); }
    };
  }
  box.style.display = 'flex';
  const m = box.querySelector('#licMsg'); if (m) m.textContent = note || '';
  const inp = box.querySelector('#licIn'); if (inp) { inp.value = ''; setTimeout(() => inp.focus(), 30); }
}
function licGate() {
  if (location.protocol === 'file:') return true;
  if (SLIC.code) return true;
  openLicBox('请先输入授权码，激活后才能开始游戏。');
  return false;
}
if (SLIC.code && location.protocol !== 'file:') { licActivate(SLIC.code).catch(() => {}); }  // 静默复验，失败保留本地状态
function isAdmin() { return !!SLIC.admin; }

// ===== 极简打飞机：黑底 · 左右移动 · 无限 =====
const G = { state: 'title', t: 0, score: 0, lives: 3, elapsed: 0, fireT: 0, spawnT: 0, invulnT: 0, shake: 0 };
const P = { x: W / 2, y: 636 };
let bullets = [], foes = [], stars = [];
for (let i = 0; i < 90; i++) stars.push({ x: Math.random() * W, y: Math.random() * H, s: Math.random() * 1.8 + 0.4, v: Math.random() * 40 + 18 });
const keys = {};
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (G.state === 'over' && e.code === 'Enter') { isAdmin() ? continueRun() : restartRun(); }
  if (['ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
});
addEventListener('keyup', e => { keys[e.code] = false; });
function startRun() {
  if (!licGate()) return;
  G.state = 'play'; G.score = 0; G.lives = 3; G.elapsed = 0; G.fireT = 0; G.spawnT = 0.4; G.invulnT = 0;
  bullets = []; foes = []; P.x = W / 2;
}
function continueRun() {  // 管理员专属：阵亡续命（分数保留、血回满）—— 与正式版管理员实现同构
  if (!isAdmin()) return;
  G.state = 'play'; G.lives = 3; G.invulnT = 1.5; bullets = []; foes = [];
}
function restartRun() { G.state = 'play'; G.score = 0; G.lives = 3; G.elapsed = 0; bullets = []; foes = []; P.x = W / 2; }
function gameOver() { G.state = 'over'; }
function update(dt) {
  for (const st of stars) { st.y += st.v * dt * (G.state === 'play' ? 2.2 : 1); if (st.y > H) { st.y = -2; st.x = Math.random() * W; } }
  if (G.state !== 'play') return;
  G.elapsed += dt;
  const sp = 400;
  if (keys['ArrowLeft'] || keys['KeyA']) P.x -= sp * dt;
  if (keys['ArrowRight'] || keys['KeyD']) P.x += sp * dt;
  P.x = Math.max(22, Math.min(W - 22, P.x));
  G.fireT -= dt;
  if (G.fireT <= 0) { G.fireT = 0.16; bullets.push({ x: P.x, y: P.y - 24 }); }
  G.spawnT -= dt;
  const spawnInt = Math.max(0.34, 0.78 - G.elapsed * 0.004);
  if (G.spawnT <= 0) { G.spawnT = spawnInt; foes.push({ x: 24 + Math.random() * (W - 48), y: -24, v: 120 + Math.random() * 90, hp: 1 }); }
  for (const b of bullets) b.y -= 580 * dt;
  bullets = bullets.filter(b => b.y > -12);
  for (const f of foes) f.y += f.v * dt;
  for (const f of foes) for (const b of bullets) {
    if (!f.dead && !b.dead && Math.abs(f.x - b.x) < 18 && Math.abs(f.y - b.y) < 20) { f.dead = true; b.dead = true; G.score += 100; }
  }
  bullets = bullets.filter(b => !b.dead);
  if (G.invulnT > 0) G.invulnT -= dt;
  for (const f of foes) {
    if (!f.dead && G.invulnT <= 0 && Math.abs(f.x - P.x) < 26 && Math.abs(f.y - P.y) < 30) {
      f.dead = true; G.lives--; G.invulnT = 1.3; G.shake = 7;
      if (G.lives <= 0) { gameOver(); return; }
    }
  }
  foes = foes.filter(f => !f.dead && f.y < H + 30);
  if (G.shake > 0) G.shake = Math.max(0, G.shake - dt * 16);
}
function ship(x, y, col, flip) {
  ctx.save(); ctx.translate(x, y); if (flip) ctx.rotate(Math.PI);
  ctx.beginPath(); ctx.moveTo(0, -18); ctx.lineTo(13, 12); ctx.lineTo(5, 8); ctx.lineTo(0, 13); ctx.lineTo(-5, 8); ctx.lineTo(-13, 12); ctx.closePath();
  ctx.fillStyle = col; ctx.fill(); ctx.restore();
}
function btn(x, y, w, h, label, gold) {
  ctx.save();
  ctx.beginPath(); ctx.roundRect(x, y, w, h, 10);
  ctx.fillStyle = gold ? 'rgba(232,185,62,.92)' : 'rgba(20,34,54,.92)'; ctx.fill();
  ctx.strokeStyle = 'rgba(255,215,106,.5)'; ctx.lineWidth = 1; ctx.stroke();
  ctx.fillStyle = gold ? '#231a04' : '#dbe7f5'; ctx.font = 'bold 17px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(label, x + w / 2, y + h / 2 + 1); ctx.restore();
}
function draw() {
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#aFC4de';
  for (const st of stars) { ctx.globalAlpha = 0.25 + st.s * 0.3; ctx.fillRect(st.x, st.y, st.s, st.s); }
  ctx.globalAlpha = 1;
  if (G.state === 'title') {
    ctx.textAlign = 'center'; ctx.fillStyle = '#ffd76a'; ctx.font = 'bold 44px sans-serif';
    ctx.fillText('实验打飞机', W / 2, 210);
    ctx.fillStyle = '#9fb4cc'; ctx.font = '14px sans-serif';
    ctx.fillText('授权门禁复刻实验 · 黑底无限版', W / 2, 244);
    ctx.fillText('← → / A D / 手指拖动 左右移动 · 自动开火', W / 2, 272);
    btn(84, 420, 312, 52, '开始游戏', true);
    btn(316, 648, 150, 44, '授权码', false);
    ctx.fillStyle = isAdmin() ? '#ffd76a' : (SLIC.code ? '#7dffb0' : 'rgba(180,195,215,.55)');
    ctx.font = '12px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(isAdmin() ? '管理员 ✓' : (SLIC.code ? '已激活 ✓' : '未验证'), 391, 640);
    return;
  }
  const ox = G.shake ? (Math.random() - 0.5) * G.shake : 0, oy = G.shake ? (Math.random() - 0.5) * G.shake : 0;
  ctx.save(); ctx.translate(ox, oy);
  for (const b of bullets) { ctx.fillStyle = '#ffe27a'; ctx.fillRect(b.x - 2, b.y - 8, 4, 12); }
  for (const f of foes) ship(f.x, f.y, '#e5534b', true);
  if (!(G.invulnT > 0 && Math.floor(G.t * 14) % 2)) ship(P.x, P.y, '#57c8ff', false);
  ctx.restore();
  ctx.fillStyle = '#dbe7f5'; ctx.font = 'bold 15px sans-serif'; ctx.textAlign = 'left';
  ctx.fillText('分数 ' + G.score, 14, 26);
  ctx.textAlign = 'right'; ctx.fillText('❤ '.repeat(Math.max(0, G.lives)), W - 14, 26);
  if (isAdmin()) { ctx.fillStyle = '#ffd76a'; ctx.font = '11px sans-serif'; ctx.fillText('管理员', W - 14, 44); }
  if (G.state === 'over') {
    ctx.fillStyle = 'rgba(2,6,12,.66)'; ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center'; ctx.fillStyle = '#ff8a7a'; ctx.font = 'bold 36px sans-serif';
    ctx.fillText('被击毁了', W / 2, 300);
    ctx.fillStyle = '#dbe7f5'; ctx.font = '16px sans-serif';
    ctx.fillText('本局分数 ' + G.score, W / 2, 340);
    if (isAdmin()) {
      btn(84, 400, 312, 50, '继续出击（管理员续命）', true);
      btn(84, 466, 312, 50, '从头开始', false);
    } else {
      btn(84, 400, 312, 50, '从头开始', true);
      ctx.fillStyle = 'rgba(170,185,205,.6)'; ctx.font = '12px sans-serif';
      ctx.fillText('普通玩家阵亡后只能重开 · 管理员可续命', W / 2, 486);
    }
  }
}
let last = 0;
function loop(ts) {
  const dt = Math.min(0.05, (ts - last) / 1000 || 0.016); last = ts; G.t += dt;
  update(dt); draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
// ===== 点击 / 触摸 =====
let dragging = false;
function toGame(e) {
  const r = cv.getBoundingClientRect();
  const cx = (e.touches ? e.touches[0].clientX : e.clientX), cy = (e.touches ? e.touches[0].clientY : e.clientY);
  return { x: (cx - r.left) * W / r.width, y: (cy - r.top) * H / r.height };
}
function inBtn(p, x, y, w, h) { return p.x >= x && p.x <= x + w && p.y >= y && p.y <= y + h; }
cv.addEventListener('pointerdown', e => {
  const p = toGame(e);
  if (G.state === 'title') {
    if (inBtn(p, 84, 420, 312, 52)) { startRun(); return; }
    if (inBtn(p, 316, 648, 150, 44)) { openLicBox(); return; }
  } else if (G.state === 'over') {
    if (isAdmin() && inBtn(p, 84, 400, 312, 50)) { continueRun(); return; }
    if (inBtn(p, 84, isAdmin() ? 466 : 400, 312, 50)) { restartRun(); return; }
  } else if (G.state === 'play') { dragging = true; P.x = Math.max(22, Math.min(W - 22, p.x)); }
});
cv.addEventListener('pointermove', e => { if (dragging && G.state === 'play') { const p = toGame(e); P.x = Math.max(22, Math.min(W - 22, p.x)); } });
addEventListener('pointerup', () => { dragging = false; });
function fit() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  cv.style.width = (W * s | 0) + 'px'; cv.style.height = (H * s | 0) + 'px';
}
addEventListener('resize', fit); fit();
window.G = G; window.P = P; window.SLIC = SLIC;
</script>
</body>
</html>
