  </div>

<script>
'use strict';
const ADMIN_CODE = 'rush1980';  // 部署测试用：服务器校验优先，无服务器时本地校验此码（与空鸢同款）
const cv = document.getElementById('game'), ctx = cv.getContext('2d');
const W = 480, H = 720;
// ===== 常量：底线网格 =====
const FLOOR_Y = 706; // 地面：漏掉的物品在这里开始堆积
const BULLET_V = 620, SHOT_MAX_GAP = 0.5;
// ===== 音效（WebAudio 合成，无外部文件） =====
let AC = null, muted = false;
try { muted = localStorage.getItem('jieya_muted') === '1'; } catch (e) {}
function audio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function noiseBuf(dur) {
  const ac = audio(); if (!ac) return null;
  const b = ac.createBuffer(1, Math.max(1, ac.sampleRate * dur | 0), ac.sampleRate);
  const d = b.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  return b;
}
function playNoise(dur, type, freq, q, gain, sweepTo) {
  if (muted) return; const ac = audio(); if (!ac) return;
  const src = ac.createBufferSource(); src.buffer = noiseBuf(dur);
  const f = ac.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
  if (sweepTo) f.frequency.exponentialRampToValueAtTime(sweepTo, ac.currentTime + dur);
  const g = ac.createGain();
  g.gain.setValueAtTime(gain, ac.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + dur);
  src.connect(f); f.connect(g); g.connect(ac.destination);
  src.start(); src.stop(ac.currentTime + dur);
}
function playTone(type, f0, f1, dur, gain, delay) {
  if (muted) return; const ac = audio(); if (!ac) return;
  const t = ac.currentTime + (delay || 0);
  const o = ac.createOscillator(); o.type = type;
  o.frequency.setValueAtTime(f0, t);
  if (f1) o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
  const g = ac.createGain();
  g.gain.setValueAtTime(gain, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + dur);
}
function sfxHit() { playNoise(0.05, 'bandpass', 1800, 1.2, 0.10); playTone('square', 300, 140, 0.05, 0.05); }
function sfxBreak(mat) {
  if (mat === 'glass') { playNoise(0.20, 'bandpass', 2600, 0.9, 0.30); playTone('sine', 3300, 2400, 0.12, 0.10); playTone('sine', 4400, 3100, 0.16, 0.08, 0.03); }
  else if (mat === 'paper') { playNoise(0.13, 'lowpass', 750, 0.6, 0.24); }
  else { playNoise(0.13, 'bandpass', 1200, 1.0, 0.26); playTone('square', 880, 320, 0.09, 0.07); }
}
function sfxBoom() { playNoise(0.55, 'lowpass', 900, 0.5, 0.5, 110); playTone('sine', 170, 38, 0.5, 0.4); sfxBreak('glass'); }
function sfxHurt() { playTone('sawtooth', 230, 85, 0.20, 0.18); playNoise(0.15, 'bandpass', 900, 1, 0.16); }
function sfxLand() { playTone('sine', 150, 70, 0.10, 0.10); }
function sfxShoot() {  // 每种机体的子弹声都不一样
  const j = Math.random() * 60 - 30;
  if (shipId === 'banana') { playTone('sine', 520 + j, 110, 0.10, 0.13); playNoise(0.05, 'lowpass', 800, 0.7, 0.06, 200); }  // 🍌：啵——
  else if (shipId === 'chicken') playTone('square', 1060 + j, 1020, 0.085, 0.06);  // 🐔：哔——
  else if (shipId === 'finger') { playNoise(0.11, 'lowpass', 520, 0.7, 0.15, 110); playTone('sine', 150, 52, 0.09, 0.10); }  // 🖕：噗
}
function sfxCatch() { playTone('sine', 740, 1180, 0.07, 0.09); }
function sfxTier() { playTone('sine', 520, 0, 0.09, 0.11); playTone('sine', 780, 0, 0.12, 0.11, 0.08); }
function sfxLucky() { playTone('sine', 660, 0, 0.09, 0.10); playTone('sine', 880, 0, 0.09, 0.10, 0.07); playTone('sine', 1320, 0, 0.14, 0.10, 0.14); }
// ===== 敌方物件：10 种日常烦恼 =====
const TYPES = [
  { id: 'cup',      name: '杯子',   mat: 'glass', col: '#e8e3d8' },
  { id: 'notebook', name: '作业本', mat: 'paper', col: '#f2ead8' },
  { id: 'keyboard', name: '键盘',   mat: 'hard',  col: '#cfd4da' },
  { id: 'badge',    name: '工牌',   mat: 'paper', col: '#7fb2e5' },
  { id: 'monitor',  name: '电脑',   mat: 'glass', col: '#9fd8e8' },
  { id: 'alarm',    name: '闹钟',   mat: 'hard',  col: '#e5534b' },
  { id: 'phone',    name: '手机',   mat: 'hard',  col: '#22262b' },
  { id: 'briefcase',name: '公文包', mat: 'hard',  col: '#8a5a33' },
  { id: 'calendar', name: '日历',   mat: 'paper', col: '#f5f2ea' },
  { id: 'bulb',     name: '灯泡',   mat: 'glass', col: '#ffd76a' },
  { id: 'tel',      name: '电话',   mat: 'hard',  col: '#d94f3d' },
  { id: 'bill',     name: '缴费单', mat: 'paper', col: '#f2ead8' },
  { id: 'poop',     name: '便便',   mat: 'paper', col: '#8a5a33' },
  { id: 'sock',     name: '臭袜子', mat: 'paper', col: '#b8c4ce' },
  { id: 'shoe',     name: '鞋',     mat: 'hard',  col: '#d94f3d' },
  { id: 'box',      name: '快递盒', mat: 'paper', col: '#c9a15a' },
];
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
const ITEM_EMOJI = { cup: '☕', notebook: '📓', keyboard: '⌨️', badge: '🪪', monitor: '🖥️', alarm: '⏰', phone: '📱', briefcase: '💼', calendar: '📅', bulb: '💡', tel: '☎️', bill: '📃', lucky: '😊', poop: '💩', sock: '🧦', shoe: '👟', box: '📦', bomb: '💣', firecracker: '🧨' };
function drawItem(id, s, emoOvr) {
  const u = s / 40; // 以 40px 为基本单位缩放
  ctx.save(); ctx.scale(u, u);
  const EMO = emoOvr || ITEM_EMOJI[id];
  if (EMO) {  // 系统 emoji 本尊出演
    ctx.font = '33px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(EMO, 0, 2);
    ctx.restore(); return;
  }
  ctx.lineWidth = 1.6; ctx.strokeStyle = 'rgba(20,24,30,.55)';
  if (id === 'cup') {
    ctx.fillStyle = '#e8e3d8'; rr(-13, -9, 25, 21, 3); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.arc(15.5, 1, 6.5, -1.2, 1.2); ctx.stroke();
    ctx.fillStyle = '#8a5a33'; ctx.beginPath(); ctx.ellipse(0.5, -9, 12, 3, 0, 0, Math.PI * 2); ctx.fill();
  } else if (id === 'notebook') {
    ctx.fillStyle = '#f2ead8'; rr(-15, -18, 30, 36, 2); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = '#c33'; ctx.beginPath(); ctx.moveTo(-9, -18); ctx.lineTo(-9, 18); ctx.stroke();
    ctx.strokeStyle = 'rgba(70,110,180,.6)';
    for (let i = -10; i <= 12; i += 7) { ctx.beginPath(); ctx.moveTo(-6, i); ctx.lineTo(12, i); ctx.stroke(); }
    ctx.fillStyle = '#3a5a9c'; ctx.font = 'bold 9px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('作业', 3, -12);
  } else if (id === 'keyboard') {
    ctx.fillStyle = '#cfd4da'; rr(-19, -11, 38, 22, 4); ctx.fill(); ctx.stroke();
    ctx.fillStyle = 'rgba(60,70,85,.75)';
    for (let r = 0; r < 2; r++) for (let c = 0; c < 6; c++) ctx.fillRect(-15 + c * 5.4, -7 + r * 6, 3.6, 3.4);
    ctx.fillRect(-10, 6, 20, 3.2);
  } else if (id === 'badge') {
    ctx.strokeStyle = '#5a87b8'; ctx.beginPath(); ctx.moveTo(0, -20); ctx.lineTo(-6, -12); ctx.moveTo(0, -20); ctx.lineTo(6, -12); ctx.stroke();
    ctx.fillStyle = '#7fb2e5'; rr(-11, -13, 22, 31, 3); ctx.fill(); ctx.strokeStyle = 'rgba(20,24,30,.55)'; ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(0, -4, 4.6, 0, Math.PI * 2); ctx.fill();
    ctx.fillRect(-6, 5, 12, 2.4); ctx.fillRect(-6, 10, 12, 2.4);
  } else if (id === 'monitor') {
    ctx.fillStyle = '#35424f'; rr(-18, -15, 36, 26, 3); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#9fd8e8'; ctx.fillRect(-15, -12, 30, 20);
    ctx.fillStyle = 'rgba(255,255,255,.5)'; ctx.beginPath(); ctx.moveTo(-15, 8); ctx.lineTo(2, -12); ctx.lineTo(10, -12); ctx.lineTo(-6, 8); ctx.fill();
    ctx.fillStyle = '#35424f'; ctx.fillRect(-2, 11, 4, 5); ctx.fillRect(-9, 16, 18, 3);
  } else if (id === 'alarm') {
    ctx.fillStyle = '#e5534b';
    ctx.beginPath(); ctx.arc(-11, -12, 5, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(11, -12, 5, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(0, 0, 14, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(0, 0, 11.5, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#333'; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -7); ctx.moveTo(0, 0); ctx.lineTo(5, 2); ctx.stroke();
    ctx.strokeStyle = 'rgba(20,24,30,.55)'; ctx.beginPath(); ctx.moveTo(-8, 12); ctx.lineTo(-11, 17); ctx.moveTo(8, 12); ctx.lineTo(11, 17); ctx.stroke();
  } else if (id === 'phone') {
    ctx.fillStyle = '#22262b'; rr(-10, -18, 20, 36, 4); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#bfe3ea'; ctx.fillRect(-7.5, -14, 15, 25);
    ctx.fillStyle = 'rgba(255,255,255,.45)'; ctx.beginPath(); ctx.moveTo(-7.5, 4); ctx.lineTo(4, -14); ctx.lineTo(7.5, -14); ctx.lineTo(-3, 4); ctx.fill();
    ctx.fillStyle = '#888'; ctx.beginPath(); ctx.arc(0, 14.5, 2, 0, Math.PI * 2); ctx.fill();
  } else if (id === 'briefcase') {
    ctx.fillStyle = '#8a5a33'; rr(-18, -11, 36, 24, 3); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = '#5d3c1f'; ctx.beginPath(); ctx.moveTo(-6, -11); ctx.lineTo(-6, -16); ctx.lineTo(6, -16); ctx.lineTo(6, -11); ctx.stroke();
    ctx.fillStyle = '#c9a15a'; ctx.fillRect(-18, -1, 36, 4); ctx.fillRect(-3.5, -2.5, 7, 7);
  } else if (id === 'calendar') {
    ctx.fillStyle = '#f5f2ea'; rr(-16, -15, 32, 31, 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#e5534b'; ctx.fillRect(-16, -15, 32, 8);
    ctx.fillStyle = '#888'; ctx.beginPath(); ctx.arc(-8, -15, 2.2, 0, Math.PI * 2); ctx.arc(8, -15, 2.2, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(70,80,95,.7)';
    for (let r = 0; r < 3; r++) for (let c = 0; c < 4; c++) ctx.fillRect(-11 + c * 7, -2 + r * 6, 3.6, 3.2);
    ctx.strokeStyle = '#e5534b'; ctx.beginPath(); ctx.arc(3.5, 9.5, 4, 0, Math.PI * 2); ctx.stroke();
  } else if (id === 'lucky') {
    ctx.fillStyle = '#ffd83c'; ctx.beginPath(); ctx.arc(0, 0, 16, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#33302a';
    ctx.beginPath(); ctx.arc(-5.5, -3, 1.9, 0, Math.PI * 2); ctx.arc(5.5, -3, 1.9, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#33302a'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(0, 2.5, 8, 0.25, Math.PI - 0.25); ctx.stroke();
    ctx.fillStyle = 'rgba(255,138,176,.65)';
    ctx.beginPath(); ctx.arc(-10.5, 3.5, 3.2, 0, Math.PI * 2); ctx.arc(10.5, 3.5, 3.2, 0, Math.PI * 2); ctx.fill();
  } else if (id === 'tel') {
    // 老式座机：听筒 + 机身 + 转盘
    ctx.fillStyle = '#a83a2c'; ctx.beginPath(); ctx.roundRect(-17, -11, 34, 8, 4); ctx.fill();
    ctx.fillStyle = '#d94f3d';
    ctx.beginPath(); ctx.arc(-16, -7, 4.6, 0, Math.PI * 2); ctx.arc(16, -7, 4.6, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#d94f3d'; ctx.beginPath(); ctx.roundRect(-15, -1, 30, 15, 3); ctx.fill();
    ctx.fillStyle = '#f7ead0'; ctx.beginPath(); ctx.arc(0, 6.5, 5.4, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#a83a2c'; ctx.beginPath(); ctx.arc(0, 6.5, 1.8, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(247,234,208,.8)';
    for (let i = 0; i < 5; i++) { const a = i / 5 * Math.PI * 2; ctx.beginPath(); ctx.arc(Math.cos(a) * 3.6, 6.5 + Math.sin(a) * 3.6, 0.85, 0, Math.PI * 2); ctx.fill(); }
  } else if (id === 'bill') {
    // 缴费单：白纸 + 红抬头 + 红章 + 条码
    ctx.fillStyle = '#f2ead8'; ctx.fillRect(-13, -17, 26, 34); ctx.strokeRect(-13, -17, 26, 34);
    ctx.fillStyle = '#e5534b'; ctx.fillRect(-13, -17, 26, 6.5);
    ctx.fillStyle = '#9a958a';
    ctx.fillRect(-9.5, -6.5, 19, 2.1); ctx.fillRect(-9.5, -2, 15, 2.1); ctx.fillRect(-9.5, 2.5, 17.5, 2.1);
    ctx.strokeStyle = 'rgba(229,83,75,.85)'; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.arc(6.5, 8, 5.4, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = 'rgba(229,83,75,.85)'; ctx.beginPath(); ctx.arc(6.5, 8, 1.5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#33302a';
    let bx = -10; for (const w2 of [1.6, 1, 2.2, 1, 1.4, 2.4, 1, 1.6]) { ctx.fillRect(bx, 11.5, w2, 4); bx += w2 + 1.1; }
  } else if (id === 'bulb') {
    ctx.fillStyle = 'rgba(255,215,106,.28)'; ctx.beginPath(); ctx.arc(0, -3, 15, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ffd76a'; ctx.beginPath(); ctx.arc(0, -3, 11.5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = '#b8860b'; ctx.beginPath(); ctx.moveTo(-3, -3); ctx.lineTo(-1, 3); ctx.lineTo(1, -3); ctx.lineTo(3, 3); ctx.stroke();
    ctx.fillStyle = '#9aa2ab'; ctx.fillRect(-4.5, 9, 9, 3); ctx.fillRect(-4.5, 13, 9, 3);
  }
  ctx.restore();
}
function drawCracks(hp, maxHp, s) {
  if (hp >= maxHp) return;
  ctx.save(); ctx.strokeStyle = 'rgba(15,18,22,.6)'; ctx.lineWidth = 1.4;
  const r = s / 2;
  ctx.beginPath(); ctx.moveTo(-r * 0.5, -r * 0.7); ctx.lineTo(-r * 0.1, -r * 0.1); ctx.lineTo(-r * 0.4, r * 0.4); ctx.stroke();
  if (maxHp - hp >= 2) { ctx.beginPath(); ctx.moveTo(r * 0.6, -r * 0.5); ctx.lineTo(r * 0.15, r * 0.05); ctx.lineTo(r * 0.5, r * 0.6); ctx.stroke(); }
  ctx.restore();
}
// ===== 我方机体：4 种可选样子 =====
const SHIPS = [
  { id: 'finger', name: '🖕' },
  { id: 'banana', name: '🍌' },
  { id: 'chicken', name: '🐔' },
];
let shipId = 'finger';
try { const s = localStorage.getItem('jieya_ship'); if (s && SHIPS.some(x => x.id === s)) shipId = s; } catch (e) {}
const SHIP_EMOJI = { finger: '🖕', banana: '🍌', chicken: '🐔' };
const SHIP_BULLET = { finger: '🖕', banana: '🍌', chicken: '🥚' };
function drawShip(id, t, px) {
  ctx.save();
  const EM = SHIP_EMOJI[id];
  if (EM) {  // 三种机体全部系统 emoji 本尊
    ctx.font = (px || 40) + 'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(EM, 0, 3);
    ctx.restore(); return;
  }
  if (id === 'paper') {
    ctx.fillStyle = '#f4f7fa'; ctx.beginPath(); ctx.moveTo(0, -19); ctx.lineTo(15, 13); ctx.lineTo(0, 6); ctx.lineTo(-15, 13); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#c9d4de'; ctx.beginPath(); ctx.moveTo(0, -19); ctx.lineTo(0, 6); ctx.lineTo(-15, 13); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(90,110,130,.7)'; ctx.beginPath(); ctx.moveTo(0, -19); ctx.lineTo(0, 8); ctx.stroke();
  } else if (id === 'rocket') {
    const fl = 5 + Math.sin(t * 31) * 2.4;
    ctx.fillStyle = '#ff9a3c'; ctx.beginPath(); ctx.moveTo(-4, 15); ctx.lineTo(0, 15 + fl + 5); ctx.lineTo(4, 15); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#e5534b'; ctx.beginPath(); ctx.moveTo(-8, 6); ctx.lineTo(-15, 16); ctx.lineTo(-8, 16); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(8, 6); ctx.lineTo(15, 16); ctx.lineTo(8, 16); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#eef2f5'; ctx.beginPath(); ctx.ellipse(0, 0, 8.5, 17, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#e5534b'; ctx.beginPath(); ctx.ellipse(0, -12, 8.5, 6, 0, Math.PI, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#57c8ff'; ctx.beginPath(); ctx.arc(0, -3, 4, 0, Math.PI * 2); ctx.fill();
  } else if (id === 'chicken') {
    // 尖叫鸡（原版橡胶鸡）：长脖子、张到最大的喙、红冠、垂着的两条腿、尾羽
    ctx.fillStyle = '#f5c81e';  // 尾羽
    ctx.beginPath(); ctx.moveTo(-3, 10); ctx.lineTo(-11, 20); ctx.lineTo(-4.5, 20.5); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(0, 11); ctx.lineTo(-1.5, 21.5); ctx.lineTo(3.5, 21); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(3, 10); ctx.lineTo(10, 19); ctx.lineTo(4.5, 20.5); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#e8a90c'; ctx.lineWidth = 1.8;  // 两条垂腿 + 脚趾
    ctx.beginPath(); ctx.moveTo(-4, 13); ctx.lineTo(-4.5, 19); ctx.moveTo(4.5, 13); ctx.lineTo(5, 19);
    ctx.moveTo(-7, 19.5); ctx.lineTo(-2, 19.5); ctx.moveTo(2.5, 19.5); ctx.lineTo(7.5, 19.5); ctx.stroke();
    ctx.fillStyle = '#ffd83c'; ctx.beginPath(); ctx.ellipse(0, 4, 9.5, 11.5, 0, 0, Math.PI * 2); ctx.fill();   // 身子
    ctx.fillStyle = '#f5c81e'; ctx.beginPath(); ctx.ellipse(-4.5, 4.5, 4.4, 8, 0.35, 0, Math.PI * 2); ctx.fill();  // 翅膀
    ctx.fillStyle = '#ffd83c'; ctx.beginPath(); ctx.roundRect(-3.4, -8, 6.8, 10, 3.4); ctx.fill();            // 长脖子
    ctx.beginPath(); ctx.arc(0, -11.5, 6.8, 0, Math.PI * 2); ctx.fill();                                        // 头
    ctx.fillStyle = '#e5534b';                                                                                  // 鸡冠

    f.y += f.vy * dt;
    f.rot += f.rotV * dt;  // 被扔进来的旋转感
    if (f.boss) {  // BOSS 左右缓缓飘移
      f.x = f.x0 + Math.sin(G.t * 0.38 + f.phase) * 85;
    } else {
      f.x += (f.vx || 0) * dt; f.vx = (f.vx || 0) * Math.exp(-0.55 * dt);
      f.x += Math.sin(G.t * 1.2 + f.phase) * 6 * dt;
      if (f.x < 18) { f.x = 18; f.vx = Math.abs(f.vx) * 0.5; }
      if (f.x > W - 18) { f.x = W - 18; f.vx = -Math.abs(f.vx) * 0.5; }
    }
    if (G.mode === 'catch') {  // 接住判定：落进桶口
      const r = f.size / 2;
      if (!f.dead && f.y + r * 0.4 >= mouthY - 34 && f.y < mouthY + 8 && Math.abs(f.x - B.x) < 54) {
        f.dead = true;
        if (f.type === 'lucky') luckyLandAt(B.x, mouthY - 10);
        else pushPop(B.x + (Math.random() - 0.5) * 30, mouthY - 52, '✨', 19);
        G.caught++; sfxCatch(); checkTier();
        continue;
      }
    }
    if (pileContact(f, f.size / 2)) { convertFoe(f); continue; }
    if (G.mode === 'shoot' && G.invulnT <= 0 && Math.abs(f.x - P.x) < 30 && Math.abs(f.y - P.y) < 34) {
      f.dead = true; shatter(f.x, f.y, f.col, 10, 1); damagePlayer();
    }
  }
  foes = foes.filter(f => !f.dead);
  if (G.mode === 'catch' && pileTop() < 165) G.state = 'over';  // 堆到没地方了
}
// ===== 绘制 =====
const PAUSE_BTN = { x: 428, y: 8, w: 44, h: 36 };
const MUTE_BTN = { x: 378, y: 8, w: 44, h: 36 };
const TITLE_BOXES = [  // 开始界面四框（2×2）：三机体 + 垃圾桶
  { id: 'finger', emoji: '🖕', x: 115, y: 209 },
  { id: 'banana', emoji: '🍌', x: 247, y: 209 },
  { id: 'chicken', emoji: '🐔', x: 115, y: 341 },
  { id: 'bin', emoji: '🗑️', x: 247, y: 341 },
];
const OKC = { x: W / 2, y: 334, r: 40 };  // 👌 在四框正中
function emoji(txt, x, y, px, alpha, rot) {
  ctx.save(); if (alpha !== undefined) ctx.globalAlpha = alpha;
  if (rot) { ctx.translate(x, y); ctx.rotate(rot); x = 0; y = 0; }
  ctx.font = px + 'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(txt, x, y + px * 0.04); ctx.restore();
}
function draw() {
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#afc4de';
  for (const st of stars) { ctx.globalAlpha = 0.22 + st.s * 0.3; ctx.fillRect(st.x, st.y, st.s, st.s); }
  ctx.globalAlpha = 1;

    const unlocked = isAdmin();

      ctx.save(); ctx.beginPath(); ctx.roundRect(b.x, b.y, 118, 118, 18);
      ctx.fillStyle = 'rgba(20,34,54,.92)'; ctx.fill();
      ctx.strokeStyle = unlocked ? '#3ddc74' : '#66707c'; ctx.lineWidth = 2.5; ctx.stroke(); ctx.restore();
      ctx.save();
      if (!unlocked) { try { ctx.filter = 'grayscale(1)'; } catch (e) {} ctx.globalAlpha = 0.55; }
      emoji(b.emoji, b.x + 59, b.y + 59, 64);
      ctx.restore();
    }
    // 👌 在四框正中
    ctx.strokeStyle = unlocked ? '#3ddc74' : '#66707c'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(OKC.x, OKC.y, OKC.r, 0, Math.PI * 2); ctx.stroke();
    ctx.save();
    if (!unlocked) { try { ctx.filter = 'grayscale(0.7)'; } catch (e) {} ctx.globalAlpha = 0.7; }
    emoji('👌', OKC.x, OKC.y, 54);
    ctx.restore();
    if (unlocked) emoji('✅', OKC.x + 34, OKC.y - 34, 22);
    drawMuteBtn();
    return;
  }
  const ox = G.shake ? (Math.random() - 0.5) * G.shake : 0, oy = G.shake ? (Math.random() - 0.5) * G.shake : 0;
  ctx.save(); ctx.translate(ox, oy);
  ctx.strokeStyle = 'rgba(255,255,255,.07)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0, FLOOR_Y + 3); ctx.lineTo(W, FLOOR_Y + 3); ctx.stroke();
  // 垃圾堆积
  for (const it of settled) {
    ctx.save(); ctx.translate(it.x, it.y); ctx.rotate(it.rot); ctx.globalAlpha = 0.92;
    drawItem(it.type, it.r * 2, it.emoji || undefined);
    ctx.restore();
  }
  ctx.globalAlpha = 1;
  // 敌怪（BOSS 无边框无血条；表情/幸运物不画裂纹，靠迸表情反馈）
  for (const f of foes) {
    ctx.save(); ctx.translate(f.x, f.y);
    ctx.save(); ctx.rotate(f.rot); drawItem(f.type, f.size, f.emoji || undefined); ctx.restore();
    if (!f.face && f.type !== 'lucky') drawCracks(f.hp, f.maxHp, f.size);
    ctx.restore();
  }
  // 子弹：按机体配对的 emoji
  for (const b of bullets) emoji(SHIP_BULLET[shipId], b.x, b.y, 19);
  // 碎片
  for (const p of parts) {
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
    ctx.globalAlpha = Math.max(0, 1 - p.life / p.max); ctx.fillStyle = p.col;
    if (p.tri) { ctx.beginPath(); ctx.moveTo(-p.size, p.size); ctx.lineTo(p.size, p.size * 0.6); ctx.lineTo(0, -p.size); ctx.closePath(); ctx.fill(); }
    else ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.7);
    ctx.restore();
  }
  ctx.globalAlpha = 1;
  // 迸出的小表情
  for (const pp of pops) emoji(pp.emoji, pp.x, pp.y, pp.size, Math.max(0, 1 - pp.t / pp.life));
  // 我方：垃圾桶 / 飞机
  if (G.mode === 'catch') {
    emoji('🗑️', B.x, pileTop() - 26, 56);
  } else if (!(G.invulnT > 0 && Math.floor(G.t * 14) % 2)) {
    ctx.save(); ctx.translate(P.x, P.y); drawShip(shipId, G.t, 42); ctx.restore();
  }
  ctx.restore();
  // HUD：只有图标与数字
  if (G.mode === 'shoot') { ctx.fillStyle = '#ff8ab0'; ctx.font = 'bold 16px sans-serif'; ctx.textAlign = 'left'; ctx.fillText('❤ '.repeat(Math.max(0, P.hp)), 12, 27); }
  ctx.fillStyle = '#dbe7f5'; ctx.font = 'bold 25px sans-serif'; ctx.textAlign = 'center';
  ctx.fillText(String(countNow()), W / 2, 32);
  if (G.tier > 0) { ctx.font = 'bold 15px sans-serif'; ctx.textAlign = 'left'; ctx.fillText('⬆️' + G.tier, 12, G.mode === 'shoot' ? 52 : 27); }
  if (!G.paused && G.state === 'play') emoji('⏸️', PAUSE_BTN.x + 22, PAUSE_BTN.y + 19, 24);
  drawMuteBtn();
  // 提速瞬间：大 ⬆️ + 新档位数字
  if (G.tierT > 0) {
    const k = 1 + 0.25 * Math.sin(Math.min(1, (1.15 - G.tierT) / 1.15) * Math.PI);
    emoji('⬆️', W / 2, 300, Math.round(96 * k), Math.min(1, G.tierT / 0.4));
    ctx.fillStyle = '#ffd76a'; ctx.font = 'bold 40px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(String(G.tier), W / 2, 388);
  }
  if (G.paused) {
    ctx.fillStyle = 'rgba(2,6,12,.72)'; ctx.fillRect(0, 0, W, H);
    emoji('⭕', 168, 360, 104);
    emoji('❌', 312, 360, 92);
  }
  if (G.state === 'over') {
    ctx.fillStyle = 'rgba(2,6,12,.72)'; ctx.fillRect(0, 0, W, H);
    emoji('👎', W / 2, 308, 120);
    ctx.fillStyle = '#dbe7f5'; ctx.font = 'bold 34px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(String(countNow()), W / 2, 404);
  }
}
function drawMuteBtn() { emoji(muted ? '🔇' : '🔊', MUTE_BTN.x + 22, MUTE_BTN.y + 19, 21); }
let last = 0;
function loop(ts) {
  const dt = Math.min(0.05, (ts - last) / 1000 || 0.016); last = ts; G.t += dt;
  update(dt); draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
// ===== 点击 / 触摸 =====
const ptr = { active: false, id: null, x: 0, target: 0, off: 0, offY: 0, targetY: 0, vx: 0, lastT: 0 };  // 触控追踪：手指位置/速度/抓取偏移
function toGame(e) {
  const r = cv.getBoundingClientRect();
  const cx = (e.touches ? e.touches[0].clientX : e.clientX), cy = (e.touches ? e.touches[0].clientY : e.clientY);
  return { x: (cx - r.left) * W / r.width, y: (cy - r.top) * H / r.height };
}
function inBtn(p, b) { return p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h; }
cv.addEventListener('pointerdown', e => {
  audio();
  const p = toGame(e);
  if (G.state === 'over') { toTitle(); return; }  // 👎 界面：点任意处回开始界面
  if (G.state === 'title') {
    if (inBtn(p, MUTE_BTN)) { toggleMute(); return; }
    const hitBox = TITLE_BOXES.find(b => p.x >= b.x && p.x <= b.x + 118 && p.y >= b.y && p.y <= b.y + 118);
    const hitOk = Math.hypot(p.x - OKC.x, p.y - OKC.y) <= OKC.r + 10;
    if (!isAdmin()) { if (hitBox || hitOk) openCodeBox(); return; }  // 未解锁：点任意框体都弹验证码框
    if (hitBox) {
      if (hitBox.id === 'bin') { startRun('catch'); return; }
      shipId = hitBox.id; try { localStorage.setItem('jieya_ship', shipId); } catch (err) {}
      startRun('shoot'); return;
    }
    return;
  }
  if (G.state === 'play') {
    if (G.paused) {
      if (Math.hypot(p.x - 168, p.y - 360) <= 64) { toTitle(); return; }        // ⭕ 回标题（退出）
      if (Math.hypot(p.x - 312, p.y - 360) <= 64) { G.paused = false; return; }  // ❌ 关掉暂停、继续打
      return;
    }
    if (inBtn(p, PAUSE_BTN)) { G.paused = true; return; }
    if (inBtn(p, MUTE_BTN)) { toggleMute(); return; }
    ptr.active = true; ptr.id = e.pointerId; ptr.x = p.x;
    ptr.off = (G.mode === 'catch' ? B.x : P.x) - p.x; ptr.target = (G.mode === 'catch' ? B.x : P.x);
    ptr.offY = P.y - p.y; ptr.targetY = P.y; ptr.vx = 0; ptr.lastT = performance.now();
    try { cv.setPointerCapture(e.pointerId); } catch (err) {}
  }
});
cv.addEventListener('pointermove', e => {
  if (!ptr.active || e.pointerId !== ptr.id || G.state !== 'play' || G.paused) return;
  const p = toGame(e);
  ptr.x = p.x; ptr.lastT = performance.now();
  ptr.target = Math.max(22, Math.min(W - 22, p.x + ptr.off));
  ptr.targetY = Math.max(52, Math.min(700, p.y + ptr.offY));
});
function ptrEnd(e) { if (e.pointerId === ptr.id) { ptr.active = false; ptr.vx = 0; } }
addEventListener('pointerup', ptrEnd);
addEventListener('pointercancel', ptrEnd);
function fit() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  cv.style.width = (W * s | 0) + 'px'; cv.style.height = (H * s | 0) + 'px';
}
addEventListener('resize', fit); fit();
// ===== 验证码（部署测试，同旧方案：服务器 /api/activate 优先，本地管理码回退） =====
const codeBox = document.getElementById('codeBox'), codeInput = document.getElementById('codeInput'), codeOk = document.getElementById('codeOk'), codePanel = document.getElementById('codePanel');
let adminFlag = false;
try { adminFlag = localStorage.getItem('jieya_admin') === '1'; } catch (e) {}
function isAdmin() { return adminFlag; }
function deviceId() { try { let d = localStorage.getItem('jieya_device'); if (!d) { d = 'd' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36); localStorage.setItem('jieya_device', d); } return d; } catch (e) { return 'dev'; } }
function openCodeBox() { codeBox.style.display = 'flex'; codeInput.value = ''; codeOk.textContent = '⭕'; setTimeout(() => codeInput.focus(), 60); }
function closeCodeBox() { codeBox.style.display = 'none'; }
codeBox.addEventListener('pointerdown', e => { if (e.target === codeBox) closeCodeBox(); });
function codeSuccess() {
  adminFlag = true;
  try { localStorage.setItem('jieya_admin', '1'); localStorage.setItem('jieya_code', codeInput.value.trim().toUpperCase()); } catch (e) {}
  closeCodeBox();
}
function codeFail() {
  codePanel.style.animation = 'shk .45s';
  setTimeout(() => { codePanel.style.animation = ''; }, 500);
}
codeOk.addEventListener('click', async () => {
  const code = codeInput.value.trim().toUpperCase();
  if (!code) { codeFail(); return; }
  let done = false;
  if (location.protocol === 'http:' || location.protocol === 'https:') {
    try {
      const r = await fetch('/api/activate', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ code, deviceId: deviceId() }) });
      const d = await r.json();
      if (d && d.ok) { codeSuccess(); done = true; }
      else if (d) { codeFail(); done = true; }
    } catch (e) {}
  }
  if (!done) { if (code === ADMIN_CODE.toUpperCase()) codeSuccess(); else codeFail(); }
});
document.getElementById('codeCancel').addEventListener('click', closeCodeBox);  // ❌ 返回标题（仍未解锁）
codeInput.addEventListener('keydown', e => { e.stopPropagation(); if (e.key === 'Enter') codeOk.click(); });
window.G = G; window.P = P;
window.T = { foes: () => foes, bullets: () => bullets, pile: () => settled, settled: () => settled, parts: () => parts, pops: () => pops,
  forceSpawn, spawnFoe, spawnBoss, spawnLucky, spawnBomb, spawnCatch, spawnFoePlain, explodePile, pickSpeed, startRun, toTitle, grandShatter, damagePlayer, pileTop, texts: () => texts,
  bin: () => B, isAdmin, openCodeBox, setPaused: v => { G.paused = v; },
  setShip: id => { shipId = id; }, getShip: () => shipId };
</script>
