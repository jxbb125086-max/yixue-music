<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>视频通话 · 钢琴课</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; background:#0b0e13; color:#f2f4f8; font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; overflow:hidden; }
  button { font-family:inherit; }
  /* ---------- 落地页 ---------- */
  .home { height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; padding:24px; text-align:center;
          background:radial-gradient(120% 90% at 50% 0%, #1b2740 0%, #0b0e13 60%); }
  .home h1 { font-size:26px; font-weight:600; letter-spacing:2px; }
  .home p { color:#9fb0c9; font-size:14px; line-height:1.7; max-width:340px; }
  .big-btn { border:none; border-radius:999px; padding:16px 42px; font-size:18px; font-weight:600; color:#131a26;
             background:linear-gradient(180deg,#ffd98a,#f0b95a); box-shadow:0 8px 24px rgba(240,185,90,.35); cursor:pointer; }
  .big-btn:active { transform:scale(.97); }
  .link-box { display:none; width:100%; max-width:420px; background:#131a26; border:1px solid #2a3560; border-radius:14px; padding:14px; }
  .link-box .url { word-break:break-all; font-size:13px; color:#ffd98a; background:#0b0e13; border-radius:8px; padding:10px; margin:10px 0; }
  .row { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
  .sub-btn { border:1px solid #3a4560; background:#1a2334; color:#f2f4f8; border-radius:999px; padding:11px 22px; font-size:15px; cursor:pointer; }
  .err { color:#ff8a8a; font-size:14px; min-height:20px; }
  .code { font-size:30px; letter-spacing:6px; color:#ffd98a; font-weight:700; }
  /* ---------- 通话页：分屏 ---------- */
  #viewCall { position:fixed; inset:0; display:none; background:#05070a; flex-direction:column; }
  #panes { flex:1; display:flex; flex-direction:column; min-height:0; }
  @media (min-width:820px) and (min-aspect-ratio:1/1) { #panes { flex-direction:row; } }
  .pane { position:relative; flex:1 1 0; min-height:0; min-width:0; background:#000; overflow:hidden; }
  .pane + .pane { border-top:2px solid #1c2536; }
  @media (min-width:820px) and (min-aspect-ratio:1/1) { .pane + .pane { border-top:none; border-left:2px solid #1c2536; } }
  @media (min-width:820px) { .pane .pane-btns { top:54px; } }
  .pane video { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; background:#000; }
  #localVideo.mirror { transform:scaleX(-1); }
  .pane .tag { position:absolute; left:10px; top:10px; z-index:4; background:rgba(10,14,20,.6); backdrop-filter:blur(6px);
               padding:5px 12px; border-radius:999px; font-size:12px; color:#dbe4f2; }
  .pane .pane-btns { position:absolute; right:10px; top:10px; z-index:4; display:flex; gap:8px; }
  .pane-btn { border:1px solid rgba(255,255,255,.25); background:rgba(10,14,20,.6); backdrop-filter:blur(6px); color:#fff;
              border-radius:999px; padding:7px 14px; font-size:13px; cursor:pointer; }
  .pane-btn.back { display:none; }
  /* 最大化：被点的 pane 独占，另一 pane 隐藏；该 pane 显示「返回」 */
  #viewCall.focus .pane { display:none; }
  #viewCall.focus .pane.maxed { display:block; }
  #viewCall.focus .pane.maxed .pane-btn.max { display:none; }
  #viewCall.focus .pane.maxed .pane-btn.back { display:block; }
  .pane .hint { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; z-index:3; color:#9fb0c9;
                font-size:15px; text-align:center; padding:26px; line-height:1.8; pointer-events:none; }
  #statusPill { position:absolute; left:50%; transform:translateX(-50%); top:calc(10px + env(safe-area-inset-top)); z-index:8;
                background:rgba(10,14,20,.65); backdrop-filter:blur(6px); padding:7px 15px; border-radius:999px; font-size:13px; color:#dbe4f2; white-space:nowrap; }
  #statusPill .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:#f0b95a; margin-right:7px; vertical-align:1px; }
  #statusPill.on .dot { background:#4ade80; }
  .controls { position:relative; z-index:8; display:flex; justify-content:center; gap:14px; padding:12px 10px calc(14px + env(safe-area-inset-bottom));
              background:#0b0e13; }
  .ctl { width:56px; height:56px; border-radius:50%; border:none; font-size:22px; cursor:pointer; background:rgba(38,50,74,.95); color:#fff;
         display:flex; align-items:center; justify-content:center; }
  .ctl-wrap { display:flex; flex-direction:column; align-items:center; gap:5px; }
  .ctl-wrap span { font-size:10px; color:#c8d4e8; }
  .ctl.off { background:#c0392b; }
  .ctl.hang { background:#c0392b; transform:rotate(135deg); }
</style>
</head>
<body>

<!-- 落地页 -->
<div class="home" id="viewHome">
  <h1>🎹 视频通话</h1>
  <p id="homeTip">点下方按钮创建通话，把链接发给学生，<br>学生点开链接就能直接进来。</p>
  <div class="code" id="roomCodeShow" style="display:none"></div>
  <button class="big-btn" id="btnMain">创建通话</button>
  <div class="link-box" id="linkBox">
    <div style="font-size:13px;color:#9fb0c9">把这个链接发给学生：</div>
    <div class="url" id="shareUrl"></div>
    <div class="row">
      <button class="sub-btn" id="btnCopy">📋 复制链接</button>
      <button class="sub-btn" id="btnEnter">进入通话 →</button>
    </div>
  </div>
  <div class="err" id="homeErr"></div>
</div>

<!-- 通话页 -->
<div id="viewCall">
  <div id="statusPill"><span class="dot"></span><span id="statusText">正在连接…</span></div>
  <div id="panes">
    <div class="pane" id="paneLocal">
      <video id="localVideo" autoplay playsinline muted></video>
      <div class="tag">我</div>
      <div class="pane-btns">
        <button class="pane-btn max" data-max="paneLocal">⛶ 最大化</button>
        <button class="pane-btn back">↩ 返回</button>
      </div>
    </div>
    <div class="pane" id="paneRemote">
      <video id="remoteVideo" autoplay playsinline></video>
      <div class="tag">对方</div>
      <div class="hint" id="waitingTip">等待对方加入…<br><span style="font-size:13px">把链接发给对方，对方点开就能进来</span></div>
      <div class="pane-btns">
        <button class="pane-btn max" data-max="paneRemote">⛶ 最大化</button>
        <button class="pane-btn back">↩ 返回</button>
      </div>
    </div>
  </div>
  <div class="controls">
    <div class="ctl-wrap"><button class="ctl" id="btnMic">🎤</button><span>静音</span></div>
    <div class="ctl-wrap"><button class="ctl" id="btnCam">📷</button><span>摄像头</span></div>
    <div class="ctl-wrap"><button class="ctl" id="btnFlip">🔄</button><span>翻转</span></div>
    <div class="ctl-wrap"><button class="ctl hang" id="btnHang">📞</button><span>挂断</span></div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
"use strict";
const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);
let roomCode = (params.get("room") || "").toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 12);
let socket = null, pc = null, localStream = null;
let initiator = false, makingOffer = false, polite = true;
let facing = "user";  // 默认自拍（前置）摄像头
let micOn = true, camOn = true, callTimer = null, callStartAt = 0;
const pendingCandidates = [];

const ICE_SERVERS = [
  { urls: "stun:stun.l.google.com:19302" },
  { urls: "stun:stun1.l.google.com:19302" },
  { urls: "turn:openrelay.metered.ca:80", username: "openrelayproject", credential: "openrelayproject" },
  { urls: "turn:openrelay.metered.ca:443", username: "openrelayproject", credential: "openrelayproject" },
  { urls: "turn:openrelay.metered.ca:443?transport=tcp", username: "openrelayproject", credential: "openrelayproject" }
];

/* ---------------- 落地页 ---------------- */
function genCode() {
  const chars = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";
  let s = "";
  for (let i = 0; i < 6; i++) s += chars[Math.floor(Math.random() * chars.length)];
  return s;
}
function shareLink(code) { return location.origin + location.pathname + "?room=" + code; }

if (roomCode) {
  $("homeTip").innerHTML = "你收到了一个通话邀请，<br>点下方按钮即可加入。";
  $("roomCodeShow").style.display = "block";
  $("roomCodeShow").textContent = roomCode;
  $("btnMain").textContent = "加入通话";
}
$("btnMain").onclick = async () => {
  $("homeErr").textContent = "";
  if (!roomCode) {
    roomCode = genCode();
    history.replaceState(null, "", "?room=" + roomCode);
    $("roomCodeShow").style.display = "block";
    $("roomCodeShow").textContent = roomCode;
    $("shareUrl").textContent = shareLink(roomCode);
    $("linkBox").style.display = "block";
    $("btnMain").style.display = "none";
    $("homeTip").textContent = "通话已创建。把链接发给学生后，点「进入通话」等他进来即可。";
    return;
  }
  enterCall();
};
$("btnCopy").onclick = async () => {
  try { await navigator.clipboard.writeText(shareLink(roomCode)); $("btnCopy").textContent = "✅ 已复制"; }
  catch (e) { prompt("复制这个链接发给学生：", shareLink(roomCode)); }
  setTimeout(() => $("btnCopy").textContent = "📋 复制链接", 1600);
};
$("btnEnter").onclick = () => enterCall();

/* ---------------- 分屏：最大化 / 返回 ---------------- */
document.querySelectorAll(".pane-btn.max").forEach(btn => {
  btn.onclick = () => {
    const pane = $(btn.dataset.max);
    document.querySelectorAll(".pane").forEach(p => p.classList.remove("maxed"));
    pane.classList.add("maxed");
    $("viewCall").classList.add("focus");
    tryPlayAll();
  };
});
document.querySelectorAll(".pane-btn.back").forEach(btn => {
  btn.onclick = () => {
    $("viewCall").classList.remove("focus");
    document.querySelectorAll(".pane").forEach(p => p.classList.remove("maxed"));
    tryPlayAll();
  };
});

/* ---------------- 媒体 ---------------- */
function audioConstraints() {
  // 固定平衡配置：回声消除开（防回声）；降噪/自动增益关（这两项最伤琴声）；
  // 人声在正常房间里依然清晰，琴声细节完整保留。
  return { echoCancellation: true, noiseSuppression: false, autoGainControl: false, channelCount: 2 };
}
async function getMedia() {
  return navigator.mediaDevices.getUserMedia({
    video: { facingMode: facing, width: { ideal: 1280 }, height: { ideal: 720 } },
    audio: audioConstraints()
  });
}
// 给 Opus 写上立体声 + 高码率，琴声才不糊、人声也更透
function mungeSDP(sdp) {
  const lines = sdp.split("\r\n");
  let opusPt = null;
  for (const line of lines) {
    const rtp = line.match(/^a=rtpmap:(\d+) opus\/48000/);
    if (rtp) { opusPt = rtp[1]; break; }
  }
  if (!opusPt) return sdp;
  const fmtp = "a=fmtp:" + opusPt + " minptime=10;useinbandfec=1;stereo=1;sprop-stereo=1;maxaveragebitrate=256000;maxplaybackrate=48000;cbr=0";
  let done = false;
  for (let i = 0; i < lines.length; i++) {
    if (lines[i].startsWith("a=fmtp:" + opusPt)) { lines[i] = fmtp; done = true; break; }
  }
  if (!done) {
    for (let i = 0; i < lines.length; i++) {
      if (lines[i].startsWith("a=rtpmap:" + opusPt)) { lines.splice(i + 1, 0, fmtp); break; }
    }
  }
  return lines.join("\r\n");
}
// 移动端浏览器常拦截远端视频自动播放：主动 play，被拦时等下一次点按再试
function tryPlay(video) {
  if (!video || !video.srcObject) return;
  const p = video.play();
  if (p) p.catch(() => {});
}
function tryPlayAll() { tryPlay($("remoteVideo")); tryPlay($("localVideo")); }
document.addEventListener("click", () => tryPlayAll(), true);

/* ---------------- 通话 ---------------- */
function setStatus(text, on) {
  $("statusText").textContent = text;
  $("statusPill").classList.toggle("on", !!on);
}
async function enterCall() {
  $("homeErr").textContent = "";
  try {
    localStream = await getMedia();
  } catch (e) {
    $("homeErr").textContent = "无法打开摄像头/麦克风，请在浏览器里允许访问后重试。";
    return;
  }
  $("viewHome").style.display = "none";
  $("viewCall").style.display = "flex";
  $("localVideo").srcObject = localStream;
  $("localVideo").classList.toggle("mirror", facing === "user");
  tryPlay($("localVideo"));
  try { await navigator.wakeLock.request("screen"); } catch (e) {}
  connectSignaling();
}
function connectSignaling() {
  socket = io();
  socket.on("connect", () => socket.emit("join", roomCode));
  socket.on("join-error", msg => { setStatus(msg, false); $("waitingTip").innerHTML = msg; });
  socket.on("joined", ({ initiator: isInit }) => {
    initiator = isInit;
    polite = !isInit;
    makePC();
    if (initiator) negotiate();
  });
  socket.on("peer-joined", () => { if (pc && initiator) negotiate(); });
  socket.on("peer-left", () => {
    $("waitingTip").style.display = "flex";
    $("waitingTip").innerHTML = "对方已离开，等待重新加入…";
    setStatus("对方已离开", false);
    stopTimer();
  });
  socket.on("signal", async (data) => {
    if (!pc) makePC();
    try {
      if (data.type === "renegotiate") { if (initiator) negotiate(); return; }
      if (data.description) {
        const desc = data.description;
        const collision = desc.type === "offer" && (makingOffer || pc.signalingState !== "stable");
        if (collision && !polite) return;
        await pc.setRemoteDescription(desc);
        flushCandidates();
        if (desc.type === "offer") {
          const answer = await pc.createAnswer();
          answer.sdp = mungeSDP(answer.sdp);
          await pc.setLocalDescription(answer);
          socket.emit("signal", { description: pc.localDescription });
        }
      } else if (data.candidate) {
        if (pc.remoteDescription) await pc.addIceCandidate(data.candidate);
        else pendingCandidates.push(data.candidate);
      }
    } catch (e) { console.warn("signal error", e); }
  });
}
function flushCandidates() {
  while (pendingCandidates.length) {
    const c = pendingCandidates.shift();
    pc.addIceCandidate(c).catch(() => {});
  }
}
function makePC() {
  if (pc) return;
  pc = new RTCPeerConnection({ iceServers: ICE_SERVERS, bundlePolicy: "max-bundle" });
  localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
  pc.onicecandidate = e => { if (e.candidate) socket.emit("signal", { candidate: e.candidate }); };
  pc.ontrack = e => {
    const rv = $("remoteVideo");
    if (rv.srcObject !== e.streams[0]) rv.srcObject = e.streams[0];
    $("waitingTip").style.display = "none";
    tryPlay(rv);
    // 画面真正开始动才算到达：监听轨道静音/恢复，给用户明确反馈
    e.track.onunmute = () => { $("waitingTip").style.display = "none"; tryPlay(rv); };
  };
  pc.oniceconnectionstatechange = () => {
    const st = pc.iceConnectionState;
    if (st === "connected" || st === "completed") { setStatus("已接通", true); startTimer(); tryPlayAll(); }
    else if (st === "disconnected") setStatus("连接不稳定…", false);
    else if (st === "failed") { setStatus("连接失败，重连中…", false); if (initiator) negotiate(true); }
  };
}
async function negotiate(iceRestart) {
  if (!pc || makingOffer) return;
  makingOffer = true;
  try {
    const offer = await pc.createOffer(iceRestart ? { iceRestart: true } : {});
    offer.sdp = mungeSDP(offer.sdp);
    await pc.setLocalDescription(offer);
    socket.emit("signal", { description: pc.localDescription });
  } catch (e) { console.warn("negotiate error", e); }
  makingOffer = false;
}
function startTimer() {
  if (callTimer) return;
  callStartAt = Date.now();
  callTimer = setInterval(() => {
    const s = Math.floor((Date.now() - callStartAt) / 1000);
    const mm = String(Math.floor(s / 60)).padStart(2, "0"), ss = String(s % 60).padStart(2, "0");
    setStatus("已接通 " + mm + ":" + ss, true);
  }, 1000);
}
function stopTimer() { clearInterval(callTimer); callTimer = null; }

/* ---------------- 通话中控制 ---------------- */
$("btnMic").onclick = () => {
  micOn = !micOn;
  localStream.getAudioTracks().forEach(t => t.enabled = micOn);
  $("btnMic").classList.toggle("off", !micOn);
  $("btnMic").textContent = micOn ? "🎤" : "🔇";
};
$("btnCam").onclick = () => {
  camOn = !camOn;
  localStream.getVideoTracks().forEach(t => t.enabled = camOn);
  $("btnCam").classList.toggle("off", !camOn);
  $("btnCam").textContent = camOn ? "📷" : "🚫";
};
$("btnFlip").onclick = async () => {
  facing = facing === "environment" ? "user" : "environment";
  try {
    const s = await navigator.mediaDevices.getUserMedia({ video: { facingMode: facing, width: { ideal: 1280 }, height: { ideal: 720 } } });
    const track = s.getVideoTracks()[0];
    const old = localStream.getVideoTracks()[0];
    const sender = pc && pc.getSenders().find(x => x.track && x.track.kind === "video");
    if (sender) await sender.replaceTrack(track);
    localStream.removeTrack(old); old.stop();
    localStream.addTrack(track);
    $("localVideo").srcObject = localStream;
    $("localVideo").classList.toggle("mirror", facing === "user");
    tryPlay($("localVideo"));
    camOn = true; $("btnCam").classList.remove("off"); $("btnCam").textContent = "📷";
  } catch (e) { console.warn("flip failed", e); }
};
$("btnHang").onclick = () => {
  try { pc && pc.close(); socket && socket.disconnect(); } catch (e) {}
  location.href = location.pathname;
};
window.addEventListener("beforeunload", () => { try { pc && pc.close(); } catch (e) {} });
</script>
</body>
</html>
